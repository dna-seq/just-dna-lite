[project]
name = "just-dna-pipelines"
version = "0.2.3"
description = "Genomic Database Management and Annotation Tool"
readme = "README.md"
authors = [
    { name = "antonkulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # >=2.7.0 is the first PyPI release containing agno-agi/agno#7674
    # (AccuracyResult stat-field fix); previously pinned to a git rev because
    # the fix was unreleased. See docs/reviews/pr-28-windows-installer.md.
    # Do not float to 3.x alphas.
    "agno>=2.9.0",
    "aiohttp>=3.14.3",
    "anthropic>=0.121.0",
    "dagster>=1.13.17",
    "dagster-duckdb>=0.29.17",
    "dagster-webserver>=1.13.17",
    "eliot>=1.18.0",
    "fsspec>=2026.7.0",
    "google-genai>=1.75.0,<2.0",
    "huggingface-hub>=1.27.0",
    # 0.6.1, never 0.6.0: 0.6.0 shipped eight defects fixed the next day (upstream RM93-RM100),
    # one of which (RM95) let a non-vocabulary `measure_kind` spelling into `content_signature` —
    # the one identity that cannot be taken back, since it claims a global dedup slot.
    #
    # The enricher is one patch ahead of the other two and that is the correct state: 0.6.2 is
    # enricher-only (RM101), giving every pass an unavailability subclass so "the source is down"
    # and "your data is wrong" are separable by type rather than by reading `exc.__cause__`.
    "just-dna-compiler>=0.6.1",
    "just-dna-enricher>=0.6.2",
    "just-dna-format>=0.6.1",
    # agno's MCP toolkit (agents/module_creator.py) imports `McpError` from
    # mcp.shared.exceptions and `streamablehttp_client` from mcp.client.streamable_http;
    # mcp 2.0.0 removed both, so `from agno.tools.mcp import MCPTools` raises ImportError.
    # Still broken as of agno 2.9.0. Drop the cap once agno supports mcp 2.x.
    "mcp>=1.29.0,<2.0",
    "numpy>=2.5.2",
    "openai>=3.0.0",
    "pillow>=12.3.0",
    "polars-bio>=0.33.1",
    "pooch>=1.9.0",
    "psutil>=7.2.2",
    "pycomfort>=0.0.18",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.scripts]
pipelines = "just_dna_pipelines.cli:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "marimo>=0.23.16",
    "pytest>=9.1.1",
    "python-lsp-server[all]>=1.15.0",
    "ruff>=0.16.3",
    "sqlglot>=30.17.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0",
]

[tool.pytest.ini_options]
markers = [
    "large_download: marks tests that download large files (multi-GB) - skip by default",
    "integration: marks integration tests that require network access",
    "slow: marks tests that take a long time to run"
]

# Default pytest behavior: extra verbose and no capture to allow Eliot/stdout output
addopts = "-vvv -s -m 'not large_download'"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:eliottree.*",
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]


[tool.marimo.runtime]
dotenv = [".env"]
