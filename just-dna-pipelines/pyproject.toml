[project]
name = "just-dna-pipelines"
version = "0.2.5"
description = "Genomic Database Management and Annotation Tool"
readme = "README.md"
authors = [
    { name = "antonkulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # >=2.7.0 was the first PyPI release containing agno-agi/agno#7674 (AccuracyResult
    # stat-field fix). The `[mcp]` extra below carries the floor now; see that comment.
    "aiohttp>=3.14.3",
    "anthropic>=0.121.0",
    "dagster>=1.13.17",
    "dagster-duckdb>=0.29.17",
    "dagster-webserver>=1.13.17",
    "eliot>=1.18.0",
    "fsspec>=2026.7.0",
    "google-genai>=1.75.0,<2.0",
    "huggingface-hub>=1.27.0",
    # The 0.7 line (adopted 2026-09-21): format 0.7.0, compiler and enricher 0.7.1 — a partial cut,
    # the shape 0.6.3/0.6.4 used. The compiler moves with the enricher because enricher 0.7.1
    # imports `just_dna_compiler.resolution_findings`, added after v0.7.0 was tagged; a 0.7.0
    # compiler beside a 0.7.1 enricher is a ModuleNotFoundError in a clean venv. The three floors
    # move together with the registry floor at the workspace root (`contract_compatible` treats a
    # 0.x format minor as breaking). See CLAUDE.md § "What 0.7 changed on our side".
    "just-dna-compiler>=0.7.1",
    "just-dna-enricher>=0.7.1",
    "just-dna-format>=0.7.0",
    # agno 3.x imports the mcp 2.x names (`MCPError`, `streamable_http_client`) and `fastmcp`,
    # all declared only under its `[mcp]` extra. Depend on the extra rather than re-listing its
    # members: the 2026-09 relock floated agno to 3.0.10 against a bare `mcp<2.0` cap here, and
    # `from agno.tools.mcp import MCPTools` died at import, taking the webui and the `pipelines`
    # CLI with it. agno 2.x wanted the opposite cap (`McpError`, mcp<2); do not float back.
    "agno[mcp]>=3.0.10",
    "numpy>=2.5.2",
    "openai>=3.0.0",
    "pillow>=12.3.0",
    "polars-bio>=0.35.1",
    "pooch>=1.9.0",
    "psutil>=7.2.2",
    "pycomfort>=0.0.18",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.scripts]
pipelines = "just_dna_pipelines.cli:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "marimo>=0.23.16",
    "pytest>=9.1.1",
    "python-lsp-server[all]>=1.15.0",
    "ruff>=0.16.3",
    "sqlglot>=30.17.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0",
]

[tool.pytest.ini_options]
markers = [
    "large_download: marks tests that download large files (multi-GB) - skip by default",
    "integration: marks integration tests that require network access",
    "slow: marks tests that take a long time to run"
]

# Default pytest behavior: extra verbose and no capture to allow Eliot/stdout output
addopts = "-vvv -s -m 'not large_download'"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:eliottree.*",
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]


[tool.marimo.runtime]
dotenv = [".env"]
