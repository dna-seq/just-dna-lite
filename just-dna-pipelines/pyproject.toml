[project]
name = "just-dna-pipelines"
version = "0.2.7"
description = "Genomic Database Management and Annotation Tool"
readme = "README.md"
authors = [
    { name = "antonkulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # >=2.7.0 was the first PyPI release containing agno-agi/agno#7674 (AccuracyResult
    # stat-field fix). The `[mcp]` extra below carries the floor now; see that comment.
    "aiohttp>=3.14.3",
    "anthropic>=0.121.0",
    "dagster>=1.13.28",
    "dagster-duckdb>=0.29.28",
    "dagster-webserver>=1.13.28",
    "eliot>=1.18.0",
    "fsspec>=2026.7.0",
    "google-genai>=1.75.0,<2.0",
    "huggingface-hub>=1.27.0",
    # The 0.8 line (adopted 2026-11-12, cut 0.8.0 on 2026-11-05, current patch 0.8.5): all three
    # floor at 0.8.5 and move together with the registry floor at the workspace root
    # (`contract_compatible` treats a 0.x format minor as breaking; both registries serve 0.8.4).
    # What 0.8 changed for us: upstream docs/INTEGRATION_0_8.md (just-dna-compiler) § 3, and
    # CLAUDE.md § "Shared format libraries". A 0.7 reader refuses every 0.8-written verification
    # block, so this pin is what lets us read modules the registry now publishes. The enricher's
    # `ensembl` lane (`just-dna-seq/ensembl_variations_split`) is the only Ensembl downloader here.
    # The bare `just-dna-enricher` (no `[atlas]` extra) still pulls no protobuf floor.
    "just-dna-compiler>=0.8.5",
    "just-dna-enricher>=0.8.5",
    "just-dna-format>=0.8.5",
    # agno 3.x imports the mcp 2.x names (`MCPError`, `streamable_http_client`) and `fastmcp`,
    # all declared only under its `[mcp]` extra. Depend on the extra rather than re-listing its
    # members: the 2026-09 relock floated agno to 3.0.10 against a bare `mcp<2.0` cap here, and
    # `from agno.tools.mcp import MCPTools` died at import, taking the webui and the `pipelines`
    # CLI with it. agno 2.x wanted the opposite cap (`McpError`, mcp<2); do not float back.
    "agno[mcp]>=3.0.10",
    "numpy>=2.5.2",
    "openai>=3.0.0",
    "pillow>=12.3.0",
    "polars>=2.1.0",
    "polars-bio>=0.37.0",
    "pooch>=1.9.0",
    "psutil>=7.2.2",
    "pycomfort>=0.0.18",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
    "fastmcp>=4.0.10",
]

[project.scripts]
pipelines = "just_dna_pipelines.cli:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "marimo>=0.23.16",
    "pytest>=9.1.1",
    "python-lsp-server[all]>=1.15.0",
    "ruff>=0.16.3",
    "sqlglot>=30.17.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0",
]

[tool.pytest.ini_options]
markers = [
    "large_download: marks tests that download large files (multi-GB) - skip by default",
    "integration: marks integration tests that require network access",
    "slow: marks tests that take a long time to run"
]

# Default pytest behavior: extra verbose and no capture to allow Eliot/stdout output
addopts = "-vvv -s -m 'not large_download'"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:eliottree.*",
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]


[tool.marimo.runtime]
dotenv = [".env"]
