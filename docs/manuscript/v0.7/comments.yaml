  master: paper1-just-dna-lite.md
  anchor: Just-DNA-Lite gives people and researchers a local way to read a genome against published evidence. It
    offers polygenic scoring of the PGS Catalog with the context to read each result (ancestry-matched percentiles
    for 6,117 scores, coverage, quality labels and every model for a trait side by side), a registry of installable
    annotation modules that grows as researchers publish them, whole-genome annotation in about a minute, and the
    same operations from a web interface, AI assistants and Python libraries. The reported benchmarks show annotation
    128 to 181 times faster than the configured workflow of the OakVar-based Generation I system run on the same
    machine, on the two call sets Generation I ran on, and close numerical agreement between scoring engines on
    one genome; Generation II annotation was timed on three call sets from three people. Evaluation across individuals,
    reference populations and matched-variant sets remains necessary to establish the broader reliability of these
    workflows. The platform provides infrastructure for research and education, without establishing clinical validity
    for the findings it reports. Its public demonstration runs on public genomes, and a local installation analyses
    a user’s own genome on their own computer.
