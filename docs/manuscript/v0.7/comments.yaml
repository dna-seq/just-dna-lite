  key: paper1-just-dna-lite.md|G Fue|2026-10-31T16:19:15Z|(e.g., xxx, yyy)
  master: paper1-just-dna-lite.md
  anchor: 'Existing solutions for reading a personal genome generally belong to two extremes. Commercial platforms
    such as DNA Complete (formerly Nebula Genomics) and Dante Labs provide curated reports, but the curation is
    opaque: users cannot verify which polymorphisms contributed to a score, whether the methodology is appropriate
    for their ancestry, or how findings were weighted. At the other end, research-grade tools like PLINK (Chang
    et al., 2015), ANNOVAR (Wang et al., 2010) and VEP (McLaren et al., 2016) are powerful but demand command-line
    proficiency and a lengthy setup. Open-source projects between these extremes each cover part of the task, such
    as local annotation with installable modules, ancestry-normalized scoring of models from the PGS Catalog (the
    open database of published polygenic scores) or access to a genome from an AI assistant. Table S7 compares the
    documented features of 23 tools for personal-genome annotation, polygenic scoring and AI-assisted interpretation;
    none of them documents a graphical interface, annotation sets added without code, PGS Catalog scoring and ancestry-matched
    percentiles together.'
  context_before: workflow and costing scope (Mordaunt et al., 2024; Ehman et al., 2025).
  context_after: 'Our own starting point was longevity research: the first generation of this'
  comment: 'Suggested edits: insert “(e.g., xxx, yyy)”.'
  edits:
  - inserted: '(e.g., xxx, yyy) '
  where: 1.1 Background and Significance
  line: 55
  status: open
  now: ''
  why: ''
  next: 'Keep the place Georg marked but fill ''(e.g., xxx, yyy)'' from Table S7, one tool per part of the task the
    sentence lists: OpenCRAVAT (Pagel et al., 2020) for local annotation with installable modules, pgsc_calc (Lambert
    et al., 2024) or GenoPred (Pain et al., 2024) for ancestry-normalized PGS Catalog scoring, and GeneChat MCP (Costello,
    2026) for access from an AI assistant. This also answers C51 and C52.'
  category: References
  severity: minor
