  anchor: Just-DNA-Lite starts from the view that people have the right to read and explore their own genomic data,
    and that well-intentioned researchers have the right to work with public genomes without a gatekeeper’s permission.
    Many data-protection laws give people a right of access to their personal data. In the European Union, for example,
    the GDPR’s right of access (Article 15) entitles individuals to obtain a copy of their personal data, and the
    emerging European Health Data Space is designed to give people access to and control over their own health information.
    A tool that runs locally and shows users useful information in their own genome helps them exercise a right
    they already have.
