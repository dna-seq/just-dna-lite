  anchor: 'The platform connects a genome to the evidence used to annotate it: an individual variant’s supporting
    studies and the reference population behind a polygenic percentile. Because the same operations are reachable
    from a web interface, an AI assistant or a Python library, one installation serves people reading their own
    genome, researchers who publish and test modules, and developers who build on its libraries (Box 1). The Longevity
    Variants example makes that connection visible at one locus; the module format lets researchers extend it to
    other questions without changing the annotation engine. Local execution and visible provenance address two practical
    barriers to exploration: having to upload the genome to a third-party server, and curation that users cannot
    verify. Their value depends on the underlying calls, studies and curation, whose limits are discussed below.'
