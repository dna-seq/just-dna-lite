  key: paper1-just-dna-lite.md|G Fue|2026-11-01T07:03:08Z|that
  master: paper1-just-dna-lite.md
  anchor: 'The reference superpopulation is chosen by a k-nearest-neighbour classifier on principal components,
    built once from the 1000 Genomes high-coverage panel (Byrska-Bishop et al., 2022) and downloaded as a fixed
    model (HuggingFace dataset just-dna-seq/pgs-catalog, folder data/ancestry). Its training data are the panel’s
    unrelated individuals, 2,575 after related ones were removed with a KING kinship list (Manichaikul et al., 2010),
    each labelled with one of five superpopulations (AFR 681, AMR 351, EAS 507, EUR 525, SAS 511), and 53,526 autosomal
    biallelic SNVs kept after quality control and linkage pruning in PLINK2 (Chang et al., 2015): minor allele frequency
    at least 0.05, Hardy–Weinberg P at least 10⁻⁴, and r² below 0.05 within windows of 1,000 variants. A principal
    component analysis of these genotypes defines the space. A user’s genome is projected into it with the online
    augmentation, decomposition and Procrustes method of FRAPOSA (Zhang et al., 2020), and its superpopulation is
    the majority among its 20 nearest reference individuals on the first 10 components. Model sites a variant-only
    VCF does not list are coded as homozygous reference, and sites whose alleles disagree with the model as missing.
    When fewer than 20% of the model’s sites can be used, the ancestry is reported as unknown and the user chooses
    the reference. Sites coded as homozygous reference count as used, so for exome or array input, where most model
    sites are not read, the call rests largely on assumed genotypes. Section 4.4 reports how well the classifier
    separates the reference superpopulations.'
