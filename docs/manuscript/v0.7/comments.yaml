  anchor: 'That raw data can now come from sequencing: several companies offer direct-to-consumer sequencing services
    (O’Daniel et al., 2025). The National Human Genome Research Institute (NHGRI) estimates that the first human
    genome cost US$500 million to US$1 billion (NHGRI, 2021). By 2025, manufacturers advertised the sequencing of
    a human genome for US$80 to US$200 (Illumina, 2023; Ultima Genomics, 2025). Clinical laboratory studies report
    higher costs after including labour, computing and analysis, with estimates depending on the workflow and costing
    scope (Mordaunt et al., 2024; Ehman et al., 2025).'
