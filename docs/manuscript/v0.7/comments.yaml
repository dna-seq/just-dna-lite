  anchor: Core annotation and PRS computation use local genome files, cached reference datasets and local result
    storage. Downloading reference data does not require uploading the user’s genome. This architecture reduces
    the need to disclose genomic data to a hosted analysis service. However, local execution is not a guarantee
    against disclosure through other parts of the workflow, and the optional AI explanations and MCP clients need
    a privacy assessment of their own. In an annotation report, each variant row with an rsID has buttons that open
    a prepared question about it in ChatGPT, Claude, Perplexity or Grok. Following one sends that variant’s genotype,
    gene and stored interpretation to that provider. A polygenic-score trait report has the same buttons (Figure
    3), and following one sends that trait’s results, model by model, to the provider. When an assistant uses an
    external model provider, prompts and tool outputs may transmit sensitive results even if the raw VCF remains
    local. Privacy therefore depends on the deployment, the selected services and the information shared with them.
    The platform’s local architecture alone does not establish regulatory compliance.
