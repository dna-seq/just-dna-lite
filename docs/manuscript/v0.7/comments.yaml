  anchor: Polygenic scores with the context to read them. The PGS Catalog publishes polygenic score models as scoring
    files; just-prs computes them for a genome and adds what a reader needs to judge each result. It infers the
    genome’s ancestry, places each score as a percentile in the matching 1000 Genomes reference population, reports
    how much of the score the genome covers, labels the result’s quality and groups all models for a trait so that
    their agreement and disagreement are visible. The scoring files, cleaned metadata and audited reference distributions,
    for 6,117 scores across 778 traits, are downloaded on first use, so users assemble nothing (Sections 3.2 and
    4.3).
