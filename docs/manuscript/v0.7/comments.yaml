  anchor: Just-DNA-Lite is a local, open-source platform for annotating a personal genome and computing polygenic
    scores. We developed it as a ground-up rewrite of Just-DNA-Seq (Kulaga et al., 2024), whose first generation
    (Generation I), built for longevity research, was a set of annotation and report modules for OakVar, a Python
    variant-analysis framework derived from OpenCRAVAT (Pagel et al., 2020). Just-DNA-Lite (Generation II) removes
    the OakVar dependency entirely and uses a standalone annotation engine. It also replaces Python annotation plugins
    with declarative modules discoverable from configured sources (Section 2.2). Supplementary S1 describes Generation
    I, and Figure S1 gives a historical overview of its module domains.
