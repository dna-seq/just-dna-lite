# Venue selection record for Paper 1 (manuscript-journal-select). The authors' priorities and every venue
# fact read for this manuscript, with source and date. Regenerate the ladders and the requirements from it:
# see paper1-just-dna-lite.venue-requirements.md and the two *-ladder.csv files beside it.
manuscript: paper1-just-dna-lite.md
updated: '2026-10-27'
priorities:
  journals:
  - speed
  - reach
  - ai
  - transfer
  preprints:
  - transfer
  - ai
  jif_floor: 3
  fee: a grant can pay a normal open-access fee
  preprint: bioRxiv first; the authors asked on 2026-10-27 for bioRxiv-friendly journals
  jif_floor_note: above 3, as the authors said; a journal at exactly 3.0 is kept and marked at the floor
  ai_rules: the authors said on 2026-10-27 that a rule reserving Results and Discussion for the authors is too tough;
    AI drafted and rewrote passages throughout, Results and Discussion included
ladders:
  preprints:
  - biorxiv
  - arxiv
  journals:
  - iscience
  - frontiers-bioinformatics
  - jamia-open
  - cell-reports-methods
  - genomics
  - plos-comp-biol
  - nar-genomics-bioinformatics
  - cell-genomics
  checked: '2026-10-27'
  note: 'working order, not a final choice (2026-10-27). Generated with --refuse red-line --refuse drafting-ban,
    because the authors said a rule reserving Results and Discussion for them is too tough: that leaves out Bioinformatics
    and Bioinformatics Advances (ISCB bars LLM drafting) and BMC Bioinformatics and Genome Biology (Springer Nature
    reserves Results and Discussion for the authors). Also out: GigaScience (AI outputs deposited), Molecular Systems
    Biology (AI limited to polishing), eLife and F1000Research (no impact factor), Life Science Alliance (impact
    factor not verified), Genome Research (Resource articles must add novel biology or technology; USD 5,200). Moved
    by judgement over the sorted order: Cell Genomics to the last rung (its 5-day median is a desk-inclusive figure
    and its Technology bar asks for a significant advance over existing methods), Frontiers in Bioinformatics and
    JAMIA Open up to rungs 2 and 3 (their software article types fit this paper as it is, Frontiers costs a Rostock
    author nothing, and neither publishes a speed figure).'
venue_facts:
  genome-biology:
    limits:
      abstract_words: 100
    abstract_headings: []
    review_speed:
    - metric: submission-to-first-decision
      days: 13
      statistic: median
      population: not stated (the same page's overview text says 14 days)
      source: https://link.springer.com/journal/13059
      checked: 2026-10-19
      evidence_kind: official statistic
    publication_costs:
    - amount: 4690
      currency: EUR
      fee_year: 2026
      route: Projekt DEAL gives German participating institutions, the University of Rostock among them, 20% off,
        billed centrally; no Springer Nature agreement covers BMC fees for Romanian institutions
      source: https://link.springer.com/journal/13059/how-to-publish-with-us
      checked: 2026-10-19
    open_science:
      summary: Source code in a public repository under an OSI-compliant licence, stated in the manuscript; a DOI-assigning
        deposit of the described version recommended; the journal states 'a very strict open access, open source
        and open data policy'.
      source_code: required
      software_licence: OSI-compliant
      preprints: posting a preprint is not prior publication and any licence may be chosen for it; its DOI and licence
        are disclosed at submission (BMC editorial policies); not on bioRxiv's direct-transfer list
      source: https://link.springer.com/journal/13059/submission-guidelines/software
      checked: 2026-10-19
    editorial_profile:
      summary: Software articles must be 'a clear advance over the state-of-the-art existing tools in a side-by-side
        demonstration using the same dataset', benchmarked on data with known ground truth where possible; a pipeline
        combining existing methods is in scope.
      evidence_kind: stated-scope
      source: https://link.springer.com/journal/13059/submission-guidelines/software
      checked: 2026-10-19
    ai_policy_url: https://www.springernature.com/gp/policies/editorial-policies/ai-manuscript-preparation
