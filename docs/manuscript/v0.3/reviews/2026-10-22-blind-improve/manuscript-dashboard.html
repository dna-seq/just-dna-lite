s person", "takeaway": "It's a free program you run on your own computer that compares your DNA file against what published studies say about traits like longevity or athletic ability, without uploading your genome anywhere, and it says plainly that it isn't a medical test.", "stopped_at": "2. Platform Architecture: I went back to the top to find out how to try it and found a programming command rather than a website or a download button, so I realised this isn't something I can just open, and I don't even have one of these DNA files.", "next": "forward it", "left": "2. Platform Architecture", "dips": ["Abstract", "1. Introduction", "3.1 Longevity Variants Module (example)", "4. AI-Assisted Module Creation (platform feature)"], "round": "readers-paths", "path": [{"section": "Abstract", "how": "read"}, {"section": "1. Introduction", "how": "skimmed"}, {"section": "2. Platform Architecture", "how": "skipped"}, {"section": "2.3 Web Interface and Self-Exploration", "how": "skimmed"}, {"section": "3. Annotation Modules and Polygenic Scoring", "how": "read"}, {"section": "3.1 Longevity Variants Module (example)", "how": "skimmed"}, {"section": "3.2 Polygenic Risk Scores", "how": "skimmed"}, {"section": "3.2.1 Standalone PRS Use and MCP Access", "how": "skipped"}, {"section": "3.3 Additional Trait Annotation Modules", "how": "skipped"}, {"section": "4. AI-Assisted Module Creation (platform feature)", "how": "skimmed"}, {"section": "5. Benchmarking and Validation", "how": "skipped"}, {"section": "6.1 Limitations of Variant Annotation", "how": "skimmed"}, {"section": "6.2 Local Processing and Data Privacy", "how": "read"}, {"section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome", "how": "read"}, {"section": "2. Platform Architecture", "how": "skimmed"}], "isolation": ""}, {"seat": "wet-lab biologist", "takeaway": "It's a free web app that runs on your own computer: you load a human VCF you already have, browse your variants in a table and download PDF/HTML reports, but someone has to start it from the command line, and the built-in reports cover longevity, heart, lipid and fitness traits.", "stopped_at": "Code Availability: I came to find out how to get this running on my lab computer, and what I get is a list of ten GitHub repositories plus a `uv run serve` command, so getting it running is a job for our bioinformatician, not me.", "next": "forward it", "left": "Code Availability", "dips": ["Abstract", "2.1 Annotation Pipeline", "5.1 Annotation Speed"], "round": "readers-paths", "path": [{"section": "Title", "how": "read"}, {"section": "Abstract", "how": "read"}, {"section": "1. Introduction", "how": "skipped"}, {"section": "2.3 Web Interface and Self-Exploration (Figure 1 caption, then the text)", "how": "read"}, {"section": "3. Annotation Modules and Polygenic Scoring (Table 1)", "how": "read"}, {"section": "3.1 Longevity Variants Module (example) (Figure 2 caption)", "how": "skimmed"}, {"section": "3.2 Polygenic Risk Scores (Figure 3 caption)", "how": "skimmed"}, {"section": "4. AI-Assisted Module Creation (platform feature) (Figure 4 caption, first paragraph)", "how": "skimmed"}, {"section": "2.1 Annotation Pipeline", "how": "read"}, {"section": "2. Platform Architecture", "how": "read"}, {"section": "2.2 Modular Plugin System", "how": "skipped"}, {"section": "2.4 Performance Characteristics", "how": "skimmed"}, {"section": "5.1 Annotation Speed (Tables 3 and 4 only)", "how": "skimmed"}, {"section": "5.2 PRS Computation", "how": "skipped"}, {"section": "6.4 Limitations", "how": "read"}, {"section": "Code Availability", "how": "skimmed"}], "isolation": ""}]}, "reference": {"title": "Robi Tacutu's review and the authors' later fixes", "description": "The reference holds 127 problems in Paper 1 v0.3 that people raised or fixed, built from the just-dna-lite repository at 419309a: Robi Tacutu's 39 comments on the v0.3 Google Doc (C1-C39) and his tracked changes, one record per paragraph (R1-R26), and the authors' later fixes (29 own findings, 13 corrections from the benchmark rerun, 20 journal-fit changes for Bioinformatics). The repository records none of Robi's comment texts; on 2026-10-22 all 39 were read, read-only, from the v0.3 Google Doc in the authors' Drive. That recovers C9, C20, C21, C25 and C32-C34 and settles the inferred IDs by the order of the comments in the paper: the 'surfaces' comment is C34 (its record, filed by the reference set as C31, moves there), C31 is the comment on 6.2's disclosure sentence, and C39 is the comment on the ROGEN funding text, so the Table 7 companion-paper removal the reference set called C39 was the authors' own fix and is folded into C8. Two items are left out: C1, the first comment, which praises the Abstract apart from the benchmark paragraph (C2) and names no problem, and N3, whose content is recorded nowhere; 125 items are compared. Claude (Opus 5.5), acting as judge, matched them on 2026-10-22 against the run's inventory, which was frozen before matching (findings.json sha256 7eec2ccf718880b0c52a5ecf75b2d248cea1d8a59c3ab3f3114e1d5a3a160d55); dismissed flags never count, and findings that rest on information published after the draft (RP.RC-4 on the October 2026 just-prs rerun, RP.RC-27 on the live repository redirect) or on the live module registry (IC-12, IC-38) are not used as matches, while RP.RC-7 counts only for its argument from PLINK2's documentation. 'Full' means a finding names the same problem at the same place, 'partial' part of it or the same problem without the specific point. Robi's tracked changes are mostly wording and count as substantive only when they changed a fact, claim, number or reference.", "source": {"path": "reference-items.json", "quote": "Reference set of problems that humans (reviewer Robi Tacutu and the authors) identified in Paper 1 v0.3"}, "items": [{"id": "C2", "origin": "reviewer", "summary": "The Abstract did not stand on its own: no context opener, the system in implementation terms (module contract, source discovery), and half its space on single-genome benchmark numbers, which Robi suggested moving to the Discussion.", "category": "Story and structure", "section": "Abstract", "kind": "comment", "substantive": true, "miss_reason": "judged-differently", "miss_note": "The run kept the benchmark paragraph and its one-genome caveat in the Abstract (dismissed flag 'Move the one-genome caveat out of the Abstract'; the story report's caveat check passes) and IC-1/PE-C1 add conditions to the 172x figure there rather than moving it, which was Robi's main point.", "owner": "manuscript-story"}, {"id": "C3", "origin": "reviewer", "summary": "The opening cost claim is wrong at the top end ('billions' is the whole HGP budget; the first genome cost an estimated $0.5-1 billion), undated and uncited, and 'under a thousand' counts only consumables.", "category": "Claims and evidence", "section": "1. Introduction", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C4", "origin": "reviewer", "summary": "The claim that people with VCFs lack accessible annotation tools was stated as universal fact with no source; Robi asked for a recent review to support it.", "category": "Claims and evidence", "section": "1. Introduction", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "The reference check audited seven uncited statements chosen for borrowed numbers, absence claims and regulations; this uncited claim about users lacking tools was not among them.", "owner": "manuscript-reference-check"}, {"id": "C5", "origin": "reviewer", "summary": "The Introduction never said plainly what Just-DNA-Lite is (only what it removes) or what Generation I and OakVar were, and gave a benchmark result before any method.", "category": "Story and structure", "section": "1. Introduction", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "No reader or referee flagged the missing one-sentence definition of Just-DNA-Lite or of Generation I; the referees' dismissed point on positioning against Generation I judged only that the change from it is stated.", "owner": "manuscript-story"}, {"id": "C6", "origin": "reviewer", "summary": "The Introduction ended with a roadmap (contribution type, Section 4, the companion paper, Section 6) that Robi found unnecessary there.", "category": "Story and structure", "section": "1. Introduction", "kind": "comment", "substantive": false, "miss_reason": "skill-did-not-look", "miss_note": "The story stage examined the closing paragraph for its theme but not the section-by-section roadmap.", "owner": "manuscript-story"}, {"id": "C7", "origin": "reviewer", "summary": "'The contribution is computational' left unclear which contribution was meant (to the field, or of Just-DNA-Lite).", "category": "Writing and clarity", "section": "1. Introduction (closing paragraph)", "kind": "comment", "substantive": false, "miss_reason": "skill-did-not-look", "miss_note": "No stage flagged the ambiguous referent; the sentence went when the roadmap was deleted (C6).", "owner": "manuscript-prose-edit"}, {"id": "C8", "origin": "reviewer", "summary": "The Introduction sent readers to 'the companion paper', which they cannot know or consult at publication time; the authors later also removed the Table 7 companion-paper pointer, which the reference set had inferred as C39.", "category": "References", "section": "1. Introduction (closing paragraph); Code Availability, Table 7", "kind": "comment", "substantive": true, "miss_reason": "judged-differently", "miss_note": "JS-2 advises citing the companion 'as a manuscript under review without naming the venue', so the run judged pointers to the unpublished companion acceptable; no stage noted that the companion has no bibliography entry.", "owner": "manuscript-reference-check"}, {"id": "C9", "origin": "reviewer", "summary": "Robi asked whether the paper's structure, without the classical Methods, Results and Discussion sections, suits the bioinformatics journals the authors target.", "category": "Journal fit", "section": "2. Platform Architecture (heading)", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C10", "origin": "reviewer", "summary": "The CSV sentence was hard to parse: it said what CSV is not instead of saying CSV is only the authoring format and Parquet the runtime format.", "category": "Writing and clarity", "section": "2.2 Modular Plugin System", "kind": "comment", "substantive": false, "miss_reason": "skill-did-not-look", "miss_note": "The prose-edit stage made routine edits elsewhere in 2.2 but did not flag this negated sentence.", "owner": "manuscript-prose-edit"}, {"id": "C11", "origin": "reviewer", "summary": "Naming one curator (Olga Borysova) in the section's opening sentence is not customary in running text.", "category": "Writing and clarity", "section": "3. Annotation Modules and Polygenic Scoring", "kind": "comment", "substantive": false, "miss_reason": "wording-preference", "miss_note": "A convention point; no stage treats it as a defect, and Robi's own edit R11 removed the name.", "owner": "manuscript-journal-adapt"}, {"id": "C12", "origin": "reviewer", "summary": "Table 1 credited Olga Borysova on one module only and left the other expert modules unattributed ('if you give Olga's name, you need to give everybody's'), and the contribution lines did not separate curation from code.", "category": "Figures and tables", "section": "3. Annotation Modules and Polygenic Scoring — Table 1", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "IC-7 rebuilds Table 1's module list but no stage noticed that only one row names a curator.", "owner": "manuscript-integrity-check"}, {"id": "C13", "origin": "reviewer", "summary": "Table 1 gave no sources for any module (which papers and databases), called every default module expert-curated, and did not match the modules the project publishes.", "category": "Reporting and availability", "section": "3. Annotation Modules and Polygenic Scoring — Table 1", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "No stage asked which papers and databases each module was built from; the availability check covered repositories and datasets, not the provenance of module content.", "owner": "manuscript-reporting-check"}, {"id": "C14", "origin": "reviewer", "summary": "Robi asked for a supplementary table giving every module's curated sources (datasets, papers); Table 1 also listed an AI-generated example module, Longevity Variants 2026, published nowhere.", "category": "Figures and tables", "section": "3. Annotation Modules and Polygenic Scoring — Table 1", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "As for C13: module sources were not examined.", "owner": "manuscript-reporting-check"}, {"id": "C15", "origin": "reviewer", "summary": "The PGS Catalog was named as the source of the scoring files without a citation.", "category": "References", "section": "3.2 Polygenic Risk Scores", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C16", "origin": "reviewer", "summary": "'The Generation I approach' would mean nothing to a reader, and the contrast was wrong against the code: Generation I fitted a normal to genotypes simulated from gnomAD frequencies, while just-prs scores the 3,202-sample 1000 Genomes high-coverage panel (not phase 3) and also fits normals.", "category": "Methods and reproducibility", "section": "3.2 Polygenic Risk Scores", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "The integrity check read just-prs code for restoration and ancestry but did not check the percentile panel or the Generation I method against the text.", "owner": "manuscript-integrity-check"}, {"id": "C17", "origin": "reviewer", "summary": "The paper named the DuckDB and Polars engines ('SQL-based', 'LazyFrame joins') without saying how either computes a score: join key, allele matching, dosage, strand, missing genotypes, memory limits.", "category": "Methods and reproducibility", "section": "3.2 Polygenic Risk Scores", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C18", "origin": "reviewer", "summary": "Section 3.3 described the literature modules vaguely (Robi: 'same' what?) and wrongly against their files: they are curated by hand, not drawn from GWAS databases; 'cardiovascular' is the coronary module, VO2 max holds training-response studies, Superhuman the Church lab's protective alleles.", "category": "Text versus code", "section": "3.3 Additional Trait Annotation Modules", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "The integrity check read modules.yaml (it dismissed 'Superhuman' as a module name) but did not compare Section 3.3's description of each module with the module files.", "owner": "manuscript-integrity-check"}, {"id": "C19", "origin": "reviewer", "summary": "The literature modules were described with no sources for their content or selection criteria; Robi asked to be explicit for each.", "category": "References", "section": "3.3 Additional Trait Annotation Modules", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "As for C13: no stage asked for the sources behind each module.", "owner": "manuscript-reporting-check"}, {"id": "C20", "origin": "reviewer", "summary": "Section 4 pointed to 'the companion manuscript' for the authoring workflow, which a reader cannot follow unless the papers appear together, and two papers cannot cite each other as hoped.", "category": "References", "section": "4. AI-Assisted Module Creation (platform feature)", "kind": "comment", "substantive": true, "miss_reason": "judged-differently", "miss_note": "JS-2 treats citing the companion as a manuscript under review as acceptable; Section 4 was later deleted (D1), which also removed the pointer.", "owner": "manuscript-reference-check"}, {"id": "C21", "origin": "reviewer", "summary": "The sentence calling AI-assisted creation 'an integration feature' that the runtime benchmarks do not evaluate was hard to understand ('Here', where?).", "category": "Writing and clarity", "section": "4. AI-Assisted Module Creation (platform feature)", "kind": "comment", "substantive": false, "miss_reason": "skill-did-not-look", "miss_note": "No stage flagged the sentence; the section was later deleted (D1).", "owner": "manuscript-prose-edit"}, {"id": "C22", "origin": "reviewer", "summary": "Table 2's run types and n were undefined (Robi: what is n?), its 172x divided a full OakVar run by a warm run that skips reading the VCF, and its numbers could not be traced to run data.", "category": "Numbers and statistics", "section": "5.1 Annotation Speed — Table 2", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C23", "origin": "reviewer", "summary": "Table 3 mixed run types, gave peak RAM as a bare range with no method and no CPU; Robi asked whether OakVar ran on the same hardware and what its memory peaks were, to tell more resources from better code.", "category": "Numbers and statistics", "section": "5.1 Annotation Speed — Table 3", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "No finding asks for Generation I's memory and CPU, which Robi needed to judge where the speed-up comes from.", "owner": "manuscript-reporting-check"}, {"id": "C24", "origin": "reviewer", "summary": "Table 4 (hardware and input) is configuration, not a result, and need not take a main-text table; Robi suggested the text, a legend or a supplement.", "category": "Figures and tables", "section": "5.1 Annotation Speed — Table 4", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "JS-9 found the display-item count within the journals' limits and RP.RC-11 asks to retitle Table 4, but no stage asked whether a configuration table belongs in the main text.", "owner": "manuscript-story"}, {"id": "C25", "origin": "reviewer", "summary": "By Section 5.2 a reader still did not know what DuckDB and Polars are, or what the paper did differently from PLINK2.", "category": "Methods and reproducibility", "section": "5.2 PRS Computation (first paragraph)", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "The referees asked for matching rules but not for a plain description of the engines and their difference from PLINK2.", "owner": "manuscript-peer-review"}, {"id": "C26", "origin": "reviewer", "summary": "The concordance table reported one PLINK2 configuration on 96 of 100 scores without saying that a correlation across one genome's scores is dominated by the largest scores (Robi: '???').", "category": "Numbers and statistics", "section": "5.2 PRS Computation — Table 6", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C27", "origin": "reviewer", "summary": "The paragraph after Table 6 explained the PLINK2 gap by just-prs matching more variants, an assertion never measured; Robi's comment there asked what DuckDB and Polars are and how they differ from PLINK2 and from each other.", "category": "Claims and evidence", "section": "5.2 PRS Computation", "kind": "comment", "substantive": true, "miss_reason": "input-missing", "miss_note": "Showing that the explanation is wrong needed the per-variant rerun, which traced most of the gap to the benchmark's own PLINK2 input (A3b).", "owner": "manuscript-integrity-check"}, {"id": "C28", "origin": "reviewer", "summary": "'Its representation in the module' was too abstract to tell the reader what the benchmarks leave untested (Robi asked what it means).", "category": "Writing and clarity", "section": "5.2 PRS Computation", "kind": "comment", "substantive": false, "miss_reason": "judged-differently", "miss_note": "The story stage moved this paragraph to 6.1 'unchanged' (ST-19, ST-C16), so the wording was read and kept.", "owner": "manuscript-prose-edit"}, {"id": "C29", "origin": "reviewer", "summary": "'Published associations do not by themselves validate extraction ...' did not say plainly what is meant (scientific journals?) or what the benchmarks do not test.", "category": "Writing and clarity", "section": "5.2 PRS Computation", "kind": "comment", "substantive": false, "miss_reason": "judged-differently", "miss_note": "As for C28: ST-C16 moves the paragraph unchanged.", "owner": "manuscript-prose-edit"}, {"id": "C30", "origin": "reviewer", "summary": "'Surface' misdescribes what annotation tools do with published associations; Robi offered 'are based on'.", "category": "Writing and clarity", "section": "6.1 Limitations of Variant Annotation", "kind": "comment", "substantive": false, "miss_reason": "wording-preference", "miss_note": "'Surface' (bring to view) is correct usage; the change is Robi's preferred verb.", "owner": "manuscript-prose-edit"}, {"id": "C31", "origin": "reviewer", "summary": "Section 6.2's 'local execution is not a guarantee against disclosure through other parts of the workflow' seemed too strong and left 'other parts' unexplained; Robi asked for an example.", "category": "Ethics, privacy and scope", "section": "6.2 Local Processing and Data Privacy", "kind": "comment", "substantive": false, "miss_reason": "judged-differently", "miss_note": "The integrity scan flagged 'guarantee' here and dismissed it as calibrated because it is negated; no finding addresses the sentence's strength. (The reference set had inferred C31 as the 'surfaces' comment, which the Doc places 34th.)", "owner": "manuscript-policy-fit"}, {"id": "C32", "origin": "reviewer", "summary": "Robi changed 'the workflow' to 'a workflow' in 6.2, noting that the article makes a big difference to the meaning.", "category": "Writing and clarity", "section": "6.2 Local Processing and Data Privacy", "kind": "comment", "substantive": false, "miss_reason": "wording-preference", "miss_note": "An article choice offered as a tracked change; no stage examined it.", "owner": "manuscript-prose-edit"}, {"id": "C33", "origin": "reviewer", "summary": "6.3's claim that researchers may work with public genomes without a gatekeeper's permission is ethically problematic; Robi would limit it to well-intentioned researchers and notes it depends on who made the data public.", "category": "Ethics, privacy and scope", "section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C34", "origin": "reviewer", "summary": "'Surfaces' as a verb for what the platform shows reads as jargon (6.4, and 'surfaced' in 6.1); Robi asked for another verb. This is the record the reference set filed as C31.", "category": "Writing and clarity", "section": "6.4 Limitations", "kind": "comment", "substantive": false, "miss_reason": "wording-preference", "miss_note": "A verb preference; no finding names it, though IC-10's proposal PE-C27 rewrites the 6.4 sentence for its liftover and chip claims and drops the 'surfaces' clause there ('surfaced' in 6.1 stays).", "owner": "manuscript-prose-edit"}, {"id": "C35", "origin": "reviewer", "summary": "'The larger experiment is social' and 'by design do not vet what others publish' read as LLM style and leave the trust stance unclear.", "category": "Writing and clarity", "section": "6.5 Future Directions", "kind": "comment", "substantive": false, "miss_reason": "skill-did-not-look", "miss_note": "The deslop stage, added with manuscript-skills 0.9.0, read Section 6.5 and rewrote the next sentence (DS-C16), but flagged neither phrase; the prose-edit stage's pattern check had flagged only the dashes.", "owner": "manuscript-deslop"}, {"id": "C36", "origin": "reviewer", "summary": "The paper compares itself only with its own earlier system yet claims no open-source platform combines its features; Robi expects a referee to ask for comparison with other tools (comment on the Conclusion).", "category": "Claims and evidence", "section": "1. Introduction; 7. Conclusion", "kind": "comment", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "C37", "origin": "reviewer", "summary": "'Generation I' stayed unclear to the end of the paper (Just-DNA-Seq, an early Just-DNA-Lite, or OakVar?); the authors named it in Karmazin's contribution line.", "category": "Submission package", "section": "Contribution Statements", "kind": "comment", "substantive": false, "miss_reason": "skill-did-not-look", "miss_note": "No simulated reader listed 'Generation I' among the terms they could not follow, and no stage checked the contribution lines for it.", "owner": "manuscript-story"}, {"id": "C38", "origin": "reviewer", "summary": "Robi Tacutu's contribution line omitted co-supervision, although the author line marks him as co-supervising.", "category": "Submission package", "section": "Contribution Statements", "kind": "comment", "substantive": true, "miss_reason": "skill-did-not-look", "miss_note": "The contribution lines were mapped to CRediT roles without checking them against the author-line marks.", "owner": "manuscript-journal-adapt"}, {"id": "C39", "origin": "reviewer", "summary": "On the ROGEN funding text Robi notes that the funder still has to be notified and asked for permission to publish.", "category": "Submission package", "section": "Funding", "kind": "comment", "substantive": true, "miss_reason": "input-missing", "miss_note": "Whether the funder has been notified and has agreed is the authors' knowledge. (The reference set had inferred C39 as the Table 7 companion-paper mention; the Doc's 39th comment is this one, so that fix is folded into C8.)", "owner": "manuscript-journal-adapt"}, {"id": "R1", "origin": "reviewer", "summary": "Affiliation 2 gave no city or country.", "category": "Submission package", "section": "Front matter", "kind": "suggested-edit", "substantive": false, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "R2", "origin": "reviewer", "summary": "Affiliation 9 carried an unneeded acronym (CRB).", "category": "Submission package", "section": "Front matter", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "A style choice; JA-C4 keeps the acronym.", "owner": "manuscript-journal-adapt"}, {"id": "R3", "origin": "reviewer", "summary": "'Existing solutions occupy two extremes' was absolute; hedged to 'generally belong to'.", "category": "Writing and clarity", "section": "1. Introduction", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "The hedge on this sentence itself is Robi's wording; no finding names it.", "owner": "manuscript-prose-edit"}, {"id": "R4", "origin": "reviewer", "summary": "The longevity paragraph's framing sentences were loosely worded.", "category": "Writing and clarity", "section": "1. Introduction", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "DS-C1 rewrites only the closing sentence's opener and connector; Robi's preferred verbs and insertions are his wording, and no stage made them.", "owner": "manuscript-prose-edit"}, {"id": "R5", "origin": "reviewer", "summary": "The pointer to Supplementary File S1 trailed the runtime sentence.", "category": "Writing and clarity", "section": "1. Introduction", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "Sentence order; the runtime sentence itself is C5.", "owner": "manuscript-prose-edit"}, {"id": "R6", "origin": "reviewer", "summary": "Number agreement in 'all downstream annotation'.", "category": "Writing and clarity", "section": "2.1 Annotation Pipeline", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "'Annotation' as a mass noun is acceptable; pluralising is a preference.", "owner": "manuscript-prose-edit"}, {"id": "R7", "origin": "reviewer", "summary": "'Annotation modules are data, not executable plugins' was stated as a general truth rather than this platform's design.", "category": "Writing and clarity", "section": "2.2 Modular Plugin System", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "Scoping wording; IC-29 flags the 2.2 heading that contradicts this sentence, a different problem.", "owner": "manuscript-prose-edit"}, {"id": "R8", "origin": "reviewer", "summary": "'Without writing Python' was clipped.", "category": "Writing and clarity", "section": "2.2 Modular Plugin System", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "Rewording.", "owner": "manuscript-prose-edit"}, {"id": "R9", "origin": "reviewer", "summary": "The caveat that integrity checks do not validate scientific claims was easy to miss.", "category": "Writing and clarity", "section": "2.2 Modular Plugin System", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "Robi added 'of note'; emphasis is a preference.", "owner": "manuscript-prose-edit"}, {"id": "R10", "origin": "reviewer", "summary": "The self-exploration sentence in 2.3 was long and padded.", "category": "Writing and clarity", "section": "2.3 Web Interface and Self-Exploration", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "DS-C5 splits the sentence but keeps the phrases Robi cut ('even without selecting a specific module', 'their', and the Ensembl condition, which the authors later kept by making Ensembl explicitly optional); those cuts are his preferred trimming.", "owner": "manuscript-prose-edit"}, {"id": "R11", "origin": "reviewer", "summary": "The Section 3 opening named a single curator in running text and claimed ROGEN-consortium researchers among those who add modules.", "category": "Claims and evidence", "section": "3. Annotation Modules and Polygenic Scoring", "kind": "suggested-edit", "substantive": true, "miss_reason": "input-missing", "miss_note": "Whether ROGEN researchers add modules is the authors' knowledge (ST-8 only asks to explain the phrase); the name removal is C11's convention point.", "owner": "manuscript-integrity-check"}, {"id": "R12", "origin": "reviewer", "summary": "Phrasing of the porting sentence.", "category": "Writing and clarity", "section": "3. Annotation Modules and Polygenic Scoring", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "Rewording.", "owner": "manuscript-prose-edit"}, {"id": "R13", "origin": "reviewer", "summary": "The paper never said how either scoring engine computes a score (Robi inserted a placeholder for it).", "category": "Methods and reproducibility", "section": "3.2 Polygenic Risk Scores", "kind": "suggested-edit", "substantive": true, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "R14", "origin": "reviewer", "summary": "Phrasing of the MCP-fields sentence.", "category": "Writing and clarity", "section": "3.2.1 Standalone PRS Use and MCP Access", "kind": "suggested-edit", "substantive": false, "miss_reason": "wording-preference", "miss_note": "Rewording.", "owner": "manuscript-prose-edit"}, {"id": "R15", "origin": "reviewer", "summary": "'The co-author genome' was unclear.", "category": "Writing and clarity", "section": "5.1 Annotation Speed", "kind": "suggested-edit", "substantive": false, "miss_reason": null, "miss_note": "", "owner": ""}, {"id": "R16", "origin": "reviewer", "summary": "The sentence on what published associations do not validate was clipped.", "category": "Writing and clarity", "section": "5.2 PRS Computatio our own computer, with methods you can inspect", "confirmed": false, "drift": "Not checked: the project holds no earlier version of this paper to compare with.", "tests": [{"test": "The stake", "result": "fails", "note": "The Introduction opens on the cost of sequencing: \"Whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003\". The reader's own problem comes in the third sentence, and the privacy stake behind the title waits until paragraph 4. Proposal ST-C1 puts the problem first; moving privacy into the opening is part of option A in section 11, because it reorders the themes (ST-2).", "finding_ids": ["ST-2"], "change_ids": ["ST-C1"]}, {"test": "And, but, therefore", "result": "fails", "note": "Fails in the Abstract. Its first sentence says what is needed and its second is \"We present Just-DNA-Lite\". The obstacle is stated in the Introduction (\"Existing solutions occupy two extremes.\") and missing from the Abstract. Proposal ST-C2 (ST-3).", "finding_ids": ["ST-3"], "change_ids": ["ST-C2"]}, {"test": "The gap", "result": "partly", "note": "The gap paragraph names commercial platforms and \"PLINK, ANNOVAR, and VEP\" without citing any of them, and ends on \"There is no open-source platform that combines comprehensive variant annotation with ease of use, transparency, and extensibility.\" The closest open-source neighbours are missing: OpenCRAVAT and its fork OakVar, on which the first generation ran, the PGS Catalog's own calculator, and Impute.me (section 9). A referee who knows OpenCRAVAT will read the \"no open-source platform\" sentence as unsupported (ST-4, ST-5). Proposals ST-C3, ST-C20 and ST-C21.", "finding_ids": ["ST-4", "ST-5"], "change_ids": ["ST-C3", "ST-C20", "ST-C21"]}, {"test": "One idea", "result": "partly", "note": "The paper has a phrase a reader can repeat, \"Annotation modules are data, not executable plugins.\", and the skimmer repeated it. It first appears in Section 2.2 under a heading that contradicts it, and the paper pursues five contributions (the local engine, the scoring library, the interfaces, the module format and registry, AI drafting) without saying which one leads. Proposal ST-C7 fixes the heading; which idea leads is a direction choice (ST-7, ST-22).", "finding_ids": ["ST-7", "ST-22"], "change_ids": ["ST-C7"]}, {"test": "A headline per result", "result": "fails", "note": "Fails in 5.1 and 5.2. Both sections open with their setup, \"We benchmarked Just-DNA-Lite against the Generation I OakVar-based system on the same hardware.\" and \"We benchmarked just-prs's DuckDB and Polars engines against the external tool PLINK2\", and the findings come later, in the tables and the paragraphs after them (ST-10). Proposals ST-C12 and ST-C15.", "finding_ids": ["ST-10"], "change_ids": ["ST-C12", "ST-C15"]}, {"test": "Show the output", "result": "fails", "note": "The paper shows no report row and no output for a named input, and the reading copy has no images. All three readers looked for one. The Figure 3 comment says the existing image \"shows an absolute-risk percentage for intelligence and inconsistent quality labels\". The fix needs your real output, so it is the first item under \"Fix now\" (ST-1).", "finding_ids": ["ST-1"], "change_ids": []}, {"test": "Connected sentences", "result": "partly", "note": "Mostly passes. The Abstract's second paragraph and the first paragraph of Section 2 are lists of component sentences in sequence; the Results and the Discussion connect well.", "finding_ids": [], "change_ids": []}, {"test": "Autobiography", "result": "partly", "note": "Introduction paragraph 5 tells how the platform was rebuilt and with which libraries, at the point where readers want to know what it does, and the ageing biologist stopped there. The headline speed number compares the platform with your own predecessor, for which a new reader has no baseline (the potential user wrote \"as a new user I have no OakVar baseline to compare against\"). The Abstract already gives the absolute time (38.9 seconds) first; proposal ST-C12 does the same in 5.1.", "finding_ids": [], "change_ids": ["ST-C12"]}, {"test": "Caveats in their place", "result": "partly", "note": "Mostly passes. The one-genome caveat sits beside the benchmark claim in the Abstract, in 5.2 and in the Conclusion, where it belongs. Two placements cost readers: the paragraph on module reliability closes the PRS benchmark section, where the potential user found it out of place (ST-C16 moves it to 6.1 unchanged, ST-19), and the Abstract and the Conclusion both end on a disclaimer (test 13). Several sentences read as answers to a referee; they could move to the supplement or the response letter, or stay, as you decide (ST-20): \"PLINK2 is used only as an external benchmark comparator to assess agreement with an established tool; it is not provided as a just-prs scoring engine.\" (3.2); \"The comparison concerns this PLINK2 configuration, not a general limitation of the tool.\" and \"These values describe the benchmark configuration, rather than the maximum coverage supported by just-prs.\" (5.2); \"This route lets authors prepare annotation content without writing Python; it does not make CSV the runtime format or a requirement for using existing Parquet modules.\" (2.2); \"Here, AI-assisted creation is an integration feature; the runtime benchmarks do not evaluate draft accuracy or compare authoring models and agent arrangements.\" (Section 4).", "finding_ids": ["ST-19", "ST-20"], "change_ids": ["ST-C16"]}, {"test": "Accretion", "result": "not-run", "note": "The project holds no earlier version of this paper to compare with.", "finding_ids": [], "change_ids": []}, {"test": "Said once", "result": "fails", "note": "The list of interfaces (web, command line, Python, MCP) appears in seven places: the Abstract, the Introduction's last paragraph, the first paragraph of Section 2, Section 3.2, twice in 3.2.1, and Table 7. All three readers noticed it. The statement that the platform gives no diagnoses or clinical interpretation appears six times (Abstract, Introduction, the opening of Section 3, 3.3, 6.1, Conclusion), and the OakVar speed comparison five times (Abstract, Introduction, 2.4, 5.1, S2). In a paper about people's own genomes the disclaimer belongs in the Abstract and in the Limitations; the other copies can go once the policy check agrees. Proposal ST-C11 removes the fifth list of interfaces (ST-20).", "finding_ids": ["ST-20"], "change_ids": ["ST-C11"]}, {"test": "What the paper argues against", "result": "partly", "note": "It is named early and fairly (\"the curation is opaque: users cannot verify which polymorphisms contributed to a score\"), but neither the commercial platforms nor the research tools are cited.", "finding_ids": [], "change_ids": []}, {"test": "The ending", "result": "fails", "note": "The Conclusion ends on \"The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports.\" Section 6.5 has a strong last line (\"Just-DNA-Lite is offered both as a usable platform and as a testbed for that question.\"), but the paper's last word is a disclaimer (ST-21). Proposal ST-C18 adds a closing sentence on what a reader can do and keeps both caveats as they are.", "finding_ids": ["ST-21"], "change_ids": ["ST-C18"]}, {"test": "Memory", "result": "partly", "note": "(section 2). The speed, the local running and the scoring engine stay with readers; the module contract, the registry and the AI-assistant access do not.", "finding_ids": [], "change_ids": []}, {"test": "The boring checklist", "result": "partly", "note": "Two of its items apply: many abbreviations (section 8) and little first person, about ten uses of \"we\" or \"our\" in 4,521 words. The paper does keep focus, implications and a point of view (Sections 6.3 and 6.5).", "finding_ids": [], "change_ids": []}], "options": [{"title": "Option A: keep the current direction, local-first and open", "summary": "Title: unchanged.; The Abstract opens: \"Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data. Commercial reports typically do not let users verify which variants contributed to a score, and research-grade annotation tools demand command-line proficiency.\"", "readers": "researchers who would run or extend the platform, and individuals with their own VCF; journals and sections for bioinformatics software and application notes.", "cost": "little. All five themes stay, so the registry and the AI-assistant access remain secondary, as readers already treated them. A fuller version would move the privacy stake from Introduction paragraph 4 (\"genomic data is among the most sensitive personal information, and uploading it to third-party servers introduces risks\") into paragraph 1, so that the order of themes matches the title."}, {"title": "Option B: lead with modules that are data", "summary": "Title: \"Just-DNA-Lite: Personal Genome Annotation with Modules That Are Data, Not Code\".; The Abstract opens: \"Variant-trait associations are published faster than any single curation team can integrate them. Just-DNA-Lite annotates a personal genome on the user's own computer against modules that are tables and metadata rather than executable plugins, so researchers can publish new modules and users can apply them without changing the software.\"", "readers": "bioinformaticians and curators who would contribute modules; software and database venues.", "cost": "privacy and the scoring engine become supporting themes, and the PRS benchmark in 5.2 moves to second place. Section 3.4 and the registry would need more space and evidence of use (how many modules, published by whom), which the paper does not yet report, and the boundary with the companion paper on authoring would need care."}, {"title": "Op
