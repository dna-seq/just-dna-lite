ng_ids": ["IC-3"]}, {"id": "SM-3", "severity": "major", "location": "Section 5.2, Table 6; Abstract; Section 7", "concern": "No per-score agreement is reported: a correlation across 96 differently scaled scores can be near 1 while individual scores differ, the maximum absolute difference of 21.4 is not scaled to its score, and no PLINK2 run on the variant set just-prs matched separates the arithmetic from the matching. The Conclusion's 'close numerical agreement' still rests on the cross-score correlation.", "suggestion": "A per-score supplementary table (PGS ID, scoring-file variants, variants matched by each engine, score from each engine, relative difference), and a PLINK2 run on exactly the variant set and alleles just-prs matched, so that any remaining difference is computational. Agreement across individuals would go further, but the paper does not claim it; without the per-score table, describe the result as agreement in score scale across models for one genome.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Section 5.2 already confines the correlation to agreement across scores for one genome and concedes that the two routes match different variants, as the defence found, but per-score magnitudes are missing. Agreement across individuals is not required, because the Abstract disclaims it. The integrity and reporting checks of 22 October 2026 found the same gap and a further difference the paper omits: the PLINK2 input covered autosomes only, while the just-prs engines also scored chromosome X.", "finding_ids": ["IC-4"]}, {"id": "SM-4", "severity": "major", "location": "Sections 3.2 and 5.2", "concern": "Apart from absent loci, which Section 3.2 treats as unscorable by default and as homozygous reference only when restoration is selected, the matching rules are not described: strand flips, palindromic A/T and C/G SNPs, multiallelic records and indel representation, whether author-reported or harmonised GRCh38 scoring files are used, and chrX dosage. Each changes the score a user sees, and the paper cites the matching difference to explain the disagreement with PLINK2.", "suggestion": "A Methods subsection giving the matching rules, with counts for the benchmark genome in each category (matched directly, matched after flip, ambiguous kept or dropped, multiallelic, unmatched).", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Section 3.2 states how absent loci are treated, which answers one item, and the only other description is that just-prs resolves variants by genomic position with allele-orientation handling (Section 5.2); the defence found no account of strand, palindromic, multiallelic, indel, build or chrX handling. The reporting check of 22 October 2026 asks the same for missing variants and the scoring-file build.", "finding_ids": ["PR-5"]}, {"id": "SM-5", "severity": "major", "location": "Section 3.2; Figure 3 legend; Section 5.2, second paragraph", "concern": "How the reference distributions are built is not described: the genome build of the 1000 Genomes distributions, the number of samples per superpopulation, whether each reference score uses the full scoring file or only the variants the user's file matched, and how absent loci are handled relative to the reference. With match rates of about 50 to 54% in the benchmark, a user's sum can leave out loci that the reference samples' sums include, and no check of that bias is reported.", "suggestion": "A description of the reference-distribution method, and a check on existing public data: reduce some 1000 Genomes samples to variant-only VCFs, score them with default settings, and compare the percentiles with those from their full genotypes; or show that the reference distribution is recomputed on the user's matched variant set. Otherwise narrow the percentile claim and say that percentiles are approximate when coverage is incomplete.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the release (phase 3) is stated, match rates are shown to users and missingness is acknowledged in Section 5.2, which meets part of the concern, but the method is not given anywhere, as the defence found. The integrity check of 22 October 2026 also found that the web interface turns reference-homozygote restoration on for whole-genome samples, although Section 3.2 says restoration is off by default, so the text has to say which setting produced each percentile.", "finding_ids": ["PR-6"]}, {"id": "SM-6", "severity": "major", "location": "Sections 5.1 and 5.2; Code Availability, Table 7", "concern": "No version or commit is given for just-dna-lite, just-prs, DuckDB, Polars, polars-bio, Dagster, PLINK2 or OakVar, and no release, tag or archive of the code is cited, so the tables cannot be tied to the code that produced them. The 100 PGS IDs and how they were chosen, the PGS Catalog, Ensembl Variation, 1000 Genomes percentile and module versions, the steps from the 6,138,868 records of Section 5.1 to the 4,661,444 biallelic variants of Section 5.2, and whether the DP and QUAL filters were applied are not stated; the annotation benchmark script is not named, and the named path benchmarks/benchmark_engines.py is not at the root of the just-prs repository. Genes also requires software names and versions in Methods.", "suggestion": "A table of software and data versions; tagged releases of the versions used, archived (Zenodo or Software Heritage) and cited; a supplementary list of the 100 PGS IDs with scoring-file versions; the exact commands and configuration (including modules.yaml filters) for each benchmark; and script paths that resolve at the tagged version.", "route": "fixable-in-text", "placement": "supplement", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed, with one correction to the premise: the defence found none of these items in the paper, and the reporting check of 22 October 2026 found that just-dna-lite and just-prs do have tagged releases, so the problem is that the paper cites none, not that none exist. That check confirmed that the annotation benchmark script is not in the repository, that the PRS script sits at just-prs/benchmarks/benchmark_engines.py, and that the per-run and per-score outputs are not deposited; the integrity check found that the shipped modules.yaml sets the depth and quality filters, which removed 30.0% of the benchmark genome's records. Tagging and archiving the release waits until the code is final.", "finding_ids": ["IC-14", "IC-38"]}, {"id": "SM-7", "severity": "major", "location": "Section 1, paragraph 2; Section 5", "concern": "The paper sets Just-DNA-Lite against its own OakVar-based predecessor but neither cites nor compares the open-source tools that do the same tasks: the PGS Catalog Calculator (pgsc_calc), which applies PGS Catalog scoring files with variant matching and ancestry-normalised reference distributions; OpenCRAVAT, with locally run, GUI-driven annotation and an installable module store; and Impute.me, which computed polygenic scores in an open-source web interface. The absence claim in Section 1, and any case that the software is an advance, depend on positioning against these.", "suggestion": "A comparison table of capabilities against these tools, citing them, and the Section 1 sentence narrowed to what is actually different (for example, declarative no-code modules and PRS in one local interface). A measured comparison with pgsc_calc on the same genome and scoring files is what a BioData Mining Software article needs; for Genes or Frontiers the positioning would suffice.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the paper states and measures its change from the OakVar-based predecessor (Section 1, paragraph 5; Section 2.2), so the claim that it measures no comparable tool overstates, but no other open-source tool is cited or compared, as the defence found. The three works resolved to the named papers in this review's lookup of 22 October 2026 (prior-work/scan.online.md), and the reference check of the same day quoted the OpenCRAVAT paper on its graphical interface and module store. A measured comparison is required only by BioData Mining's Software article criterion, so it is a journal item; the positioning itself is text.", "finding_ids": ["JS-1", "PR-7"]}, {"id": "SM-8", "severity": "major", "location": "Section 5.2, final paragraph; Section 5 as a whole", "concern": "This rules out evaluating the modules' content, but the engine itself (the join, the assignment of genotype state and the weights, the report contents) is never checked against an expected output either. Section 3 says the default modules were ported from Generation I largely unchanged and both generations were run on the same genome, so a per-variant comparison of their outputs was available; it would test the rewrite and also show whether the speed comparison did equivalent work. No test data with expected outputs is described.", "suggestion": "Per-module concordance between Generation I and Just-DNA-Lite outputs on the benchmark genome (variants matched, genotype state, weight), with discrepancies explained; or a small truth set with expected outputs, included in the test suite and reported in the paper.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the comparison was possible (the same genome, and modules ported largely unchanged according to Section 3), but no output concordance and no test data with expected outputs are reported, and the quoted disclaimer covers module content only, as the defence found. The Frontiers validation rule recorded in the venue brief makes this the evidence a Technology and Code referee asks for first.", "finding_ids": ["PR-2"]}, {"id": "SM-9", "severity": "optional", "location": "Section 2.1, step 3", "concern": "Section 2.1 gives rsID as the default join, but the paper does not say whether the DeepVariant benchmark VCF carried rsIDs, which join mode the timed runs used, or how many variants each module matched, so a reader cannot rule out that the timed runs matched few variants.", "suggestion": "The join actually used by default and in the benchmark, and per-module match counts for the benchmark runs.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "partly answered", "verdict": "downgraded", "verdict_evidence": "Downgraded: the paper leaves the question open, as the defence found, but the integrity check of 22 October 2026 settled it from the code. Module joins use genomic position and genotype, with a reference-allele check, by default, and fall back to rsID only for modules without coordinates, while the benchmark VCF carries no rsIDs. The worst case the referee raised, a default join that matched nothing, therefore does not apply; what remains is a sentence in Section 2.1 that states the reverse of the code, and the per-module match counts.", "finding_ids": ["IC-11"]}, {"id": "SM-10", "severity": "optional", "location": "Section 2.4; Table 3", "concern": "Section 2.4 still invokes the 'runs on a laptop' principle and says peak RAM stays low enough for a personal computer without the qualification Section 5.1 gives, and the paper does not say which processes the peak-RAM figures cover or how much disk the cached reference data need.", "suggestion": "State which process memory was measured and the total disk space needed, and reword Section 2.4 to match the limits given in Section 5.1, or report a run on a stated laptop configuration.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "downgraded", "verdict_evidence": "Downgraded to a wording point: Section 5.1 disclaims laptop performance and reports peak memory below 750 MB, which supports a narrower version of Section 2.4, as the defence found. The integrity check of 22 October 2026 found more: the pipeline's memory tracker reports the larger of two snapshots taken at the start and end of each step, so the reported peak can miss the true peak; it asked for a re-measurement and for the Section 2.4 sentence to go. The project README gives about 14 GB for the Ensembl cache.", "finding_ids": ["IC-2"]}, {"id": "SM-11", "severity": "optional", "location": "Supplementary S3 (summary in the manuscript); Section 5.2", "concern": "The S3 summary sets the 0.2 MB Python heap figure for DuckDB and Polars beside PLINK2's ~590 MB of process memory under one per-call memory label, and no like-for-like process memory is reported for the just-prs engines.", "suggestion": "Peak process resident memory for all three engines measured the same way, or removal of the heap figure from the comparison.", "route": "fixable-in-text", "placement": "supplement", "cost": "text", "defence": "partly answered", "verdict": "downgraded", "verdict_evidence": "Downgraded to a presentation point in the supplement: the main text marks the two numbers as different measurements and makes no memory claim for just-prs, as the defence found. The integrity and reporting checks of 22 October 2026 found the same and added that Python's heap tracer cannot see DuckDB's or Polars' native allocations, so the S3 comparison should be measured as process memory for all three engines or removed.", "finding_ids": ["IC-24"]}, {"id": "SM-12", "severity": "optional", "location": "Abstract, final paragraph; Code Availability, Table 7", "concern": "AGPL v3 places no restriction on field of use, so 'for research and education' can be read as a use restriction; Frontiers and BMC both ask authors to state any restriction on non-academic use. The components carry different licences (the just-prs repository shows MIT) that Table 7 does not list, and the terms of the distributed data (PGS Catalog scoring files, Ensembl, LongevityMap-derived modules, the HuggingFace datasets) are not stated.", "suggestion": "A licence column in Table 7; 'intended for research and education' if no restriction is meant; a sentence on the terms of the distributed reference data and modules.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the only licences stated are AGPL v3 for Just-DNA-Lite and CC0 for the benchmark genome, Table 7 has no licence column and the terms of the redistributed data are not given, as the defence found. The policy-fit check of 22 October 2026 found that the AGPL sentence reads as a use restriction and proposed 'intended for research and education'; the reporting check found that the other repositories carry MIT or Apache-2.0 licences and that the licences of the redistributed data need checking before submission.", "finding_ids": ["PF-10"]}, {"id": "SM-13", "severity": "optional", "location": "Sections 2 to 5; Code Availability", "concern": "The paper invites others to adopt the platform and contribute modules but says nothing about automated tests, continuous integration or test data with expected outputs, so a reader cannot tell whether the scoring, matching and genotype-state logic are covered. The repository READMEs describe pytest suites, including integration tests on real genomic data, which the paper does not mention.", "suggestion": "A short paragraph in Implementation or Availability describing the test suites, what they cover, the test data and expected outputs, and whether they run automatically.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the only checks the paper describes are the module validator's (Section 4), which test module files rather than the engine, and the defence found nothing else. The project README in the code snapshot gives pytest commands for the test suites, so the description the referee asks for exists to be summarised.", "finding_ids": ["PR-2"]}, {"id": "SM-14", "severity": "optional", "location": "Section 6.4, Input format", "concern": "The liftover is not described: the tool and chain file, whether it is applied to the user's VCF or to the module and scoring files, and how failed or ambiguous lifts are handled. No GRCh37 input was benchmarked, so GRCh37 support rests on an undescribed step that can silently drop or misplace variants.", "suggestion": "A description of the liftover step and the proportion of variants that fail or move on a GRCh37 test input; or a statement that GRCh37 support is experimental.", "route": "fixable-in-text", "placement": "limitations", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: liftover is mentioned as supported in Section 6.4 and as added in Section 6.5, but its tool, chain file, direction and failure handling are not described and it is not marked experimental, as the defence found. The integrity check of 22 October 2026 found that liftover exists only in the standalone just-prs library behind an optional extra, which the installed platform does not include, so the sentence attributes a capability to the wrong component.", "finding_ids": ["IC-10"]}]}, {"seat": "skeptic", "summary": "The authors present Just-DNA-Lite, a local web platform that joins a personal VCF against declarative, data-only annotation modules and computes PGS Catalog scores through the just-prs library, and they support it with two benchmarks on one public genome: a 172-fold annotation speedup over their own OakVar-based Generation I system, and 12.3- and 5.7-fold median per-score speedups over PLINK2 with Pearson r = 0.999859. The engineering is substantial and the Abstract is carefully hedged, but each headline number has a simpler explanation the paper does not exclude: the two annotation arms are not shown to do the same work or give the same output, the PLINK2 timing is a per-call harness whose own mean runtimes imply less than a twofold difference, and a correlation across differently scaled scores cannot show per-score agreement. The novelty rests on the sentence a rejection letter would quote, that there is no open-source platform combining annotation with ease of use, transparency and extensibility, which OpenCRAVAT and the authors' own Generation I contradict; and pgsc_calc, the obvious comparator for the PRS component, is not discussed. Most of this can be repaired by reanalysing data the authors already hold and by narrower wording, but how the default percentile is computed when only about half the scoring variants match needs an answer before that user-facing output can be relied on.", "isolation": "", "strengths": ["The Abstract states the limits of its own benchmarks, which removes the most common overreach in PRS software papers.", "Benchmarking on a publicly released CC0 genome lets any reader rerun the Just-DNA-Lite arm on the same input.", "The authors do not turn a harness limitation into a claim about PLINK2 in general.", "The registry's guarantees are stated precisely, separating artifact integrity from scientific validity.", "The privacy boundary of the AI features is stated candidly instead of being covered by the local-first framing.", "Peak memory is measured and reported, which supports the claim that whole-genome annotation fits on a personal computer, while the same paragraph says the HDD workstation does not establish laptop runtime.", "The imputation assumption behind reference-homozygote restoration is stated and the mode is opt-in, so users are not given restored scores silently."], "concerns": [{"id": "SK-1", "severity": "major", "location": "Section 5.1, paragraph after Table 4; Table 2", "concern": "The paper never states that the two arms did the same work: which modules and reference sources each applied, whether Ensembl annotation was on, how many variants each annotated, what a warm run reuses, or whether OakVar had comparable warm state. The Abstract gives only the warm-run ratio; the cold-start ratio of about 33-fold (6,705/203.3) appears only in Table 2.", "suggestion": "For each arm, the modules and reference sources applied, the Ensembl setting, the number of annotated output rows and exactly what a warm run reuses; if the workloads differ, a same-workload comparison or a narrower claim; and the cold-start ratio beside, or instead of, the warm-run ratio in the Abstract.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the Abstract labels the 38.9 s as warm-run and Table 2 gives the cold-start ratio, so the caching alternative is visible from the paper's own numbers, but workload equivalence is not addressed anywhere (Section 5.1, Tables 2 to 4, Supplementary S2), as the defence found. The integrity and reporting checks of 22 October 2026 found the same gap and asked for the same definitions.", "finding_ids": ["IC-1"]}, {"id": "SK-2", "severity": "major", "location": "Section 5.1 (Annotation Speed)", "concern": "Nothing in the paper shows that Just-DNA-Lite returns the same annotations as Generation I, or as any independent annotator, for the benchmark genome, so 'faster' is not shown to mean 'faster at producing the same result'; a rewrite that silently drops variants (multi-allelic sites, indels, rsID mismatches) would also be faster. This is the first control a hostile referee would ask for, and it is the only possible check of the engine's correctness as distinct from the modules' scientific content, which the paper rightly says it does not evaluate.", "suggestion": "For the benchmark genome, per-module agreement between Generation I and Just-DNA-Lite outputs (variants matched, genotypes and weights assigned), with every discrepancy explained; or, if Generation I output is not available, agreement of the joined records with an independent annotation for each module.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: nothing in Section 5.1, Tables 2 to 4, the Supplementary S2 summary, Section 2.1 or Section 7 reports that the two systems produced the same annotations for the benchmark genome, and the disclaimer in Section 5.2 covers the scientific content of modules, not the engine; the defence found no answer. The claim needs it, because a speed ratio means faster at the same task only if the outputs agree; narrowing the claim to runtime alone is the cheaper alternative.", "finding_ids": ["PR-2"]}, {"id": "SK-3", "severity": "optional", "location": "Section 5.1, paragraph 1; Table 4; Supplementary S2", "concern": "The comparator arm is three OakVar runs dated 2023-02-17, 2023-02-19 and 2023-05-07 (Supplementary S2), while Table 4 lists Linux 6.8.0, a kernel first released in March 2024, so the two arms did not run in the same software environment and the OakVar arm is a historical record rather than something the repository scripts re-run. 'Fully reproducible end-to-end' and 'same hardware' therefore hold for one arm only, and the 35% spread among the three OakVar runs (5,651 to 7,662 s) suggests the environment mattered.", "suggestion": "A statement of when, and under which OS, storage state and input file, each arm ran, and whether the provided scripts reproduce the OakVar arm; ideally a contemporaneous rerun of Generation I beside Just-DNA-Lite.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the OakVar runs are dated 2023-02-17, 2023-02-19 and 2023-05-07 in the Supplementary S2 summary, Table 4 gives one operating system (Linux 6.8.0), and the paper does not say that the provided scripts reproduce the OakVar arm; the defence found no answer. The integrity check of 22 October 2026 confirmed the kernel's release date (10 March 2024) and found no script in the repository that produces Tables 2 or 3.", "finding_ids": ["IC-1"]}, {"id": "SK-4", "severity": "major", "location": "Abstract, paragraph 3; Section 5.2, Table 5", "concern": "What each per-score timing includes (process start, genome loading, input conversion, scoring-file parsing) is not stated, and no end-to-end or batched PLINK2 comparison is given. The Abstract reports only the median ratios, although Table 5's means give about 1.8 for DuckDB (0.703/0.394) and 1.5 for Polars (0.703/0.466), and PLINK2 can compute many scores in one pass (--score-col-nums, --score-list).", "suggestion": "Timings that state what is included, plus total wall-clock time to score the 96 shared PGS IDs from the same starting VCF for each engine, with input conversion and genome loading counted and PLINK2 run in its multi-score mode; or the Abstract narrowed to per-score invocation in this harness, with the mean ratios given beside the medians.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Section 5.2 says that the ratios are of engine-level medians and Table 5 gives the means, so the concern's arithmetic comes from the paper itself, but what a timing includes is not stated, as the defence found. The reporting check read the PLINK 2.0 score documentation on 22 October 2026, which describes the multi-score options, and the integrity check found that the just-prs benchmark page shows PLINK2 faster on the three files of more than one million variants that it completed.", "finding_ids": ["IC-3"]}, {"id": "SK-5", "severity": "major", "location": "Abstract, paragraph 3; Section 5.2, Table 6 and following paragraph", "concern": "Per-score relative differences and per-engine matched-variant counts are not given, so the one per-score figure, a maximum absolute difference of 21.4, cannot be judged, and the explanation offered for the differences (position-based matching recovers variants that exact identifiers miss) is asserted rather than shown. The DuckDB-Polars agreement to 1e-13 tests only the arithmetic, because both engines share one matching step.", "suggestion": "For each of the 96 scores, the relative difference (or the difference in standard-deviation units of the reference distribution) and the matched-variant count per engine, with the number of scores beyond a stated tolerance; and a control in which PLINK2 is given the just-prs-matched variant set, which should agree to rounding if matching is the only difference.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the Conclusion names evaluation across individuals and matched-variant sets as still needed, so agreement across individuals is conceded, but per-score magnitudes and the same-variant-set control are given nowhere (Section 5.2, Tables 5 and 6). The reporting check of 22 October 2026 found on the just-prs benchmark page that the PLINK2 input was autosomes only, a second source of difference the paper does not mention.", "finding_ids": ["IC-4"]}, {"id": "SK-6", "severity": "major", "location": "Section 5.2, paragraph after Table 6; Section 3.2, paragraphs 2 and 4", "concern": "With a variant-only VCF and restoration off (the default the paper describes, and the benchmark's setting judging by its 50 to 54% match rates), about half of each score's loci are absent; where the effect allele is the reference allele those loci add nothing instead of twice the weight. The paper does not say how the reference distribution is put on the same variant set, and does not show how far the default moves the reported percentile.", "suggestion": "A Methods statement of how the reference distribution is matched to the variants scored in the user's genome, and, for the benchmark genome, the percentile for each score with and without reference-homozygote restoration (existing data); or the percentile claim narrowed.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Section 5.2 names missingness as affecting the reference comparison and match rates are shown to users, but neither the method nor its effect is given, as the defence found. The claim that the percentile reflects the user's position needs the method; the restoration comparison uses existing data, and narrowing the percentile claim is the cheaper alternative. The integrity check of 22 October 2026 found that the web interface enables restoration for whole-genome samples by default, so the concern applies to the library and the benchmark as the paper describes them.", "finding_ids": ["PR-6"]}, {"id": "SK-7", "severity": "major", "location": "Introduction, paragraph 2", "concern": "The sentence in Section 1, paragraph 2 that no open-source platform combines comprehensive annotation with ease of use, transparency and extensibility is contradicted by published open-source software: OpenCRAVAT offers a graphical interface, single-command installation and an installable module store, and the authors' own Generation I, Just-DNA-Seq, was published as an open-source personal genomics platform with annotation modules and polygenic scores. The difference the paper does state, data-only modules instead of Python plugins, comes three paragraphs later and is not offered as the gap.", "suggestion": "A narrower statement of what Just-DNA-Lite does that OpenCRAVAT/OakVar and Generation I do not (for example, data-only modules without executable plugins, local PGS Catalog scoring in the same interface, MCP access), with a short feature comparison naming those tools.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Section 1, paragraph 5 states how Just-DNA-Lite differs from Generation I, as the defence found, but paragraph 2 keeps the absolute claim. The reference check of 22 October 2026 found the same sentence unsupported, quoting the OpenCRAVAT paper (open source, graphical interface, single-command installation, a module store) and the Generation I paper, and proposed a narrower wording; both identifiers resolved in that check and in this review's lookup.", "finding_ids": ["IC-5"]}, {"id": "SK-8", "severity": "optional", "location": "Introduction, paragraph 3", "concern": "Introduction, paragraph 3 still says that no existing tool makes it straightforward to annotate a personal VCF against these databases, which the authors' own Generation I, the origin of the LongevityMap module (Section 3), contradicts. The gap relative to Generation I is stated two paragraphs later, not here.", "suggestion": "State the gap relative to Generation I (for example, modules as data rather than Python plugins, so content can be updated without code), not as the absence of any tool.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the gap relative to Generation I (modules as data rather than Python plugins) is already stated in Section 1, paragraph 5 and Section 2.2, as the defence found, so only the absolute wording in paragraph 3 remains. The reference check of 22 October 2026 found the same, quoting the Generation I paper, and proposed a wording.", "finding_ids": ["IC-5"]}, {"id": "SK-9", "severity": "major", "location": "Section 3.2 and Section 5.2", "concern": "pgsc_calc, the PGS Catalog's own open-source calculator, applies PGS Catalog scoring files to target genomes with variant harmonisation and reports ancestry-normalised scores against reference panels; it is the closest published software to just-prs and is neither cited nor compared, so neither the speed claim nor the reference-percentile method is positioned against the tool a reader would use instead.", "suggestion": "A comparison with pgsc_calc on the benchmark genome (matched variants, scores, percentiles and runtime for the same PGS IDs), or at least an account of what just-prs offers that pgsc_calc does not (single-genome interactive use, MCP access, consumer arrays). Narrowing the positioning would do for Genes; BioData Mining's software-article criterion asks for the direct comparison.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: pgsc_calc is neither cited nor compared, the only tools named are PLINK, ANNOVAR, VEP and PLINK2, and the Bibliography cites only the 2021 PGS Catalog paper, as the defence found. The 2024 paper resolved to the named work in this review's lookup of 22 October 2026, and the reference check of the same day suggested citing it for the PGS Catalog figure in Section 3.2. The paper claims no superiority over pgsc_calc, so the fair concern is positioning in the text; the measured comparison belongs to BioData Mining's criterion.", "finding_ids": ["JS-1", "PR-7"]}, {"id": "SK-10", "severity": "optional", "location": "Supplementary Material, S2 summary", "concern": "The Supplementary S2 summary says the speedup is attributable to named components, a causal attribution that Section 5.1 says this comparison does not support.", "suggestion": "Replace the S2 sentence with the main text's wording, or report an ablation that separates the components.", "route": "fixable-in-text", "placement": "supplement", "cost": "text", "defence": "partly answered", "verdict": "downgraded", "verdict_evidence": "Downgraded to a wording inconsistency in the supplement: the main text carries the correct non-claim (Section 5.1), as the defence found, so the paper's stated position is right and only the S2 sentence contradicts it. The integrity check of 22 October 2026 found the same and proposed rewording S2 as a list of design differences.", "finding_ids": ["IC-25"]}, {"id": "SK-11", "severity": "optional", "location": "Section 2.1, step 3 (Module annotation)", "concern": "Which join the benchmark used and how many module variants matched in the benchmark genome is not stated, and Section 2.1's stated default (rsID) would match nothing on a DeepVariant VCF without IDs; whether module joins check reference and alternate alleles is not said.", "suggestion": "State which join each module used in the benchmark, how many module variants matched in the benchmark genome, and whether module joins check reference and alternate alleles.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "not answered", "verdict": "downgraded", "verdict_evidence": "Downgraded: the defence found no answer in the paper, but the integrity check of 22 October 2026 found in the code that module joins use position and genotype with a reference-allele check by default, so neither the empty-ID worry nor the missing allele check applies to the software; the paper's sentence is wrong and the match counts are missing.", "finding_ids": ["IC-11"]}, {"id": "SK-12", "severity": "optional", "location": "Section 3.1, paragraph 2", "concern": "The paper's case against commercial platforms is that users cannot verify how findings were weighted, yet the shipped longevity weights rest on a w_SNP described only by the kinds of evidence it reflects, with no rule mapping study counts, p-values and replication to a number; a reader can see the weights but cannot audit or reproduce them.", "suggestion": "The rubric that maps evidence to w_SNP values, or a plain statement that w_SNP is curator judgement, with the evidence for each value recorded per variant.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: w_genotype is fully specified in Section 3.1, but w_SNP is described only by the kinds of evidence it reflects, with no formula, decision table or range, and the paper does not say it is curator judgement, as the defence found; this sits against the Introduction's contrast with opaque commercial curation. The reference check of 22 October 2026 found that the curation figures in Section 3.1 come from the Generation I paper (Kulaga et al., 2024), which the authors can cite for the weighting if it is described there.", "finding_ids": ["PR-8"]}, {"id": "SK-13", "severity": "optional", "location": "Introduction, paragraph 4", "concern": "The Introduction lists ease of use for people without bioinformatics training as one of three problems the platform must solve, without saying that it is a design aim not evaluated here; the workshops are mentioned without participants or outcomes.", "suggestion": "Present ease of use as a design aim not evaluated here, or report what the workshops showed.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "downgraded", "verdict_evidence": "Downgraded to a wording point: the paper claims no usability result and concedes in Section 6.3 that user understanding is untested, as the defence found, so no claim rests on an evaluation it lacks; the Introduction's framing is what remains.", "finding_ids": ["PR-10"]}, {"id": "SK-14", "severity": "optional", "location": "Section 5.2, paragraph 1; Table 5 footnote", "concern": "The paper does not say how the 100 scores were chosen (at random, by size, by build availability), so it is not known whether runtime and agreement extend to the 5,000+ scores just-prs offers; and the four genome-wide scores that PLINK2 did not complete have no external check, although the footnote presents scoring them as an advantage.", "suggestion": "The selection procedure and the list of PGS IDs; optionally an external check (PLINK2 with a matching identifier scheme, or pgsc_calc) for the four genome-wide scores.", "route": "fixable-in-text", "placement": "supplement", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: only the size profile of the 100 scores is given (7 with at least one million variants, the four largest at 6.6 to 6.9 million), not the selection rule or the list, and the four genome-wide scores are checked only DuckDB against Polars, which share one matching step, as the defence found. The reporting check of 22 October 2026 found that the just-prs benchmark page describes the set as consecutive IDs from PGS000006 to PGS000106, which is 101 IDs, and that the footnote's reason for PLINK2's four failures does not fit how PLINK2 behaves.", "finding_ids": ["IC-14"]}]}, {"seat": "champion", "summary": "The authors present Just-DNA-Lite, a local, open-source platform that joins a personal VCF against data-only annotation modules and computes PGS Catalog scores through the separable just-prs library, with web, command-line, Python and MCP interfaces. On one public CC0 genome they show annotation about 172 times faster than their OakVar-based first generation (about 33 times from a cold start) within 750 MB of RAM, two scoring engines that agree to 1e-13 and score all 100 test PGS including 6.9-million-variant files, and agreement with PLINK2 at r = 0.999859 with faster median per-score times. The design (modules as data with an integrity contract kept apart from scientific correctness, conservative defaults, visible provenance and coverage) and the care with which every claim is limited to computation on one genome are the paper's strongest assets and should be put forward. What the evidence does not yet show is that individual scores and percentiles are right: agreement is measured across scores rather than per score or across individuals, the variant-matching rules and the reconciliation of absent loci with the 1000 Genomes reference are not described, and what the PLINK2 timings include is undefined. Most of this is reanalysis of data the authors already hold, and with it this would be a useful, well-scoped software paper.", "isolation": "", "strengths": ["The headline results are stated with exactly the scope the evidence has. This calibration runs through the paper and should be kept in every revision.", "Benchmarking on a public, CC0-licensed whole genome, with scripts in the repository, lets anyone rerun both benchmarks on the same input. Few personal-genomics tools offer this.", "Data-only modules remove the code-execution risk of third-party plugins and let content be versioned and updated independently of the application. This is the paper's most reusable design idea and deserves to be put forward as its main contribution.", "Keeping artifact integrity apart from scientific correctness is a precise and rarely stated distinction; it applies equally to the validator (Section 4) and the registry.", "Two independently implemented engines agreeing to floating-point precision on 100 scores is a result that survives any objection about the comparator, and it supports offering both engines interchangeably.", "Both engines scored files of up to 6.9 million variants on one genome, with small per-call memory reported in S3; handling genome-wide scores locally is a practical capability worth stating plainly.", "The authors do not turn a comparator-configuration failure into a claim against PLINK2, which is what a fair benchmark should do.", "The raw runs are given, and they reproduce the summary: mean 6,705 s, SD about 1,009 s, SEM about 583 s. The Just-DNA-Lite SEMs and the 172x, 33x and 7.7x ratios in Table 2 also recompute from the reported numbers.", "An assumption-laden imputation is opt-in and its assumption ('the absent loci were callable and homozygous reference') is written out, a conservative default for a tool aimed at non-specialists.", "Showing the matched-variant count beside each score, and reporting the 50-54% benchmark match rate in the text, makes coverage part of the result rather than a hidden detail.", "Presenting all catalogue models for a trait, with their disagreement, is a sound answer to the known instability of single-model PRS and distinguishes this tool from consumer reports.", "Machine-readable provenance for AI-drafted content, enforced at the module level, is a concrete and transferable practice.", "The privacy boundary of the MCP integration is stated honestly instead of being folded into a blanket 'local-first' claim.", "A standalone PRS library with Python, CLI, web and MCP entry points sharing one implementation is useful beyond this platform and widens the paper's audience.", "The authors do not claim that their transparency features improve understanding without evidence; this restraint should be kept."], "concerns": [{"id": "CH-1", "severity": "major", "location": "Section 5.2, Table 6 and the paragraph after it", "concern": "The only external check on score correctness is a Pearson correlation across 96 different scores, which is set mainly by the largest-magnitude scores and can be near 1 while individual scores differ; the maximum difference of 21.4 is given without the size of its score, and the attribution of residual differences to variant matching is not shown.", "suggestion": "A per-score supplementary table (PGS ID, variants in the scoring file, variants matched by each engine, score from each engine, absolute and relative difference), and a PLINK2 run given the same matched variant set in which the remaining differences fall to numerical precision. Agreement across the 1000 Genomes individuals would also support the percentiles, but the paper does not claim agreement in rankings.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the Abstract and Section 5.2 already confine the correlation to one genome and disclaim agreement across individuals, as the defence found, but the point that a cross-score correlation can hide per-score disagreement is not answered. The integrity check of 22 October 2026 made the same point and asked for per-score relative differences.", "finding_ids": ["IC-4"]}, {"id": "CH-2", "severity": "major", "location": "Section 3.2 and Section 5.2", "concern": "The rules by which just-prs matches scoring-file variants to genotypes are not described: how effect and other alleles are oriented against REF/ALT, how strand-ambiguous (A/T, C/G) SNPs, multi-allelic sites and indels are treated, which coordinates of the scoring file are used (harmonised PGS Catalog files or author-reported positions, and when liftover applies), and what the 'quality tiers' shown beside each score mean. These rules decide whether a computed score is the published score.", "suggestion": "A Methods paragraph or supplementary table giving the matching and orientation rules, the handling of palindromic, multi-allelic and indel variants, the scoring-file build used and the definition of the quality tiers; ideally with the number of variants each rule removed for the benchmark genome.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the defence searched Sections 3.2, 3.2.1, 5.2 and 6.4, the Figure 3 legend and the supplementary summaries and found only the phrase 'by genomic position with allele-orientation handling'; strand-ambiguous, multiallelic and indel handling, the scoring-file build and the meaning of the 'quality tiers' are not given.", "finding_ids": ["PR-5"]}, {"id": "CH-3", "severity": "major", "location": "Section 3.2, paragraphs 2 and 4; Section 5.2, paragraph after Table 6", "concern": "The manuscript does not say how user and reference scores are put on the same variant set, or the genome build of the 1000 Genomes distributions, and the effect of restoration on match rate and percentile is not quantified. If the reference distributions use the full scoring file while the user's score omits absent loci, the reported percentile is biased in a direction that differs between scores.", "suggestion": "A statement of how user and reference scores are put on the same variant set (reference rescored on the user's matched variants, restoration applied to the user, or the reference computed as if variant-only), and which 1000 Genomes release and build the distributions use; and, for the benchmark genome, match rate and percentile for a few scores with restoration off and on, which would also quantify the coverage gain the text attributes to restoration ('This can increase scoring-file coverage for many scores').", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the release is given and the paper treats coverage as part of interpreting a result (Section 3.2), but no method that removes or bounds the bias is described and Section 5.2 says the coverage gains are not quantified, as the defence found. The integrity check of 22 October 2026 found that the web interface enables restoration for whole-genome samples by default, contrary to Section 3.2, which changes which percentile users see and must be stated.", "finding_ids": ["PR-6"]}, {"id": "CH-4", "severity": "major", "location": "Abstract; Section 5.2, Table 5", "concern": "What a per-score runtime includes is not stated for any engine. If PLINK2 is invoked once per score, each timing includes process start and reading the genotype file, while the in-process engines may reuse a genome already converted to Parquet and held in memory; one-off steps (VCF conversion to pgen or Parquet, scoring-file download and parsing) may be counted for one side only. Medians of 0.05 to 0.6 s are the range such overheads occupy, so the ratio may reflect invocation style rather than scoring.", "suggestion": "A Methods statement of the timed interval for each engine (what is cached, what is converted beforehand, whether PLINK2 is called per score); end-to-end wall time to score all 100 PGS from the VCF for each engine including one-off preparation; and PLINK2 scoring several scores in one pass as a second configuration. If just-prs is still faster on that basis, the claim stands as written.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the defence found only that times are seconds per PGS ID and that the speedups are ratios of medians; whether PLINK2 runs once per score and what preparation is excluded are not stated. The integrity and reporting checks of 22 October 2026 found on the just-prs benchmark page that conversions were done once outside the timings and that each PLINK2 call is a new process with a floor of about 600 ms, which supports the concern that the ratio reflects invocation style.", "finding_ids": ["IC-3"]}, {"id": "CH-5", "severity": "major", "location": "Introduction, paragraph 2", "concern": "The absolute sentence in Section 1, paragraph 2 is not narrowed, and Just-DNA-Lite is not positioned against OpenCRAVAT, impute.me or the PGS Catalog Calculator pgsc_calc, none of which is cited. The paper's actual advance (data-only modules with a manifest and integrity contract, local PRS with reference percentiles, and MCP access in one package) is easier to defend than an absolute statement that no such platform exists.", "suggestion": "A narrower statement of what Just-DNA-Lite does that these tools do not, with a short feature table (local execution, module format, PRS harmonisation and reference distributions, interfaces, licence) against OpenCRAVAT, impute.me and pgsc_calc; for BioData Mining, a direct comparison with pgsc_calc on the same genome and scores.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the paper does set Just-DNA-Lite against its OakVar-based predecessor (Section 1, paragraph 5), so the part about OakVar is answered, but the other three tools are not cited, as the defence found. All three works resolved to the named papers in this review's lookup of 22 October 2026, and the reference check of the same day found the Section 1 sentence contradicted by OpenCRAVAT and by Generation I.", "finding_ids": ["JS-1", "PR-7"]}, {"id": "CH-6", "severity": "optional", "location": "Abstract; Section 5.1, Tables 2 and 3; Supplementary S2", "concern": "'Warm' and 'cold start' are not defined, and it is not said whether the OakVar and Just-DNA-Lite runs applied the same modules with the same Ensembl setting. The improvement survives either reading (the cold start is still about 33x), but which ratio is like-for-like depends on this, and the Abstract gives only the warm one.", "suggestion": "Definitions of warm and cold runs; the module set and Ensembl setting in both systems and the OakVar runs' cache state; the cold-start ratio beside the warm one in the Abstract if it is the like-for-like comparison.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the paper labels the 172-fold figure as warm-run and Table 2 reports the cold-start ratio, as the defence noted, but the definitions and the module and Ensembl settings are given nowhere. The concern's last point, the causal wording of Supplementary S2, is handled with the skeptic's finding on S2 (SK-10), since the main text already carries the correct non-claim.", "finding_ids": ["IC-1"]}, {"id": "CH-7", "severity": "optional", "location": "Section 5.2, paragraph 1; Code Availability, Table 7", "concern": "How the 100 scores were chosen from the 5,000+ in the catalogue is not stated, nor are the PLINK2 version and command, the versions of just-prs, DuckDB and Polars, or an archived release of the benchmarked code. The selection bears on how far the speed and agreement results generalise across the catalogue, and the versions on whether the benchmark can be rerun as it was run.", "suggestion": "The list of 100 PGS IDs with variant counts and the selection rule; the PLINK2 version and flags; versions or commit hashes of the benchmarked code; an archived release (for example a Zenodo DOI) of just-dna-lite and just-prs at those versions.", "route": "fixable-in-text", "placement": "supplement", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the PRS script path is named in Section 5.2, but the list of PGS IDs, the selection rule, the PLINK2 version and flags, the software versions and an archived release are not given, as the defence found. The reporting check of 22 October 2026 found the same and that the named script path does not exist at the repository root; the archived release waits until the code is final.", "finding_ids": ["IC-14", "IC-38"]}, {"id": "CH-8", "severity": "optional", "location": "Section 3.2.1, paragraph 3; Section 6.4", "concern": "Section 3.2.1 lists ancestry detection among the PRS tools without saying what it does, which contradicts Sections 3.2 and 6.4, where users select the reference superpopulation; a reader cannot tell which interface, if any, infers ancestry and sets the reference behind a percentile.", "suggestion": "One consistent statement of which interface, if any, infers ancestry, by what method and with what check, or removal of ancestry detection from the feature list.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Sections 3.2 and 6.4 agree that the user chooses the reference superpopulation, which answers part of the concern, as the defence found, but the contradiction with Section 3.2.1 remains. The integrity check of 22 October 2026 found that the code agrees with Section 3.2.1: the web interface infers the superpopulation when a file loads and uses it as the default percentile panel, so Sections 3.2 and 6.4 are the sentences to correct. The policy-fit check found the same inconsistency.", "finding_ids": ["IC-9"]}, {"id": "CH-9", "severity": "uncertain", "location": "Section 2.1, step 3; Section 5.1", "concern": "Per-module matched-row counts for the benchmark genome are not given, and the paper does not say how module rows for homozygous-reference genotypes are reported when a variant-only VCF has no record at those sites; restoration is described only for just-prs.", "suggestion": "Per-module matched-row counts for the benchmark genome, and how homozygous-reference genotypes are reported for module rows when the input is a variant-only VCF.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "partly answered", "verdict": "downgraded", "verdict_evidence": "Downgraded to a question: the rsID part is settled, because the integrity check of 22 October 2026 found that module joins use position and genotype by default and that the benchmark VCF has no rsIDs, so Section 2.1's sentence is wrong rather than the benchmark empty. The question about wild-type module rows remains open: the defence notes that in the longevity module the reference genotype has a weight of 0 (Section 3.1), so displayed weights would not change there, but report completeness is not addressed, and the integrity check could not locate the validator's wild-type presence rule.", "finding_ids": ["IC-11", "PR-15"]}, {"id": "CH-10", "severity": "optional", "location": "Section 3.1, paragraph 2", "concern": "The rule that turns the number of significant studies, p-values and replicating populations into w_SNP is not given, so the displayed score W_display, and the module's stated contribution of weighted scores based on study quality, replication and significance, cannot be reproduced or compared between modules.", "suggestion": "The formula or decision table for w_SNP, with its range, in Section 3.1 or a supplement.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: no formula, decision table or range for w_SNP is given in Section 3.1, Table 1, the Figure 2 legend, Section 4 or the Supplementary S1 summary, as the defence found, so the displayed score W_display cannot be reproduced from the paper.", "finding_ids": ["PR-8"]}, {"id": "CH-11", "severity": "optional", "location": "Section 3.1, paragraph 1; Table 1; Figure 2 legend", "concern": "The LongevityMap-based module is called 'Longevity Map' in Table 1 and 'Longevity Variants' in Section 3.1 and the Figure 2 legend, close to the AI-generated 'Longevity Variants 2026', so a reader can attribute the expert curation, including the 50 new and 876 edited entries, to the AI-generated module.", "suggestion": "One name per module, used consistently in Table 1, Section 3.1 and the Figure 2 legend, with its curator stated.", "route": "fixable-in-text", "placement": "with-claim", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: a careful reader can tie the curation to the expert curator through the Contribution Statements and the LongevityMap link, as the defence found, but the naming inconsistency is real. The integrity check of 22 October 2026 found the same naming problem and, further, that Table 1 does not match the modules the default source ships.", "finding_ids": ["IC-29"]}, {"id": "CH-12", "severity": "optional", "location": "Back matter; Section 5.1", "concern": "There is no explicit statement of the genome donor's consent to publication and public release, no ethics statement (or the reason none was needed) and no Data Availability section giving the Zenodo DOI, which the target journals list as required sections.", "suggestion": "A consent statement from the genome donor covering publication and public release, an ethics statement (or the reason none was needed), and a Data Availability Statement giving the Zenodo record with its DOI.", "route": "policy", "placement": "", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: the source, record number and licence are stated in Section 5.1 and Table 4, as the defence found, but no consent, ethics or data availability statement exists, and these statements wait until the submission files are final. The policy-fit check of 22 October 2026 found from the Zenodo record that the benchmark genome is the first author's own CC0 release, not that of the co-author the Contribution Statements credit with providing her genome, and drafted a statement from the confirmed facts; correcting that attribution is current work.", "finding_ids": ["PF-13"]}]}], "readers": [{"seat": "informed-outsider", "takeaway": "Just-DNA-Lite is a free, open-source program you run on your own computer that matches a person's genome file against curated variant lists such as LongevityMap and against published polygenic scores; it is much faster than the group's earlier version and makes no claim of clinical validity.", "stopped_at": "1. Introduction: Four software names I had never heard of came in one sentence, and from there through most of Section 2 the text was written for programmers, so I skimmed until the longevity module in Section 3.1 pulled me back in.", "next": "forward it", "left": "", "dips": [], "round": "", "path": [], "isolation": ""}, {"seat": "potential-user", "takeaway": "It's a local web app with a separable PRS library. You give it a VCF you already have, and it matches your variants against a few curated trait modules (mostly longevity and fitness) and against any PGS Catalog score. You get tables you can browse, PDF/HTML reports, and percentiles against the 1000 Genomes superpopulations. All benchmarks are on one genome, and it's meant for research and education only.", "stopped_at": "2.2 Modular Plugin System (I kept going to the end, but skimmed from here on in places): The paper stopped telling me what happens to my VCF and started describing packaging rules for people who write modules, which I am not. 2.3 pulled me back in, but my attention dropped again in the second half of 3.2.1 (MCP) and in the OakVar comparison in 5.1.", "next": "try it", "left": "", "dips": [], "round": "", "path": [], "isolation": ""}, {"seat": "skimmer", "takeaway": "An open-source web tool that runs on your own machine, annotates a whole-genome VCF against swappable data-table modules (the default set centres on longevity) and computes PGS Catalog scores; the benchmarks cover one public genome, compared against the authors' own earlier OakVar system and against PLINK2.", "stopped_at": "2. Platform Architecture: Right after the intro, the first sentences turned into build tools and package names (uv, Dagster, Reflex, just-dna-format) before I had seen what the tool gives me for a genome. I skimmed through Section 2 and only picked up again at the PRS paragraphs on reference-homozygote restoration and consumer arrays in 3.2, and at the match rates in 5.2.", "next": "try it", "left": "", "dips": [], "round": "", "path": [], "isolation": ""}, {"seat": "bioinformatician", "takeaway": "just-prs, the PRS library inside it, scored 100 PGS Catalog models on one public genome about 12 times faster per score than PLINK2 with near-identical results, while the annotation side is a Parquet join app benchmarked only against its own predecessor.", "stopped_at": "6.1 Limitations of Variant Annotation: The tool part ended with the PLINK2 benchmark in 5.2, and the Discussion opens with caveats I learned in my first GWAS course, so I would close here and go to the repository links instead.", "next": "bookmark", "left": "6.1 Limitations of Variant Annotation", "dips": ["1. Introduction", "2.2 Modular Plugin System", "3. Annotation Modules and Polygenic Scoring (Table 1)", "3.2.1 Standalone PRS Use and MCP Access, through 4. AI-Assisted Module Creation"], "round": "readers-configured", "path": [], "isolation": ""}, {"seat": "biology enthusiast", "takeaway": "There is a free, open-source program that runs on your own computer and checks the VCF from your sequencing company against published longevity, heart, cholesterol and fitness variant lists and thousands of polygenic scores, without uploading your genome anywhere.", "stopped_at": "5.1 Annotation Speed: After three tables of seconds, Xeon CPUs and RAM that had nothing to do with my genome, the one thing I wanted from this section (will it run on my laptop, as 2.4 promised) came back as not established, so I closed it.", "next": "bookmark", "left": "5.1 Annotation Speed", "dips": ["Abstract", "2. Platform Architecture", "2.2 Modular Plugin System", "3.2 Polygenic Risk Scores", "3.2.1 Standalone PRS Use and MCP Access"], "round": "readers-configured", "path": [], "isolation": ""}, {"seat": "biology student", "takeaway": "It's a free program you run on your own computer that matches your genome's variant file against published variant-trait lists (longevity, heart, lipids, fitness) and polygenic scores, so your DNA doesn't have to be uploaded, but it's for research and learning, not diagnosis.", "stopped_at": "5.2 PRS Computation: After three tables of seconds, CPU and RAM for tools I have never used, this sentence explained a disagreement between two programs I don't know, and I stopped caring which one was faster.", "next": "bookmark", "left": "5.2 PRS Computation", "dips": ["Abstract", "1. Introduction", "2.2 Modular Plugin System", "3.2.1 Standalone PRS Use and MCP Access"], "round": "readers-configured", "path": [], "isolation": ""}, {"seat": "clinician", "takeaway": "It is an open-source tool that lets a person re-annotate the VCF they already have and compute published polygenic scores on their own computer; the authors say up front that it gives no diagnoses and that they only tested its speed on one genome.", "stopped_at": "2.2 Modular Plugin System: By this point I had read two pages of software plumbing and nothing yet about what a score or report shown to a patient means, so I stopped.", "next": "bookmark", "left": "2.2 Modular Plugin System", "dips": ["Abstract", "Abstract", "1. Introduction", "2. Platform Architecture"], "round": "readers-configured", "path": [], "isolation": ""}, {"seat": "random curious person", "takeaway": "There is a free, open-source program that reads the DNA file a sequencing company gives you on your own computer, without uploading it anywhere, and shows what published studies say about your variants. It is for research and curiosity, though, and gives no diagnoses.", "stopped_at": "2.1 Annotation Pipeline (step 2, Normalization): By this point it read like setup notes for programmers, not something meant for me, and I still had no idea what the tool would tell me about myself, so I closed it.", "next": "stop here", "left": "2.1 Annotation Pipeline (step 2, Normalization)", "dips": ["Abstract (paragraph 2)", "Abstract (paragraph 3)", "1. Introduction (paragraph 5)", "2. Platform Architecture (paragraph 2) into the 2.1 lead-in"], "round": "readers-configured", "path": [], "isolation": ""}, {"seat": "wet-lab biologist", "takeaway": "There is an open-source tool that runs on your own computer, where you upload a VCF in a browser and get it annotated against published variant-trait databases and polygenic scores without uploading the genome anywhere, but someone has to install it with Python first and the built-in modules are about longevity, heart, lipids and athletic traits.", "stopped_at": "3.2.1 Standalone PRS Use and MCP Access: By this point the paper was talking to programmers and AI-assistant users, not to someone who wants to drop the VCFs from a sequencing run into a browser, and I still had not learned whether it handles more than one sample.", "next": "forward it", "left": "3.2.1 Standalone PRS Use and MCP Access", "dips": ["Abstract", "1. Introduction", "2. Platform Architecture", "2.2 Modular Plugin System", "3.2 Polygenic Risk Scores"], "round": "readers-configured", "path": [], "isolation": ""}, {"seat": "bioinformatician", "takeaway": "just-prs is a separable DuckDB/Polars PRS scorer that ran 100 PGS Catalog scores at a median of ~0.05 s each and matched PLINK2 at r = 0.999859 on one public WGS genome, and the annotator does a whole-genome VCF in ~39 s under 750 MB — but it is all one genome and match rates were only ~50%.", "stopped_at": "finished: I reached the repository table, which is where my path ends; from here I go to GitHub, not back into the paper.", "next": "try it", "left": "finished", "dips": ["Abstract", "1. Introduction", "5.2 PRS Computation", "2.2 Modular Plugin System", "3.2.1 Standalone PRS Use and MCP Access"], "round": "readers-paths", "path": [{"section": "Abstract", "how": "read"}, {"section": "1. Introduction", "how": "skimmed"}, {"section": "5.1 Annotation Speed", "how": "read"}, {"section": "5.2 PRS Computation", "how": "read"}, {"section": "Supplementary Material", "how": "skimmed"}, {"section": "2. Platform Architecture", "how": "read"}, {"section": "2.1 Annotation Pipeline", "how": "read"}, {"section": "2.2 Modular Plugin System", "how": "skimmed"}, {"section": "2.3 Web Interface and Self-Exploration", "how": "skipped"}, {"section": "2.4 Performance Characteristics", "how": "skipped"}, {"sect "how": "skimmed"}, {"section": "2.2 Modular Plugin System", "how": "skipped"}, {"section": "2.4 Performance Characteristics", "how": "skimmed"}, {"section": "5.1 Annotation Speed", "how": "skimmed"}, {"section": "3. Annotation Modules and Polygenic Scoring", "how": "read"}, {"section": "3.1 Longevity Variants Module (example)", "how": "read"}, {"section": "3.2 Polygenic Risk Scores", "how": "read"}, {"section": "3.2.1 Standalone PRS Use and MCP Access", "how": "skimmed"}, {"section": "3.3 Additional Trait Annotation Modules", "how": "skimmed"}, {"section": "3.4 Growing the Module Ecosystem", "how": "skipped"}, {"section": "4. AI-Assisted Module Creation (platform feature)", "how": "skimmed"}, {"section": "5.2 PRS Computation", "how": "skipped"}, {"section": "6.1 Limitations of Variant Annotation", "how": "read"}, {"section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome", "how": "read"}, {"section": "6.4 Limitations", "how": "read"}, {"section": "6.5 Future Directions", "how": "skimmed"}, {"section": "7. Conclusion", "how": "read"}, {"section": "Contribution Statements", "how": "skipped"}, {"section": "Funding", "how": "skipped"}, {"section": "Code Availability", "how": "skimmed"}], "isolation": ""}, {"seat": "biology student", "takeaway": "It's a free program you run on your own computer that matches your DNA variant file against published lists of gene variants and traits (like the LongevityMap longevity genes) and computes polygenic scores, and the authors keep stressing that it's for research and learning, not for diagnosis.", "stopped_at": "6.4 Limitations: I'd already got the biology I came for in 6.1, and when the limitations turned into a list of file formats and genome builds I closed the paper without reaching 6.5 or the Conclusion.", "next": "bookmark", "left": "6.4 Limitations", "dips": ["Abstract", "1. Introduction", "2.1 Annotation Pipeline", "3.2 Polygenic Risk Scores", "4. AI-Assisted Module Creation (platform feature)", "6.2 Local Processing and Data Privacy"], "round": "readers-paths", "path": [{"section": "Title", "how": "read"}, {"section": "Abstract", "how": "read"}, {"section": "1. Introduction", "how": "read"}, {"section": "2. Platform Architecture", "how": "skimmed"}, {"section": "2.1 Annotation Pipeline", "how": "skimmed"}, {"section": "2.2 Modular Plugin System", "how": "skipped"}, {"section": "2.3 Web Interface and Self-Exploration", "how": "skimmed"}, {"section": "2.4 Performance Characteristics", "how": "skipped"}, {"section": "3. Annotation Modules and Polygenic Scoring", "how": "read"}, {"section": "3.1 Longevity Variants Module (example)", "how": "read"}, {"section": "3.2 Polygenic Risk Scores", "how": "read"}, {"section": "3.2.1 Standalone PRS Use and MCP Access", "how": "skipped"}, {"section": "3.3 Additional Trait Annotation Modules", "how": "read"}, {"section": "3.4 Growing the Module Ecosystem", "how": "skipped"}, {"section": "4. AI-Assisted Module Creation (platform feature)", "how": "skimmed"}, {"section": "5.1 Annotation Speed", "how": "skipped"}, {"section": "5.2 PRS Computation", "how": "skimmed"}, {"section": "6.1 Limitations of Variant Annotation", "how": "read"}, {"section": "6.2 Local Processing and Data Privacy", "how": "skimmed"}, {"section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome", "how": "read"}, {"section": "6.4 Limitations", "how": "read"}], "isolation": ""}, {"seat": "clinician", "takeaway": "It is a free tool patients can run at home on their own genome file that lists published variant-trait associations and PGS Catalog percentiles against a 1000 Genomes group they pick themselves; the authors say outright that it has no clinical validity, and the paper's 'validation' covers speed and agreement between engines, not accuracy.", "stopped_at": "5.2 PRS Computation: I went to the section called 'Benchmarking and Validation' hoping for some evidence that what a patient sees on the report is correct, found only
