tables and metadata, allowing researchers to extend the catalogue without writing executable plugins. A shared module contract, automatic source discovery, and a versioned registry connect published annotation content to local analysis and downloadable reports. The just-prs library provides scoring through web, command-line, Python, and Model Context Protocol interfaces.\n\nFor one public whole-genome VCF, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware. In a separate benchmark of 100 polygenic scores on the same individual's genome, DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively. Correlation with PLINK2 across the 96 scores completed by all engines was Pearson r = 0.999859. These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals.\n\nCore annotation and scoring run locally, with reference datasets downloaded and cached on the user's machine. Optional external AI services introduce a separate data-sharing boundary. Just-DNA-Lite is released under AGPL v3 for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.", "after": "**Background:** Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data. We present Just-DNA-Lite, an open-source platform that combines local variant annotation and polygenic risk score (PRS) computation in a web interface.\n\n**Results:** Annotation modules contain variant-trait tables and metadata, allowing researchers to extend the catalogue without writing executable plugins. A shared module contract, automatic source discovery, and a versioned registry connect published annotation content to local analysis and downloadable reports. The just-prs library provides scoring through web, command-line, Python, and Model Context Protocol interfaces. Core annotation and scoring run locally, with reference datasets downloaded and cached on the user's machine. Optional external artificial intelligence (AI) services introduce a separate data-sharing boundary. For one public whole-genome variant call format (VCF) file, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware. In a separate benchmark of 100 polygenic scores on the same individual's genome, DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively. Correlation with PLINK2 across the 96 scores completed by all engines was Pearson r = 0.999859.\n\n**Conclusions:** These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals. Just-DNA-Lite is released under AGPL v3 for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C23. Three-heading abstract and the Declarations", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C23b", "kind": "Proposed edit", "section": "Back matter", "summary": "Add the BioData Mining back matter with every Declarations subheading (BioData Mining; waits for the journal choice)", "status": "proposed", "finding_ids": ["JS-5"], "before": "## **Contribution Statements**", "after": "## **Availability and requirements**\n(the block of JA-C13)\n## **List of abbreviations**\n[AUTHORS: or generate it at the end]\n## **Declarations**\n### Ethics approval and consent to participate\n(JA-C6, with the committee's name)\n### Consent for publication\n(JA-C7)\n### Availability of data and materials\n(JA-C5)\n### Competing interests\n(JA-C10)\n### Funding\n(the current text, and the funder's role if it had one)\n### Authors' contributions\n(JA-C11, ending \"All authors read and approved the final manuscript.\")\n### Acknowledgements\n(JA-C9)", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C23. Three-heading abstract and the Declarations", "skill": "manuscript-journal-adapt"}]}, {"id": "PE-C1", "kind": "Claim correction", "section": "Abstract, paragraph 3", "summary": "State the conditions of the 172-fold figure where the Abstract gives it", "status": "proposed", "finding_ids": ["IC-1"], "before": "For one public whole-genome VCF, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware.", "after": "For one public whole-genome VCF, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the mean of three 2023 runs of the earlier OakVar-based Just-DNA-Seq configuration on the same hardware; first runs (cold starts) averaged 203.3 seconds, about 33 times faster.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The ratio divides the mean of three OakVar runs from 2023 (Supplementary S2) by the warm-run mean, and the Abstract does not say so; the cold-start figure from Table 2 shows the reader the range of the gain. If you would rather add fewer numbers to the Abstract, keep only the words about the three 2023 runs.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C2", "kind": "Clarity", "section": "Abstract, paragraph 4", "summary": "Separate the licence from the intended use", "status": "proposed", "finding_ids": ["PF-10"], "before": "Just-DNA-Lite is released under AGPL v3 for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.", "after": "Just-DNA-Lite is released under the AGPL v3 licence and is intended for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "As written, the sentence can be read as a licence term limiting use to research and education, which the AGPL does not contain; the policy check proposed this wording.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C3", "kind": "Claim correction", "section": "1. Introduction, paragraph 1", "summary": "Give the sequencing cost that the sources support", "status": "proposed", "finding_ids": ["RC-4", "IC-16"], "before": "Whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003, and several companies now offer direct-to-consumer sequencing services (Whitley et al., 2020).", "after": "The cost of sequencing a human genome has fallen from an estimated $0.5–1 billion for the Human Genome Project's reference sequence, completed in 2003, to under $1,000 (National Human Genome Research Institute, [AUTHORS: year shown on the fact sheet]; Whitley et al., 2020), and several companies now offer direct-to-consumer sequencing services.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The reference check found that Whitley et al. (2020) supports the figure of under $1,000 and the direct-to-consumer companies, while the cost of the first genome comes from the National Human Genome Research Institute fact sheet, which gives $500 million to $1 billion and warns against confusing it with the whole project's cost. It needs the corrected Whitley entry and the new fact-sheet entry proposed under the Bibliography.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C4", "kind": "Claim correction", "section": "1. Introduction, paragraph 2", "summary": "Replace the claim that no open-source platform exists with the actual difference", "status": "proposed", "finding_ids": ["IC-5"], "before": "There is no open-source platform that combines comprehensive variant annotation with ease of use, transparency, and extensibility.", "after": "Open-source frameworks such as OpenCRAVAT (Pagel et al., 2020) and its fork OakVar, on which our first generation ran (Kulaga et al., 2024), combine a broad annotator catalogue with a graphical interface and an installable module store, but adding a resource to them still requires a script.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "OpenCRAVAT is open source, has a graphical interface and a module store, and OakVar, which ran Generation I, is built on it, so the absence claim does not hold; the OpenCRAVAT paper says a new resource needs a small script, which is the difference Just-DNA-Lite's data-only modules remove (Introduction, paragraph 5). It needs the Pagel et al. (2020) entry that the story stage's Bibliography proposal (ST-C21) adds.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C5", "kind": "Claim correction", "section": "1. Introduction, paragraph 3", "summary": "Say what the two cited sources report about APOE and FOXO3", "status": "proposed", "finding_ids": ["RC-7"], "before": "GWAS studies have identified candidate loci including APOE and FOXO3 as consistently associated with longevity across populations (Broer et al., 2014; Caruso et al., 2022), and the catalogue of longevity-associated variants continues to grow.", "after": "Candidate-gene studies first associated APOE and FOXO3 with longevity (Broer et al., 2014; Caruso et al., 2022). In a genome-wide meta-analysis of European-ancestry cohorts, only the APOE locus replicated consistently, and FOXO3 reached significance only when published data were included (Broer et al., 2014). The catalogue of longevity-associated variants continues to grow.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Both sources trace FOXO3 to candidate-gene studies, and Broer et al. found only APOE consistently replicated in their European-ancestry meta-analysis; the wording here follows the passages the reference check quoted. The year of Broer et al. stays 2014 here; the reference check's metadata repair would change it to 2015.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C6", "kind": "Claim correction", "section": "1. Introduction, paragraph 3", "summary": "Replace 'no existing tool' with what Generation I already did", "status": "proposed", "finding_ids": ["IC-5", "RC-8"], "before": "Databases such as LongevityMap within the Human Ageing Genomic Resources (HAGR) (Tacutu et al., 2017) have compiled thousands of variant-trait associations, but no existing tool makes it straightforward to annotate a personal VCF against these databases transparently and extensibly.", "after": "Databases such as LongevityMap within the Human Ageing Genomic Resources (HAGR) (Tacutu et al., 2017) have compiled thousands of variants tested for association with longevity. Our earlier OakVar-based platform, Just-DNA-Seq (Kulaga et al., 2024), annotated personal VCFs against a curated LongevityMap, but each new annotation source required a Python plugin.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Your own Generation I paper describes annotating an uploaded VCF against a curated LongevityMap, so 'no existing tool' is contradicted by your earlier work; what was missing is a way to add content without a plugin, which the next paragraphs describe. LongevityMap counts variants tested, about half of its entries negative, so 'associations' overstates it.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C7", "kind": "Claim correction", "section": "2.1 Annotation Pipeline, steps 3 and 4", "summary": "Give the join key the code uses and put DuckDB in the step that uses it", "status": "proposed", "finding_ids": ["IC-11", "IC-21"], "before": "3. **Module annotation.** For each selected annotation module, the pipeline performs a streaming join between the normalized VCF Parquet and the module's precomputed weights Parquet. Joins are performed by rsID (default) or genomic position. Polars streaming joins keep peak memory low; for datasets too large to fit in memory, DuckDB handles out-of-core joins with configurable memory limits.\n4. **Ensembl annotation (optional).** When enabled, the pipeline joins the normalized VCF against the Ensembl Variation database (cached locally as chromosome-level Parquet files downloaded from Hugging Face via fsspec), providing clinical significance labels, consequence types, and cross-references for each variant.", "after": "3. **Module annotation.** For each selected annotation module, the pipeline performs a streaming join between the normalized VCF Parquet and the module's precomputed weights Parquet. Joins are performed by genomic position and genotype (default), or by rsID for modules without coordinates. Polars streaming joins keep peak memory low.\n4. **Ensembl annotation (optional).** When enabled, the pipeline joins the normalized VCF against the Ensembl Variation database (cached locally as chromosome-level Parquet files downloaded from Hugging Face via fsspec), providing clinical significance labels, consequence types, and cross-references for each variant. DuckDB performs this join out of core, with configurable memory limits, for datasets too large to fit in memory.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The integrity check read the module join in the code: it matches on chromosome, position and genotype by default and falls back to rsID only for a module without coordinates, and the benchmark genome carries no rsIDs, so an rsID default would match nothing. The same reading found that module joins use Polars and that DuckDB runs the Ensembl join. The companion paper says modules are joined with DuckDB and needs the same correction.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C8", "kind": "Claim correction", "section": "2.4 Performance Characteristics", "summary": "Keep the laptop as the aim and report what was measured", "status": "proposed", "finding_ids": ["IC-2"], "before": "Consistent with the \"runs on a laptop\" principle, Just-DNA-Lite prioritizes memory efficiency over raw throughput: peak RAM stays low enough for a personal computer, and warm-run annotation of a whole genome completes in tens of seconds.", "after": "Just-DNA-Lite aims to run on a personal computer and therefore prioritizes memory efficiency over raw throughput; on the benchmark workstation, warm-run annotation of a whole genome completed in tens of seconds.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Section 5.1 says the benchmark ran on a 128 GB workstation and does not establish laptop performance, and the integrity check found that the memory figure is the larger of two readings taken at the start and end of each step, which can miss the peak; the sentence should not rest on either until a laptop run or a sampled peak exists.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C9", "kind": "Claim correction", "section": "3.1 Longevity Variants Module (example), paragraph 1", "summary": "Count LongevityMap in the units its paper uses", "status": "proposed", "finding_ids": ["RC-8"], "before": "It builds upon the LongevityMap database (Tacutu et al., 2017), which contains 3,144 variant-trait associations in 884 genes.", "after": "It builds upon the LongevityMap database (Tacutu et al., 2017), which in Build 3 (June 2017) lists 3,144 variants in 884 genes from 550 study entries, 275 of them reporting a significant association.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The cited paper counts 3,144 variants in 884 genes from 550 entries, of which 275 report a significant finding, and includes negative results; '3,144 variant-trait associations' reads as 3,144 positive associations.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C10", "kind": "Citation", "section": "3.1 Longevity Variants Module (example), paragraph 1", "summary": "Credit the curation numbers to the Generation I paper", "status": "proposed", "finding_ids": ["RC-10"], "before": "Our contribution here is not re-annotation or re-validation of these variants, but (1) curation and expansion with post-2017 literature, adding 50 new entries and editing 876 existing records; (2) assignment of weighted scores based on study quality, replication across populations, and statistical significance; and (3) pathway-based categorization for structured browsing.", "after": "Our contribution here is not re-annotation or re-validation of these variants, but (1) the curation and expansion published with Generation I (Kulaga et al., 2024), which drew on meta-analyses published after 2017, added 50 new entries and edited 876 existing records [AUTHORS: say what a record is here, since LongevityMap has 550 entries, and list anything added since 2024]; (2) assignment of weighted scores based on study quality, replication across populations, and statistical significance; and (3) pathway-based categorization for structured browsing.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The reference check found the 50 entries and 876 edited records, and the post-2017 meta-analyses, in your 2024 Generation I paper, so the sentence presents published work as new without citing it. Only you can say what a record is and whether anything was added after 2024.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C11", "kind": "Citation", "section": "3.2 Polygenic Risk Scores, paragraph 1", "summary": "Keep the PRS definition to what the cited paper says", "status": "proposed", "finding_ids": ["RC-9"], "before": "Polygenic risk scores (PRS) aggregate the effects of many common variants into a single weighted sum, providing a population-relative measure for a given trait (Lambert et al., 2021).", "after": "Polygenic risk scores (PRS) aggregate the effects of many genetic variants into a single weighted sum (Lambert et al., 2021); comparing that sum with a reference population's distribution places an individual within it.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Lambert et al. describe the variants as trait-associated, without restricting them to common ones, and say nothing about a population-relative measure, so the comparison with a reference population moves into its own uncited clause.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C12", "kind": "Claim correction", "section": "3.2 Polygenic Risk Scores, paragraph 2", "summary": "Say that the interface infers ancestry and lets users change it", "status": "proposed", "finding_ids": ["IC-9"], "before": "Users select the reference population closest to their ancestry, and the percentile reflects their position within that distribution.", "after": "The web interface infers the closest superpopulation when a VCF is loaded and preselects it as the reference population, which users can change; the percentile reflects their position within that distribution (Section 6.4).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Section 3.2.1 lists ancestry detection among the tools and the code infers the superpopulation when a file loads, while this sentence and Section 6.4 say users choose it themselves; the paper should say the same thing in all three places. Please confirm that this matches the version the paper describes.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C13", "kind": "Claim correction", "section": "3.2 Polygenic Risk Scores, paragraph 3", "summary": "Describe PLINK2's role without 'only'", "status": "proposed", "finding_ids": ["IC-27"], "before": "PLINK2 is used only as an external benchmark comparator to assess agreement with an established tool; it is not provided as a just-prs scoring engine.", "after": "PLINK2 is not a just-prs scoring engine; it served as the external benchmark comparator to assess agreement with an established tool, and just-prs also uses a PLINK2 binary for linkage-disequilibrium pruning when it builds its reference models.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The integrity check found that just-prs downloads a PLINK2 binary for pruning when it builds its reference models, so 'used only as an external benchmark comparator' is not quite true.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C14", "kind": "Claim correction", "section": "3.2 Polygenic Risk Scores, paragraph 4", "summary": "Give the restoration default for the library and for the web interface", "status": "proposed", "finding_ids": ["IC-8"], "before": "Restoration is off by default; it is not applied to gVCF inputs, and array restoration is restricted to eligible chip positions with matching reference data.", "after": "Restoration is off by default in the just-prs library but on by default for whole-genome samples in the Just-DNA-Lite web interface [AUTHORS: how a user switches it off there, and which setting the Figure 3 view and the Section 5.2 benchmark used]; it is not applied to gVCF inputs, and array restoration is restricted to eligible chip positions with matching reference data.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "In the web interface every sample starts as a whole-genome sample, and restoration is switched on for those, so platform users see restored scores unless they change the setting; the 50 to 54% match rates in Section 5.2 suggest the benchmark ran with it off, which only you can confirm.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C15", "kind": "Claim correction", "section": "3.2 Polygenic Risk Scores, paragraph 5", "summary": "Attribute the consumer-array workflow to just-prs", "status": "proposed", "finding_ids": ["IC-10"], "before": "The consumer-array workflow accepts formats such as 23andMe and AncestryDNA and uses precomputed linkage disequilibrium (LD) proxy tables to estimate untyped scoring variants from typed proxies where suitable tables are available.", "after": "The consumer-array workflow of the standalone just-prs library, which the Just-DNA-Lite upload does not yet offer, accepts formats such as 23andMe and AncestryDNA and uses precomputed linkage disequilibrium (LD) proxy tables to estimate untyped scoring variants from typed proxies where suitable tables are available.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The array parser and the proxy tables are in the just-prs library, while the Just-DNA-Lite upload accepts only .vcf and .vcf.gz files and tells users that chip files are not yet handled.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C16", "kind": "Clarity", "section": "3.2.1 Standalone PRS Use and MCP Access, heading", "summary": "Put subsection 3.2.1 one level below Section 3.2", "status": "proposed", "finding_ids": ["PE-1"], "before": "### **3.2.1 Standalone PRS Use and MCP Access**", "after": "#### **3.2.1 Standalone PRS Use and MCP Access**", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The subsection's heading has the same level as its parent, so a table of contents or a converted file would show 3.2.1 as a sibling of 3.2.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C17", "kind": "Claim correction", "section": "3.2.1 Standalone PRS Use and MCP Access, paragraph 2", "summary": "Name the MCP interface for the wider platform, or remove the sentence", "status": "proposed", "finding_ids": ["IC-13"], "before": "The platform also provides an MCP interface for calling Just-DNA-Lite's broader genome-analysis workflow programmatically.", "after": "The platform also provides an MCP interface, [AUTHORS: name the package and its repository, and add it to Table 7], for calling Just-DNA-Lite's broader genome-analysis workflow programmatically.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The integrity check found no such server in the repository or Table 7, and the project's workshop notes record it as unpublished. If it is not public when you submit, delete this sentence and the first clause of the next.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C18", "kind": "Claim correction", "section": "4. AI-Assisted Module Creation (platform feature), paragraph 1", "summary": "Say which external services module creation uses", "status": "proposed", "finding_ids": ["PF-8"], "before": "Just-DNA-Lite integrates an AI-assisted module-creation capability directly in the web interface, so that the platform can grow its own annotation content: a user can create a new module from within the app, without external tooling.", "after": "Just-DNA-Lite integrates an AI-assisted module-creation capability directly in the web interface, so that the platform can grow its own annotation content: a user can create a new module from within the app, without installing other software. Drafting relies on external services: it needs a Gemini API key (OpenAI and Anthropic keys are optional) and queries the hosted BioContext knowledge base, so the prompt and any attached documents leave the user's machine, although the module creator does not read the genome.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "'Without external tooling' can be read as 'without anything leaving the machine', while the project's README and documentation show that drafting needs a Gemini key and a hosted knowledge base. A matching sentence belongs in Section 6.2 (the policy check's item 8 lists the three external routes).", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C19", "kind": "Claim correction", "section": "5.1 Annotation Speed, paragraph 1", "summary": "Say which records the genome counts cover and which caller made the file", "status": "proposed", "finding_ids": ["RP.RC-10"], "before": "The input was a single whole-genome VCF containing 6,138,868 variant records (4,729,824 SNPs and 1,414,226 indels), produced by DeepVariant v1.4.0 against GRCh38 at ~162× mean coverage.", "after": "The input was a single whole-genome VCF containing 6,138,868 variant records [AUTHORS: say which records these are, for example all records in the file; the project's run report counts 6,079,744 rows read and 4,257,537 after the default PASS, depth and quality filters] (4,729,824 SNPs and 1,414,226 indels [AUTHORS: these add up to 6,144,050; say how multi-allelic records were counted, or correct the split]), produced by DeepVariant [AUTHORS: the version in the VCF header's ##DeepVariant_version line; the paper says v1.4.0, the project's run report 1.1.0] against GRCh38 at ~162× mean coverage [AUTHORS: sequencing platform].", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The paper gives four counts for one genome that do not reconcile, and the caller version differs from the project's own run report; only the VCF header and your records can settle them.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C20", "kind": "Claim correction", "section": "5.1 Annotation Speed, paragraph 1", "summary": "Say whose genome was benchmarked and what a reader can rerun", "status": "proposed", "finding_ids": ["PF-1", "IC-14"], "before": "This is the co-author genome released publicly on Zenodo (record 18370498, CC0) — the same genome used for the PRS benchmark in Section 5.2 — so the benchmark is fully reproducible end-to-end; the benchmark scripts are provided in the repository, and the pipeline can equally be run on any standard whole-genome VCF.", "after": "This is the first author's own genome, which he released publicly on Zenodo (record 18370498, CC0) [AUTHORS: confirm that you want him named; the record's title already names him] — the same genome used for the PRS benchmark in Section 5.2. The input is therefore public, and [AUTHORS: name the script and the per-run timing table behind Tables 2 and 3 once they are in the repository, or say that they will be archived with the release]; the pipeline can equally be run on any standard whole-genome VCF.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Read with the Contribution Statements, 'the co-author genome' points to Livia Zaharia, while the Zenodo record is titled 'Anton Kulaga genome'; and no file in the repository produces Tables 2 and 3, so 'fully reproducible end-to-end' outruns what a reader can do today.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C21", "kind": "Claim correction", "section": "5.1 Annotation Speed, Table 4", "summary": "Use the caller version from the VCF header in Table 4", "status": "proposed", "finding_ids": ["RP.RC-10"], "before": "| Variant caller | DeepVariant v1.4.0 |", "after": "| Variant caller | DeepVariant [AUTHORS: version from the VCF header] |", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Table 4 repeats the version that the project's run report contradicts; it should match whatever the caller-version slot in Section 5.1 settles (PE-C19).", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C22", "kind": "Claim correction", "section": "5.1 Annotation Speed, paragraph after Table 4", "summary": "Give the 172-fold ratio its conditions in Section 5.1", "status": "proposed", "finding_ids": ["IC-1", "RP.RC-12"], "before": "The approximately 172-fold speedup is the ratio of the reported mean Generation I runtime to the mean warm-run Just-DNA-Lite runtime.", "after": "The approximately 172-fold speedup is the ratio of the mean of the three Generation I runtimes, recorded in 2023 (Supplementary S2), to the mean warm-run Just-DNA-Lite runtime; against the cold-start mean the ratio is about 33-fold (Table 2). [AUTHORS: define warm and cold-start runs by what was already downloaded or cached before each run, list the timed stages, the modules and whether Ensembl annotation was on, and give the OakVar version, annotators and operating system of the 2023 runs.]", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The paper never says what a warm run is or what either system did inside the timed interval, and Table 4's Linux 6.8.0 was released in 2024, after the 2023 OakVar runs, so the two arms did not share a software environment.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C23", "kind": "Claim correction", "section": "5.1 Annotation Speed, paragraph after Table 4", "summary": "Describe the memory figure as what the tracker measures", "status": "proposed", "finding_ids": ["IC-2"], "before": "Reported peak memory remained below 750 MB for the runs in Table 3.", "after": "[AUTHORS: either re-measure with the operating system's maximum resident set size, including child processes, and keep this sentence with the new values, or use the following.] Resident memory measured at the start and end of each pipeline step remained below 750 MB for the runs in Table 3; memory allocated and released within a step is not captured by this measurement.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The project's resource tracker reads memory once before and once after each step and reports the larger reading, so it can miss the peak of a join. If you relabel, Table 3's 'Peak RAM (MB)' column needs the same wording.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C24", "kind": "Claim correction", "section": "5.2 PRS Computation, paragraph 1", "summary": "Tie the PRS benchmark's variant count to the genome in Section 5.1", "status": "proposed", "finding_ids": ["RP.RC-10"], "before": "We benchmarked just-prs's DuckDB and Polars engines against the external tool PLINK2 on 100 PGS Catalog scores using a personal whole-genome VCF (4,661,444 biallelic variants, GRCh38; Zenodo 18370498).", "after": "We benchmarked just-prs's DuckDB and Polars engines against the external tool PLINK2 on 100 PGS Catalog scores using the same whole-genome VCF as in Section 5.1 (4,661,444 biallelic variants [AUTHORS: how this count follows from the 6,138,868 records in Section 5.1, for example after removing multi-allelic records and applying which filters], GRCh38; Zenodo 18370498).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Readers met 6,138,868 records in Section 5.1 and 4,661,444 variants here for the same file, with nothing linking the two.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C25", "kind": "Clarity", "section": "5.2 PRS Computation, paragraph 1", "summary": "Correct the script path and name the version that produced the tables", "status": "proposed", "finding_ids": ["RP.RC-9"], "before": "The benchmark script is `benchmarks/benchmark_engines.py` in the just-prs repository.", "after": "The benchmark script is `just-prs/benchmarks/benchmark_engines.py` in the just-prs repository, at [AUTHORS: the commit or tag that produced Tables 5 and 6; the script was changed in May 2026, after the reported run].", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The repository has no benchmarks folder at its root, and the script changed after the March run, so the path alone does not lead to the configuration the tables report.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C26", "kind": "Claim correction", "section": "6.4 Limitations, 'Ancestry selection'", "summary": "Describe the ancestry inference the interface performs", "status": "proposed", "finding_ids": ["IC-9"], "before": "**Ancestry selection.** Automatic ancestry inference from the VCF is not yet implemented; users select the closest reference superpopulation.", "after": "**Ancestry selection.** The web interface infers the closest 1000 Genomes superpopulation when a VCF is loaded, by projecting the genome onto reference principal components and classifying it among its 20 nearest reference neighbours, and returns an unknown call when fewer than 20% of the model's sites are present; the inferred superpopulation sets the default percentile panel, which users can override.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The integrity check found the inference in the web interface and the method in just-prs 0.10.0, which contradicts this sentence and agrees with Section 3.2.1. Please confirm the method details against the version you describe.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C27", "kind": "Claim correction", "section": "6.4 Limitations, 'Input format'", "summary": "Attribute liftover and chip support to the component that has them", "status": "proposed", "finding_ids": ["IC-10"], "before": "**Input format.** The platform supports WGS and WES VCFs; GRCh38 is the primary build, with GRCh37/hg19 handled via liftover; consumer microarray data is supported experimentally (with far lower coverage, which the platform surfaces to users); T2T references are not yet supported.", "after": "**Input format.** Just-DNA-Lite currently accepts GRCh38 WGS and WES VCFs. The standalone just-prs library can lift GRCh37/hg19 coordinates to GRCh38 when installed with its optional liftover extra, and reads consumer microarray files experimentally, with far lower coverage; neither route is yet available in the Just-DNA-Lite upload. T2T references are not yet supported.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The annotation pipeline has no liftover, the liftover in just-prs sits behind an optional extra that the platform does not install, and the upload accepts only VCF files, so the platform-level wording promises more than a user can do.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C28", "kind": "Claim correction", "section": "6.5 Future Directions, first sentence", "summary": "Make the future-work list agree with Section 6.4", "status": "proposed", "finding_ids": ["IC-10"], "before": "Several extensions are underway or planned: GRCh37/hg19 liftover (added), experimental consumer-microarray support, and eventual T2T reference support.", "after": "Several extensions are underway or planned: bringing the GRCh37/hg19 liftover and experimental consumer-microarray support of the just-prs library into the Just-DNA-Lite upload [AUTHORS: confirm that this is planned], and eventual T2T reference support.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The sentence lists as planned what Section 6.4 says exists, and marks liftover as added, while the code has both only in just-prs.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C29", "kind": "Claim correction", "section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome, paragraph 1", "summary": "State the legal hooks of the rights argument accurately", "status": "proposed", "finding_ids": ["PF-6"], "before": "Just-DNA-Lite is built on a simple conviction: people have the right to read and explore their own genomic data, and researchers have the right to work with public genomes without a gatekeeper's permission. The GDPR's right of access (Article 15) already entitles individuals to obtain a copy of their personal data, and the emerging European Health Data Space is designed to give people access to and control over their own health information. A tool that runs locally and shows you everything in your own genome is, in this light, an instrument of an existing right.", "after": "Just-DNA-Lite is built on a simple conviction: people should be able to read and explore their own genomic data, and researchers should be able to work with genomes that their owners have deliberately made public, under the terms those owners chose. The law already recognises part of this. The GDPR's right of access (Article 15) entitles individuals to a copy of the personal data a controller holds about them, which can include sequencing data held by a provider, and the European Health Data Space Regulation (EU) 2025/327 adds rights of access to electronic health records from 2029. A tool that runs locally lets people use the data they obtain in this way without handing it to another service.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The policy check found three statements that go further than the law: public genomes come with their owners' terms, the European Health Data Space is now a regulation whose access right covers healthcare records, and the right of access is a claim on a controller, which a local tool helps people use once they hold the copy. This is the policy check's own wording, unchanged.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C30", "kind": "Claim correction", "section": "1. Introduction, paragraph 4", "summary": "Describe what the GDPR does instead of 'seek to avoid'", "status": "proposed", "finding_ids": ["PF-7"], "before": "Furthermore, privacy is a first-order concern: genomic data is among the most sensitive personal information, and uploading it to third-party servers introduces risks that many individuals and regulatory frameworks (such as the GDPR and the European Health Data Space) seek to avoid.", "after": "Furthermore, privacy is a first-order concern: genomic data is among the most sensitive personal information, which the EU General Data Protection Regulation treats as a special category (Article 9), and uploading it to third-party servers introduces risks that many individuals seek to avoid.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The GDPR regulates how genetic data are processed rather than avoiding uploads, and the European Health Data Space largely opens health data for secondary use. The policy check's own replacement cites Alteri et al. (2024), which the reference check could not find in any registry, so this version leaves the breach out.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C31", "kind": "Claim correction", "section": "Contribution Statements", "summary": "Say what Livia Zaharia's genome was used for", "status": "proposed", "finding_ids": ["PF-1"], "before": "**Zaharia Livia** — beta-testing, provided her whole genome for testing and benchmarking", "after": "**Zaharia Livia** — beta-testing, provided her whole genome (Zenodo record 19487816) for testing [AUTHORS: keep \"and benchmarking\" only if her genome was used for a reported result, and then name it in Section 5]", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Her genome is a separate Zenodo record that no reported result names, so 'benchmarking' suggests she provided the benchmark genome.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C32", "kind": "Citation", "section": "Bibliography", "summary": "Replace the Whitley et al. (2020) entry with the paper that exists", "status": "proposed", "finding_ids": ["IC-16"], "before": "Whitley, K. V., et al. (2020). Direct-to-consumer genetic testing: an updated systematic review. *European Journal of Human Genetics*, 28(8), 1063–1074.", "after": "Whitley, K. V., Tueller, J. A., & Weber, K. S. (2020). Genomics education in the era of personal genomics: academic, professional, and public considerations. *International Journal of Molecular Sciences*, 21(3), 768. https://doi.org/10.3390/ijms21030768", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "No article with this title, journal and pages exists; the entry merges three real papers, and of them only Whitley, Tueller and Weber (2020) carries the sentence it is cited for. Some journals open an integrity inquiry over a single reference that matches no record.", "skill": "manuscript-prose-edit"}]}, {"id": "PE-C33", "kind": "Citation", "section": "Bibliography, after the Manrai et al. (2016) entry", "summary": "Add the cost fact sheet that the new opening sentence cites", "status": "proposed", "finding_ids": ["RC-4"], "before": null, "after": "National Human Genome Research Institute. [AUTHORS: the fact sheet's title and year as shown on the page.] https://www.genome.gov/about-genomics/fact-sheets/Sequencing-Human-Genome-cost (accessed [AUTHORS: date]).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "The reference check read this fact sheet for the $500 million to $1 billion estimate; its exact title and date should be copied from the page when you add it.", "skill": "manuscript-prose-edit"}]}, {"id": "ST-C1", "kind": "Story edit", "section": "1. Introduction, paragraph 1", "summary": "Open the Introduction with the reader's problem; the sequencing-cost background follows it", "status": "proposed", "finding_ids": ["ST-2", "ST-8"], "before": "Whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003, and several companies now offer direct-to-consumer sequencing services (Whitley et al., 2020). Yet the gap between sequencing accessibility and variant annotation remains wide. Researchers and individuals receive raw variant files (VCFs) containing millions of variants but lack accessible tools to annotate them against published databases without specialized bioinformatics expertise.", "after": "Researchers and individuals receive raw variant files (Variant Call Format, VCF) containing millions of variants but lack accessible tools to annotate them against published databases without specialized bioinformatics expertise. This gap between sequencing accessibility and variant annotation remains wide even though whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003, and several companies now offer direct-to-consumer sequencing services (Whitley et al., 2020).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Open the Introduction with the reader's problem; the sequencing-cost background follows it", "skill": "manuscript-story"}]}, {"id": "ST-C2", "kind": "Story edit", "section": "Abstract, paragraph 1", "summary": "Add the obstacle sentence (the 'but') between the need and 'We present', from Introduction paragraph 2", "status": "proposed", "finding_ids": ["ST-3"], "before": "Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data.", "after": "Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data. Commercial reports typically do not let users verify which variants contributed to a score, and research-grade annotation tools demand command-line proficiency.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Add the obstacle sentence (the 'but') between the need and 'We present', from Introduction paragraph 2", "skill": "manuscript-story"}]}, {"id": "ST-C3", "kind": "Story edit", "section": "1. Introduction, paragraph 2 (last sentence)", "summary": "Replace the 'no open-source platform' sentence with the closest open-source neighbours, named and cited (a claim change: the authors decide)", "status": "proposed", "finding_ids": ["IC-26", "IC-5"], "before": "There is no open-source platform that combines comprehensive variant annotation with ease of use, transparency, and extensibility.", "after": "The closest open-source platforms sit between these extremes. OpenCRAVAT (Pagel et al., 2020) offers an open, modular resource catalogue with command-line and graphical interfaces, and our first generation ran on its fork OakVar, whose annotators are Python plugins. For polygenic scores, the PGS Catalog Calculator, pgsc_calc (Lambert et al., 2024), is a portable pipeline that includes genetic ancestry estimation, and Impute.me (Folkersen et al., 2020) computes scores for consumer genotype data that users upload to its website.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Replace the 'no open-source platform' sentence with the closest open-source neighbours, named and cited (a claim change: the authors decide)", "skill": "manuscript-story"}]}, {"id": "ST-C4", "kind": "Story edit", "section": "1. Introduction, paragraph 5", "summary": "Take the four build-tool names out of the Introduction; Section 2.1 already names each of them", "status": "proposed", "finding_ids": ["ST-6"], "before": "Just-DNA-Lite removes the OakVar dependency entirely and replaces it with our own standalone annotation engine, built with Dagster for workflow orchestration, polars-bio for VCF reading, Polars for columnar processing, and DuckDB for out-of-core joins.", "after": "Just-DNA-Lite removes the OakVar dependency entirely and replaces it with our own standalone annotation engine (Section 2.1).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Take the four build-tool names out of the Introduction; Section 2.1 already names each of them", "skill": "manuscript-story"}]}, {"id": "ST-C5", "kind": "Story edit", "section": "2. Platform Architecture, paragraph 2, moved to Code Availability", "summary": "Move the package and start-up paragraph from the opening of Section 2 to Code Availability, under an 'Installation and requirements' lead-in", "status": "proposed", "finding_ids": ["ST-6", "ST-24"], "before": "Just-DNA-Lite is structured as a uv workspace containing two Python packages: just-dna-pipelines (Dagster assets, VCF processing, annotation logic, and CLI tools) and webui (a Reflex-based web interface). The platform requires Python 3.13+; from a configured checkout, `uv run serve` starts the application. Core annotation and scoring execute on the host machine.", "after": "**Installation and requirements.** Just-DNA-Lite is structured as a uv workspace containing two Python packages: just-dna-pipelines (Dagster assets, VCF processing, annotation logic, and CLI tools) and webui (a Reflex-based web interface). The platform requires Python 3.13+; from a configured checkout, `uv run serve` starts the application. Core annotation and scoring execute on the host machine.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Move the package and start-up paragraph from the opening of Section 2 to Code Availability, under an 'Installation and requirements' lead-in", "skill": "manuscript-story"}]}, {"id": "ST-C6", "kind": "Story edit", "section": "2.1 Annotation Pipeline, step 1", "summary": "Drop 'annotated' from the description of the input file, which readers took to mean the tool's job was already done", "status": "proposed", "finding_ids": ["ST-8"], "before": "This is the annotated variant file users typically already have", "after": "This is the variant file users typically already have", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Drop 'annotated' from the description of the input file, which readers took to mean the tool's job was already done", "skill": "manuscript-story"}]}, {"id": "ST-C7", "kind": "Story edit", "section": "2.2 heading", "summary": "Make the heading agree with the section's first sentence, the phrase a reader remembered", "status": "proposed", "finding_ids": ["IC-29"], "before": "### **2.2 Modular Plugin System**", "after": "### **2.2 Annotation Modules as Data**", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Make the heading agree with the section's first sentence, the phrase a reader remembered", "skill": "manuscript-story"}]}, {"id": "ST-C8", "kind": "Story edit", "section": "2.2 Annotation modules, paragraph 2", "summary": "Say what the manifest does for a reader before naming the library that defines it", "status": "proposed", "finding_ids": ["ST-6", "ST-8"], "before": "The `just-dna-format` library defines the authored specification and the manifest, integrity, and versioning contract for compiled artifacts.", "after": "A compiled module can carry a manifest that records its identity and integrity, so a download can be checked against the recorded artifact; the `just-dna-format` library defines this manifest, its versioning contract and the authored specification.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Say what the manifest does for a reader before naming the library that defines it", "skill": "manuscript-story"}]}, {"id": "ST-C9", "kind": "Story edit", "section": "2.4 Performance Characteristics", "summary": "Replace the never-introduced 'runs on a laptop' principle with the design aim and the measured numbers (narrows a claim: the authors decide)", "status": "proposed", "finding_ids": ["IC-2"], "before": "Consistent with the \"runs on a laptop\" principle, Just-DNA-Lite prioritizes memory efficiency over raw throughput: peak RAM stays low enough for a personal computer, and warm-run annotation of a whole genome completes in tens of seconds.", "after": "Consistent with the aim of running on a personal computer, Just-DNA-Lite prioritizes memory efficiency over raw throughput: in the reported runs, peak memory stayed below 750 MB, and warm-run annotation of a whole genome completed in tens of seconds on a workstation (Section 5.1).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Replace the never-introduced 'runs on a laptop' principle with the design aim and the measured numbers (narrows a claim: the authors decide)", "skill": "manuscript-story"}]}, {"id": "ST-C10", "kind": "Story edit", "section": "3.1 heading and first sentence", "summary": "Name the module as Table 1 does (Longevity Map) and give its report title, as the project's modules.yaml records them", "status": "proposed", "finding_ids": ["IC-29"], "before": "### **3.1 Longevity Variants Module (example)**\n\nThe Longevity Variants module illustrates how existing variant-trait association databases can be wrapped into the platform's no-code module format.", "after": "### **3.1 Longevity Map Module (example)**\n\nThe Longevity Map module (Table 1), whose report is titled Longevity Variants, illustrates how existing variant-trait association databases can be wrapped into the platform's no-code module format.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Name the module as Table 1 does (Longevity Map) and give its report title, as the project's modules.yaml records them", "skill": "manuscript-story"}]}, {"id": "ST-C11", "kind": "Story edit", "section": "3.2.1 Standalone PRS Use and MCP Access, last paragraph", "summary": "Drop the fifth list of interfaces; keep both caveats", "status": "proposed", "finding_ids": ["ST-20"], "before": "The web application, Python library, command line, standalone PRS interface, and MCP client share the scoring implementation. Equivalent inputs, engine selection, reference data, and settings are required for equivalent results; the engine benchmark in Section 5.2 does not independently test every interface or the accuracy of assistant-generated explanations.", "after": "All of these entry points, and the Just-DNA-Lite web application, share the scoring implementation; equivalent inputs, engine selection, reference data, and settings are required for equivalent results, and the engine benchmark in Section 5.2 does not independently test every interface or the accuracy of assistant-generated explanations.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Drop the fifth list of interfaces; keep both caveats", "skill": "manuscript-story"}]}, {"id": "ST-C12", "kind": "Story edit", "section": "5.1 Annotation Speed, first sentence", "summary": "Open the result with its finding and define a warm run (definition taken from the project's FAQ; the authors confirm)", "status": "proposed", "finding_ids": ["ST-10", "RP.RC-12"], "before": "We benchmarked Just-DNA-Lite against the Generation I OakVar-based system on the same hardware.", "after": "On one public whole-genome VCF, warm runs of Just-DNA-Lite averaged 38.9 seconds, against a mean of 6,705 seconds for the Generation I OakVar-based system on the same hardware (Table 2), and reported peak memory remained below 750 MB for the runs in Table 3. Warm runs reuse the local caches that the first run, the cold start, initialises.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Open the result with its finding and define a warm run (definition taken from the project's FAQ; the authors confirm)", "skill": "manuscript-story"}]}, {"id": "ST-C13", "kind": "Story edit", "section": "Table 2, first row", "summary": "Use one name for the 38.9-second runs: 'warm', as the Abstract and Section 2.4 do", "status": "proposed", "finding_ids": ["RP.RC-12"], "before": "| **Just-DNA-Lite (normal)** | 11 | **38.9 ± 3.3** | 10.9 | **~172×** |", "after": "| **Just-DNA-Lite (warm)** | 11 | **38.9 ± 3.3** | 10.9 | **~172×** |", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Use one name for the 38.9-second runs: 'warm', as the Abstract and Section 2.4 do", "skill": "manuscript-story"}]}, {"id": "ST-C14", "kind": "Story edit", "section": "Table 3, last row", "summary": "Use the same name in Table 3", "status": "proposed", "finding_ids": ["RP.RC-12"], "before": "| Normal (average) | 39 | 400–600 | — |", "after": "| Warm (average) | 39 | 400–600 | — |", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Use the same name in Table 3", "skill": "manuscript-story"}]}, {"id": "ST-C15", "kind": "Story edit", "section": "5.2 PRS Computation, first sentence", "summary": "Put the finding before the setup", "status": "proposed", "finding_ids": ["ST-10"], "before": "We benchmarked just-prs's DuckDB and Polars engines against the external tool PLINK2 on 100 PGS Catalog scores using a personal whole-genome VCF (4,661,444 biallelic variants, GRCh38; Zenodo 18370498).", "after": "On the same genome, both just-prs engines scored all 100 PGS Catalog scores, with median per-score runtimes 12.3 (DuckDB) and 5.7 (Polars) times faster than PLINK2, and their scores closely agreed with PLINK2's (Pearson r = 0.999859 across the 96 scores PLINK2 completed). We benchmarked just-prs's DuckDB and Polars engines against the external tool PLINK2 on 100 PGS Catalog scores using a personal whole-genome VCF (4,661,444 biallelic variants, GRCh38; Zenodo 18370498).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Put the finding before the setup", "skill": "manuscript-story"}]}, {"id": "ST-C16", "kind": "Story edit", "section": "5.2 PRS Computation, last paragraph, moved to 6.1", "summary": "Move the paragraph on annotation-module reliability from the end of the PRS benchmark to Limitations of Variant Annotation, unchanged", "status": "proposed", "finding_ids": ["ST-19"], "before": "Annotation reliability depends on both the source evidence and its representation in the module. Published associations do not by themselves validate extraction, allele orientation, genotype matching, or report wording. The present benchmarks measure runtime and score agreement; they do not constitute a systematic accuracy evaluation of the annotation modules.", "after": "Annotation reliability depends on both the source evidence and its representation in the module. Published associations do not by themselves validate extraction, allele orientation, genotype matching, or report wording. The present benchmarks measure runtime and score agreement; they do not constitute a systematic accuracy evaluation of the annotation modules.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Move the paragraph on annotation-module reliability from the end of the PRS benchmark to Limitations of Variant Annotation, unchanged", "skill": "manuscript-story"}]}, {"id": "ST-C17", "kind": "Story edit", "section": "6.5 Future Directions, first sentence", "summary": "Say what exists today as Section 6.4 does, and keep only T2T as planned", "status": "proposed", "finding_ids": ["IC-10"], "before": "Several extensions are underway or planned: GRCh37/hg19 liftover (added), experimental consumer-microarray support, and eventual T2T reference support.", "after": "GRCh37/hg19 liftover and experimental consumer-microarray support have been added (Section 6.4), and T2T reference support is planned.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Say what exists today as Section 6.4 does, and keep only T2T as planned", "skill": "manuscript-story"}]}, {"id": "ST-C18", "kind": "Story edit", "section": "7. Conclusion, last sentence", "summary": "End on what a reader can do; both caveat sentences stay as they are", "status": "proposed", "finding_ids": ["ST-21"], "before": "The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports.", "after": "The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports. The code, the benchmark scripts and the public benchmark genome are openly available, so readers can rerun these measurements and add annotation modules of their own.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "End on what a reader can do; both caveat sentences stay as they are", "skill": "manuscript-story"}]}, {"id": "ST-C19", "kind": "Story edit", "section": "Supplementary S2", "summary": "Align the supplement with Section 5.1, which says the comparison does not isolate each component's contribution (lowers a claim: the authors decide)", "status": "proposed", "finding_ids": ["IC-25"], "before": "The 172× speedup is attributable to Polars streaming joins against Parquet, elimination of the multi-step OakVar annotator pipeline, and DuckDB for large joins with predicate pushdown and column pruning.", "after": "The two systems differ in Polars streaming joins against Parquet, the elimination of the multi-step OakVar annotator pipeline, and DuckDB for large joins with predicate pushdown and column pruning; the benchmark does not isolate how much each contributes to the 172× speedup (Section 5.1).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Align the supplement with Section 5.1, which says the comparison does not isolate each component's contribution (lowers a claim: the authors decide)", "skill": "manuscript-story"}]}, {"id": "ST-C20", "kind": "Story edit", "section": "1. Introduction, paragraph 2", "summary": "Cite the three research tools the gap paragraph names (each identity-checked in PubMed)", "status": "proposed", "finding_ids": ["IC-26"], "before": "At the other end, research-grade tools like PLINK, ANNOVAR, and VEP are powerful but demand command-line proficiency and significant setup effort.", "after": "At the other end, research-grade tools like PLINK (Chang et al., 2015), ANNOVAR (Wang et al., 2010), and VEP (McLaren et al., 2016) are powerful but demand command-line proficiency and significant setup effort.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "Cite the three research tools the gap paragraph names (each identity-checked in PubMed)", "skill": "manuscript-story"}]}, {"id": "ST-C21", "kind": "Story edit", "section": "Bibliography", "summary": "Add the six references that ST-C3 and ST-C20 cite, in alphabetical order (each identit electing a specific module, users can browse their full variant table with sorting, filtering, and search; when Ensembl annotation is enabled, the table is cross-referenced against Ensembl for clinical significance labels, consequence types, and known phenotype associations.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "0005.md", "quote": "The interface provides file management (upload VCFs, select modules, launch annotation), module selection (browse modules, toggle Ensembl annotation), a results preview (sortable, filterable data grid", "skill": "manuscript-deslop"}]}, {"id": "deslop.C6", "kind": "Applied edit", "section": "2.4 Performance Characteristics", "summary": "A pair of em dashes around an aside; the section reference now leads and the aside follows a comma.", "status": "applied", "finding_ids": [], "before": "Detailed speed and memory benchmarks — including the comparison against the Generation I OakVar-based system — are presented in Section 5.1.", "after": "Section 5.1 presents the detailed speed and memory benchmarks, including the comparison against the Generation I OakVar-based system.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "0006.md", "quote": "Section 5.1 presents the detailed speed and memory benchmarks, including the comparison against the Generation I OakVar-based system.", "skill": "manuscript-deslop"}]}, {"id": "deslop.C7", "kind": "Applied edit", "section": "3. Annotation Modules and Polygenic Scoring, paragraph 1", "summary": "'represent' stood in for 'are'.", "status": "applied", "finding_ids": [], "before": "These modules represent the default set; the platform is designed so that users, researchers within the ROGEN consortium, and the broader community can easily add their own modules, either by hand or with AI assistance (Section 4).", "after": "These modules are the default set; the platform is designed so that users, researchers within the ROGEN consortium, and the broader community can e th as a component of Just-DNA-Lite and as an independent tool.", "after": "just-prs is both a component of Just-DNA-Lite and an independent tool.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "0010.md", "quote": "just-prs is both a component of Just-DNA-Lite and an independent tool.", "skill": "manuscript-deslop"}]}, {"id": "deslop.C11", "kind": "Applied edit", "section": "3.3 Additional Trait Annotation Modules", "summary": "Bold emphasis on three module names inside running text.", "status": "applied", "finding_ids": [], "before": "The platform includes several additional modules that annotate variants against published GWAS and meta-analysis databases: **cardiovascular-associated variants** (SNPs selected on meta-study p-values and cross-population replication), **lipid metabolism** (same evidence-based inclusion criteria), and **VO2 max and athletic performance** (exercise genomics literature).", "after": "The platform includes several additional modules that annotate variants against published GWAS and meta-analysis databases: cardiovascular-associated variants (SNPs selected on meta-study p-values and cross-population replication), lipid metabolism (same evidence-based inclusion criteria), and VO2 max and athletic performance (exercise genomics literature).", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "0011.md", "quote": "The platform includes several additional modules that annotate variants against published GWAS and meta-analysis databases: cardiovascular-associated variants (SNPs selected on meta-study p-values and", "skill": "manuscript-deslop"}]}, {"id": "deslop.C12", "kind": "Applied edit", "section": "4. AI-Assisted Module Creation (platform feature), paragraph 2", "summary": "Two cleft constructions ('what it emits is', 'is what the platform depends on'), an appositive 'X, not Y' and an em dash; the sentences now have plain subjects and verbs, and the contrast between contract and drafting method stays.", "stat -policy-fit", "leaves_open": "Whether an ethics or consent statement is required"}, {"skill": "manuscript-reporting-check", "check": "Generation I OakVar setup in Kulaga et al. 2024 (arXiv 2403.19087)", "why": "Not read", "leaves_open": "OakVar version and annotators behind the 2023 runs"}, {"skill": "manuscript-story", "check": "Accretion against an earlier version", "why": "The project holds no earlier version of this paper.", "leaves_open": "What revisions added or lost, and whether the lead theme drifted."}, {"skill": "manuscript-story", "check": "Exemplar comparison for story devices", "why": "Not done in this stage.", "leaves_open": "Devices from well-told papers of the same type."}, {"skill": "manuscript-story", "check": "Full reading of the neighbours", "why": "Only abstracts were read (PubMed, arXiv); OakVar has no journal paper that a quick search found.", "leaves_open": "Whether a neighbour's full text contradicts a claim in the paper."}, {"skill": "manuscript-story", "check": "Reference check of the six proposed citations", "why": "They were identity-checked in PubMed only.", "leaves_open": "Final metadata and style of the new bibliography entries."}, {"skill": "manuscript-story", "check": "Alteri et al. 2024 (The 23andMe data breach)", "why": "A quick PubMed lookup by journal, year, volume and page found no match.", "leaves_open": "Whether the entry is correct before it is used as a privacy stake."}, {"skill": "manuscript-story", "check": "Journal gate against a chosen venue", "why": "No journal is chosen and no ladder is recorded.", "leaves_open": "Word, figure and Abstract-format limits for the proposals."}, {"skill": "manuscript-story", "check": "Figures as images", "why": "The manuscript embeds no image files; readers saw captions only.", "leaves_open": "Whether the final figures show real output."}], "decisions": [{"id": "D1", "summary": "Which PRS benchmark run the paper reports: the March 2026 run in Tables 5 and 6, or the October 2026 rerun the just-prs repository now carries", "finding_ids": ["RP.RC-4", "IC-3", "IC-4"]}, {"id": "D2", "summary": "Narrow the 'no open-source platform' and 'no existing tool' sentences, or support them with a dated comparison", "finding_ids": ["IC-5", "PR-7"]}, {"id": "D3", "summary": "Rerun the Generation I comparison with the same modules and cache state, or call the 172-fold ratio indicative and lead with the cold-start ratio", "finding_ids": ["IC-1"]}, {"id": "D4", "summary": "Describe the clinical-type default modules and the absolute-risk display in the paper, or change what the software ships and shows", "finding_ids": ["IC-7", "IC-6"]}, {"id": "D5", "summary": "Name the benchmark genome's owner, and confirm whether Livia Zaharia's genome was used for any reported result", "finding_ids": ["PF-1"]}, {"id": "D6", "summary": "Request an ethics-committee determination now: one would satisfy all three target journals", "finding_ids": ["PF-13"]}, {"id": "D7", "summary": "Choose among Genes, Frontiers in Bioinformatics and BioData Mining; BioData Mining needs a measured comparison with related software", "finding_ids": ["JS-1"]}, {"id": "D8", "summary": "Re-measure memory by sampling, or relabel it as memory at step boundaries and soften the laptop claim", "finding_ids": ["IC-2"]}, {"id": "D9", "summary": "Choose between competing rewrites of the same sentences (PE-C4 or ST-C3, PE-C8 or ST-C9)", "finding_ids": ["IC-5", "IC-2"]}, {"id": "D10", "summary": "Keep the local-first direction, or lead with modules-as-data or longevity (the story stage's three options)", "finding_ids": ["ST-22"]}, {"id": "D11", "summary": "Keep the no-diagnosis disclaimer in all five places, or keep it where readers need it and cut the repeats", "finding_ids": ["DS-16"]}], "panel": {"recommendations": [{"seat": "software-methods", "venue": "genes", "recommendation": "major-revision", "reason": "Genes publishes bioinformatics tools without a software-advance test, so the scope fits. But the abstract's speed and agreement figures rest on undefined comparison conditions, the PRS matching and percentile methods are not described, and Genes' own requirement for software names and versions in Methods is not met. Most of this is fixable in text or by reanalysis of existing public data."}, {"seat": "software-methods", "venue": "frontiers-bioinformatics", "recommendation": "major-revision", "reason": "Technology and Code is the right article type, but Frontiers expects validation of the tool's outputs, and neither the annotation engine nor the percentiles are validated beyond runtime and an across-score correlation on one genome. The methods that determine the scores also need to be described and the code tied to an archived version."}, {"seat": "software-methods", "venue": "biodata-mining", "recommendation": "reject", "reason": "A BioData Mining Software article must show a significant advance over previously published software, usually by direct comparison. Here the only comparators are the authors' own predecessor, under undefined conditions, and one PLINK2 configuration, with no comparison against pgsc_calc, OpenCRAVAT/OakVar or Impute.me. The computational contribution is integration of established components, which this selective journal treats as routine. A resubmission with a direct, like-for-like comparison could be considered."}, {"seat": "skeptic", "venue": "genes", "recommendation": "major-revision", "reason": "The paper is in scope and the platform is usable, but the Abstract's three numbers need the workload, output-equivalence, harness and per-score agreement checks (or narrower wording), the percentile method must be stated, and the priority claim must be corrected."}, {"seat": "skeptic", "venue": "frontiers-bioinformatics", "recommendation": "major-revision", "reason": "The Technology and Code type fits, but validation is expected and the only validation offered is runtime plus a cross-score correlation on one genome; output equivalence with Generation I, per-score agreement (ideally across the 1000 Genomes individuals already scored) and a stated percentile method are needed."}, {"seat": "skeptic", "venue": "biodata-mining", "recommendation": "reject", "reason": "The software-article criterion is a significant advance over previously published software, usually shown by direct comparison; the comparisons here are with the authors' own legacy system and a per-call PLINK2 configuration, with no comparison to pgsc_calc or OpenCRAVAT, and the novelty claim is contradicted by prior work."}, {"seat": "champion", "venue": "genes", "recommendation": "major-revision", "reason": "The paper fits the journal's sequencing and bioinformatics scope as an Article, but before publication readers need evidence that individual scores and percentiles are correct (per-score agreement, the matching rules and the handling of absent loci against the reference) and a defined timing comparison."}, {"seat": "champion", "venue": "frontiers-bioinformatics", "recommendation": "major-revision", "reason": "Technology and Code suits this paper, which already gives examples of use and limitations; but the journal expects validation, and a correlation across scores on one genome does not yet validate individual scores, while the matching rules and the timed interval belong in the Method section."}, {"seat": "champion", "venue": "biodata-mining", "recommendation": "major-revision", "reason": "The Software article criterion asks for a significant advance shown by direct comparison; the only comparison with independent software is PLINK2, whose timing scope is undefined and whose agreement is measured across scores, and the closest related tool, pgsc_calc, is neither discussed nor compared."}], "reviewers": [{"seat": "software-methods", "summary": "The authors present Just-DNA-Lite, a locally run web platform that joins a personal VCF against declarative, data-only annotation modules, and just-prs, a library that applies PGS Catalog scores with DuckDB or Polars and reports percentiles against 1000 Genomes superpopulations. They support it with benchmarks on one public CC0 genome: warm-run annotation in 38.9 s against 6,705 s for their earlier OakVar-based system, and per-score PRS runtimes 12.3 and 5.7 times faster than PLINK2, with r = 0.999859 across 96 scores. The architecture is sensible, the benchmark genome is public and the paper is unusually candid about what its measurements do not show. The evidence does not yet hold for the headline comparisons, however: what was timed, and whether the compared runs did the same work, is not defined; the agreement statistic cannot show per-score correctness; the variant-matching and percentile methods that decide what users see are not described; the versions and archives needed to regenerate the tables are missing; and the software is not compared with tools that do the same tasks.", "isolation": "", "strengths": ["The benchmark input is a public, CC0, whole-genome VCF with a DOI, so another group can rerun both benchmarks on exactly the same data, which is unusual in personal-genomics software papers.", "The abstract states the limits of its own evidence instead of letting the runtime figures stand in for accuracy.", "The hardware is stated in full and the limits it places on the claims are said plainly.", "Warm and cold runs are reported separately with n, SEM and SD, so readers can see the first-run cost and the run-to-run variation.", "Two independently implemented engines reach the same result to machine precision, a useful internal consistency check of the arithmetic.", "PLINK2's failures on four scores are attributed to the benchmark configuration and not presented as a weakness of the comparator.", "The paper keeps artifact integrity separate from scientific validity, and declarative data-only modules make the content auditable and avoid running third-party code.", "The assumption behind reference-homozygote restoration is stated and the conservative choice is the default.", "The privacy boundary of the MCP interface is described accurately instead of being covered by the local-first framing."], "concerns": [{"id": "SM-1", "severity": "major", "location": "Section 5.1, Tables 2 and 4; Supplementary S2 (summary in the manuscript)", "concern": "The paper limits the 172-fold ratio to 'these configurations and this input' but never describes those configurations: the OakVar version, which modules or annotators and which Ensembl setting each system ran, what a warm or cold run has cached, and when and in which software environment each arm ran (the OakVar runs date from 2023, while Table 4 gives Linux 6.8.0, a kernel released in March 2024). The GVCF row also divides a run on a different input by the VCF-based OakVar mean. The ratio is therefore not shown to compare equal workloads.", "suggestion": "For both systems: software versions, the modules or annotators and options enabled, the timed stages, what a warm and a cold run have cached, and the date and operating system of each arm; the GVCF ratio dropped or labelled as a different input. A fresh Generation I run in the same environment would settle it; otherwise state that the OakVar arm is a 2023 record and give the cold-start ratio beside the warm one.", "route": "fixable-in-text", "placement": "methods", "cost": "text", "defence": "partly answered", "verdict": "confirmed", "verdict_evidence": "Confirmed in narrowed form: Section 5.1 limits the ratio to these configurations and this input and implies one input VCF for both arms, but the configurations, the cache state, the OakVar version and the environment of each arm are described nowhere (Section 5.1, Tables 2 to 4, Supplementary S2 summary), as the defence found. The integrity check of 22 October 2026 confirmed that Linux 6.8 was first released on 10 March 2024, after the 2023 OakVar runs, and found that the project's own full 12-module run on the same genome took 133 s, about 50-fold rather than 172-fold.", "finding_ids": ["IC-1"]}, {"id": "SM-2", "severity": "major", "location": "Section 5.2, Table 5; Abstract", "concern": "What each per-score time includes is not defined, so the engines may not be doing the same work. A PLINK2 call per score is a separate process that reads the genotypes again each time (the input format, VCF or pgen, is not stated), while the DuckDB and Polars engines probably run in-process on the already-normalised Parquet; whether genome conversion, scoring-file download and parsing, and process start-up are counted is not said. The PLINK2 version, command line, thread and memory settings are not given, and the hardware for Section 5.2 is not stated (Table 4 sits under Section 5.1). PLINK2 can also apply several score columns in one invocation, so timing it one score per process may not reflect how it would be used for 100 scores.", "suggestion": "A statement of the timing boundaries for each engine, the PLINK2 version and full command, threads, input format and the hardware; and the end-to-end wall-clock time to score all 100 PGS IDs with each tool including input preparation, with PLINK2 run in a batched configuration where its options allow. Otherwise narrow the claim to the per-call latency of in-process engines on pre-normalised input.", "route": "author-required", "placement": "", "cost": "reanalysis", "defence": "not answered", "verdict": "confirmed", "verdict_evidence": "Confirmed: the paper says only that Table 5 gives seconds per PGS ID and that the speedups are ratios of medians; the PLINK2 version, command, threads, input format, the timed interval and the machine for Section 5.2 are given nowhere, and the defence found no answer. The reporting check of 22 October 2026 found that the just-prs benchmark page records a different machine for this run (32 logical cores, 94 GB) and one PLINK2 process per score; the integrity check computed totals on the 96 common scores of 13.9 s for DuckDB and 19.8 s for Polars against 67.5 s for PLINK2.", "findi
