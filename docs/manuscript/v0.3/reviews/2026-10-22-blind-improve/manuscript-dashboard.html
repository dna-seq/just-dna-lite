st and References, in that order.", "action": "Use JA-C17, JA-C18 and JA-C19 if Genes is chosen.", "decision": false, "sources": [{"skill": "manuscript-journal-adapt", "id": "JA-16"}]}, {"id": "JA-17", "category": "Submission package", "section": "Funding", "summary": "Funding has a placeholder and no funder role or fee line", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt"], "evidence": [{"path": "report.md", "quote": "Only the order and MDPI's sentence form change, and the publication-cost line is added.", "skill": "manuscript-journal-adapt"}], "stage": "final", "quote": "A.K. and R.T. received funding through this project.", "detail": "The ROGEN acknowledgment text is still a placeholder; Genes asks for its sentence form, a publication-cost line and the funder's role, and BMC asks for the funder's role when it had one.", "action": "Use JA-C20 and JA-C21 once the facts are known.", "decision": false, "sources": [{"skill": "manuscript-journal-adapt", "id": "JA-17"}]}, {"id": "JA-21", "category": "Submission package", "section": "Cover letter and submission forms", "summary": "Cover letter statements, scope statement and preprint citation wait", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt"], "evidence": [{"path": "report.md", "quote": "After the bioRxiv preprint is posted, cite it in the Acknowledgements and the reference list for Frontiers, and give its DOI and licence at submission for BioData Mining.", "skill": "manuscript-journal-adapt"}], "stage": "final", "quote": null, "detail": "Genes requires two cover-letter statements, Frontiers a 200-word scope statement, Frontiers a preprint citation in the Acknowledgements and references, and BMC the preprint DOI at submission.", "action": "Prepare these at submission.", "decision": false, "sources": [{"skill": "manuscript-journal-adapt", "id": "JA-21"}]}, {"id": "JS-1", "category": "Journal fit", "section": "5.1 Annotation Speed and 5.2 PRS Computation", "summary": "No measured comparison with functionally similar software such as pgsc_calc, which software articles require", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-select", "manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "A run of the PGS Catalog Calculator on the same genome and the same 100 scores, and a feature comparison with OpenCRAVAT, VEP or ANNOVAR, would meet the BMC software criterion without new data.", "skill": "manuscript-journal-select"}, {"path": "report.md", "quote": "BioData Mining needs a measured comparison with related software.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "The paper claims no superiority over pgsc_calc, so the fair concern is positioning in the text; the measured comparison belongs to BioData Mining's criterion.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "We benchmarked Just-DNA-Lite against the Generation I OakVar-based system on the same hardware.", "detail": "The annotation benchmark compares the platform only with the authors' own earlier system and the scoring benchmark only with PLINK2, while BMC-family software articles (BioData Mining, BMC Bioinformatics, BMC Genomics, Genome Medicine) require 'a significant advance over previously published software (usually demonstrated by direct comparison with available related software)' and Genome Biology a side-by-side demonstration on the same dataset. The Introduction's claim that 'There is no open-source platform that combines comprehensive variant annotation with ease of use, transparency, and extensibility' rests on the same missing comparison. Sources read: https://link.springer.com/journal/13040/submission-guidelines/software-article (“Software articles should describe a tool likely to be of broad utility that represents a significant advance over previously published software (usually demonst”).", "action": "Run the PGS Catalog Calculator on the same genome and 100 scores beside DuckDB, Polars and PLINK2, and add a feature-comparison table against OpenCRAVAT, VEP or ANNOVAR and the commercial reports named in the Introduction.", "decision": true, "sources": [{"skill": "manuscript-journal-select", "id": "JS-1"}, {"skill": "manuscript-peer-review", "id": "PR-11"}]}, {"id": "JS-2", "category": "Journal fit", "section": "Draft banner (before the title block)", "summary": "Banner names the companion's anonymous venue and internal files; would leak into the preprint.", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "The companion is under anonymous review, so a public, named preprint that names its venue would let its reviewers identify its authors.", "skill": "manuscript-journal-select"}], "stage": "final", "quote": "(in review at EASRP 2026; `paper2-just-module-creator.md`)", "detail": "The preprint is the next step and must be public before the companion paper; a named preprint that states the companion is in review at EASRP 2026 lets that venue's reviewers identify the companion's authors, and the banner also points to an internal strategy file. EASRP's rules on preprints and self-citation could not be found.", "action": "Delete the banner before posting; cite the companion as a manuscript under review without naming the venue, and check EASRP's anonymity rules.", "decision": false, "sources": [{"skill": "manuscript-journal-select", "id": "JS-2"}]}, {"id": "JS-4", "category": "Journal fit", "section": "Back matter (Contribution Statements, Acknowledgments)", "summary": "No statement of AI use in preparing the manuscript; all venues ask for one.", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt", "manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "The paper has no statement on how AI tools were used in preparing the manuscript, and every venue on the ladder asks for one.", "skill": "manuscript-journal-select"}, {"path": "report.md", "quote": "One statement placed in a methods paragraph and in the Acknowledgments serves all three (JA-C8, JA-C9).", "skill": "manuscript-journal-adapt"}], "stage": "final", "quote": null, "detail": "AI tools were used in preparing the project; Genes wants the use in Materials and Methods and in the Acknowledgments in a set sentence, Frontiers in the Acknowledgements with name, version, model and source, and BioData Mining in Methods under the Springer Nature framework, which does not permit AI to write results or discussion independently. Which rule bites depends on what the tools did, which only the authors know.", "action": "Write one factual AI-use statement covering tool, version, model, purpose, what it affected and author checking, and place it where the chosen journal asks.", "decision": false, "sources": [{"skill": "manuscript-journal-select", "id": "JS-4"}, {"skill": "manuscript-journal-adapt", "id": "JA-7"}]}, {"id": "JS-5", "category": "Journal fit", "section": "Abstract", "summary": "The unstructured abstract fits none of the three journals' abstract formats", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt", "manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "The abstract is 240 words without headings; Genes asks for about 250 words under four headings, the BMC journals for at most 350 words under three.", "skill": "manuscript-journal-select"}, {"path": "report.md", "quote": "JA-C16 rearranges the Abstract's own sentences under the four headings, at 250 words with the headings.", "skill": "manuscript-journal-adapt"}, {"path": "report.md", "quote": "The four paragraphs are joined, with the abbreviation changes of JA-C14 and no other change.", "skill": "manuscript-journal-adapt"}, {"path": "report.md", "quote": "The back matter reuses the shared statements under BMC's headings.", "skill": "manuscript-journal-adapt"}], "stage": "journal", "quote": "Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data.", "detail": "Genes asks for about 250 words under Background/Objectives, Methods, Results and Conclusions, and BioData Mining and the other BMC journals for at most 350 words under Background, Results and Conclusions; the content can stay, the headings cannot be avoided.", "action": "Once the journal is chosen, add that journal's headings to the existing abstract without adding numbers.", "decision": false, "sources": [{"skill": "manuscript-journal-select", "id": "JS-5"}, {"skill": "manuscript-journal-adapt", "id": "JA-15"}, {"skill": "manuscript-journal-adapt", "id": "JA-18"}, {"skill": "manuscript-journal-adapt", "id": "JA-19"}]}, {"id": "JS-7", "category": "Journal fit", "section": "Author list", "summary": "No corresponding author is named, and the equal-contribution and co-supervision notes are unclear", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt", "manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "Naming a Rostock corresponding author makes the DEAL discount and the MDPI and Frontiers agreements available; a Romanian corresponding author pays the listed fee.", "skill": "manuscript-journal-select"}, {"path": "report.md", "quote": "The draft names none, and its asterisk marks the co-supervising authors (\"\\* Co-supervising authors.\").", "skill": "manuscript-journal-adapt"}, {"path": "report.md", "quote": "The co-supervisor mark moves from the asterisk to ‡ because Frontiers reserves the asterisk for the corresponding author.", "skill": "manuscript-journal-adapt"}], "stage": "journal", "quote": "The contribution of these authors is considered to be equal. \\* Co-supervising authors.", "detail": "A corresponding author at the University of Rostock gets 20% off BMC fees through Projekt DEAL, MDPI central invoicing through the institutional program, and possibly Frontiers' 2019 agreement; no agreement was found for the Romanian affiliations.", "action": "Name the corresponding author before submission, with the fee route in mind.", "decision": true, "sources": [{"skill": "manuscript-journal-select", "id": "JS-7"}, {"skill": "manuscript-journal-adapt", "id": "JA-2"}]}, {"id": "JS-8", "category": "Journal fit", "section": "Abstract and 5. Benchmarking and Validation", "summary": "Single-genome benchmark could draw Frontiers' validation rule for public-data computation.", "severity": "minor", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "It would move down if an editor applied the Frontiers validation rule to the single-genome benchmark; a cover letter that says the paper is a software paper with no biological claims answers that reading in advance.", "skill": "manuscript-journal-select"}], "stage": "journal", "quote": "These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals.", "detail": "Frontiers asks manuscripts 'primarily comprising solely of bioinformatics analyses, computational studies of public data' to include validation; a Technology and Code paper is not named in the rule, but an editor could apply it to a benchmark on one public genome.", "action": "If Frontiers in Bioinformatics is used, say in the cover letter that this is a software paper with no biological claims and that PLINK2 agreement is the computational check; more genomes would also help.", "decision": false, "sources": [{"skill": "manuscript-journal-select", "id": "JS-8"}]}, {"id": "JS-9", "category": "Journal fit", "section": "Whole manuscript", "summary": "Length exceeds Scientific Reports, PLOS Software and Bioinformatics Application Note limits only.", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "The paper's main text is about 4,600 words with 7 tables and 4 figures, so none of the three needs a cut.", "skill": "manuscript-journal-select"}], "stage": "journal", "quote": null, "detail": "About 4,600 main-text words and 11 display items fit the top three, but would need cuts for Scientific Reports (4,500 words, 8 display items), PLOS Computational Biology Software (under 3,500 words) and a Bioinformatics Application Note (about 2,600 words).", "action": "No change unless one of those journals is chosen.", "decision": false, "sources": [{"skill": "manuscript-journal-select", "id": "JS-9"}]}, {"id": "JS-10", "category": "Journal fit", "section": "Abstract", "summary": "Research-and-education framing conflicts with clinical-genomics journals' disease scope.", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-select"], "evidence": [{"path": "report.md", "quote": "The journals below position 7 each need a length cut, a clinical scope the paper disclaims, or a benchmark the paper does not yet have.", "skill": "manuscript-journal-select"}], "stage": "journal", "quote": "it does not provide diagnoses or establish clinical validity for the associations it reports.", "detail": "Genome Medicine publishes work 'to understand, diagnose and treat disease' and npj Genomic Medicine is a clinical genomic-medicine journal; the paper's accurate disclaimer makes them a poor fit, which is why they sit low on the ladder.", "action": "None for the recommended journals; keep the disclaimer.", "decision": false, "sources": [{"skill": "manuscript-journal-select", "id": "JS-10"}]}, {"id": "PR-2", "category": "Claims and evidence", "section": "5. Benchmarking and Validation", "summary": "No check that the new engine's annotations match Generation I or expected outputs.", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "Nothing shows that the new engine produces the same annotations as Generation I, or the expected output on a test set.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed: nothing in Section 5.1, Tables 2 to 4, the Supplementary S2 summary, Section 2.1 or Section 7 reports that the two systems produced the same annotations for the benchmark genome, and the disclaimer in Section 5.2 covers the scientific content of modules, not the engine; the defence found no answer.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "The present benchmarks measure runtime and score agreement; they do not constitute a systematic accuracy evaluation of the annotation modules.", "detail": "Nothing shows that Just-DNA-Lite returns the same annotations as Generation I on the benchmark genome, or the expected output on a test set, so faster is not shown to mean faster at the same task; the test suites are not described. Frontiers in Bioinformatics expects this validation (SK-2, SM-8, SM-13).", "action": "Report per-module agreement with Generation I on the benchmark genome (matched variants, genotype states, weights) and describe the test suites; or state that output equivalence was not checked.", "decision": true, "sources": [{"skill": "manuscript-peer-review", "id": "PR-2"}]}, {"id": "PR-5", "category": "Methods and reproducibility", "section": "3.2 Polygenic Risk Scores; 5.2 PRS Computation", "summary": "The variant-matching and missing-variant rules that decide every polygenic score are not described", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review", "manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "The rules that match scoring-file variants to the genome are not described, although they decide every score a user sees.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed in narrowed form: Section 3.2 states how absent loci are treated, which answers one item, and the only other description is that just-prs resolves variants by genomic position with allele-orientation handling (Section 5.2); the defence found no account of strand, palindromic, multiallelic, indel, build or chrX handling.", "skill": "manuscript-peer-review"}, {"path": "report.md", "quote": "These are what the PRS Reporting Standards ask of a paper that applies published scores, and each needs one sentence.", "skill": "manuscript-reporting-check"}, {"path": "prs-rs-audit.md", "quote": "| Handling of missing data | PRS-RS 2021 (missing-data) | partial |", "skill": "manuscript-reporting-check"}], "stage": "now", "quote": "just-prs resolves scoring variants by genomic position with allele-orientation handling", "detail": "Beyond absent loci, the paper does not describe strand flips, palindromic SNPs, multiallelic and indel records, the scoring-file build, chromosome X dosage or the quality tiers, although the matching difference is used to explain the disagreement with PLINK2 (SM-4, CH-2).", "action": "Add a Methods paragraph with the matching rules and, ideally, per-rule variant counts for the benchmark genome.", "decision": false, "sources": [{"skill": "manuscript-peer-review", "id": "PR-5"}, {"skill": "manuscript-reporting-check", "id": "RC-18"}]}, {"id": "PR-6", "category": "Methods and reproducibility", "section": "3.2 Polygenic Risk Scores", "summary": "How the percentile reference is built and matched to the user's variants is not described.", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "How the percentile reference is built, and whether it uses the same variants as the user's score, is not described.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed in narrowed form: the release (phase 3) is stated, match rates are shown to users and missingness is acknowledged in Section 5.2, which meets part of the concern, but the method is not given anywhere, as the defence found.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "just-prs uses precomputed percentile distributions derived from the 1000 Genomes Project phase 3 dataset, against five superpopulations (AFR, AMR, EAS, EUR, SAS)", "detail": "With about half of each score's variants matched and restoration off, a user's sum can omit loci the reference sums include, shifting the percentile; the build, sample counts and variant-set matching are not given. The integrity check found that the web interface turns restoration on for whole-genome samples, although Section 3.2 says it is off by default (SM-5, CH-3, SK-6).", "action": "Describe the reference method and correct the stated default; show percentiles with restoration off and on for the benchmark genome, or say percentiles are approximate when coverage is incomplete.", "decision": true, "sources": [{"skill": "manuscript-peer-review", "id": "PR-6"}]}, {"id": "PR-7", "category": "Claims and evidence", "section": "1. Introduction", "summary": "The paper is not positioned against pgsc_calc, OpenCRAVAT or impute.me.", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "The paper does not say how it differs from the open-source tools closest to it, pgsc_calc, OpenCRAVAT and impute.me.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed in narrowed form: the paper states and measures its change from the OakVar-based predecessor (Section 1, paragraph 5; Section 2.2), so the claim that it measures no comparable tool overstates, but no other open-source tool is cited or compared, as the defence found.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "This paper presents the standalone annotation engine, the reusable just-prs scoring library, the web interfaces, and MCP interfaces for calling these tools programmatically from AI assistants.", "detail": "The paper measures its change from Generation I but cites none of the closest open-source tools (pgsc_calc, https://doi.org/10.1038/s41588-024-01937-x; OpenCRAVAT, https://doi.org/10.1200/CCI.19.00132; impute.me, https://doi.org/10.3389/fgene.2020.00578), all resolved in this review. For Genes and Frontiers a feature table and a sentence on the difference suffice (SM-7, SK-9, CH-5).", "action": "Cite the three tools and add a short feature table and a sentence on what Just-DNA-Lite does that they do not.", "decision": false, "sources": [{"skill": "manuscript-peer-review", "id": "PR-7"}]}, {"id": "PR-8", "category": "Methods and reproducibility", "section": "3.1 Longevity Variants Module (example)", "summary": "The w_SNP weighting rule is not given, so the shipped weights cannot be audited.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "The rule that sets the SNP weight in the longevity module is not given, so the shipped weights cannot be audited.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed: w_genotype is fully specified in Section 3.1, but w_SNP is described only by the kinds of evidence it reflects, with no formula, decision table or range, and the paper does not say it is curator judgement, as the defence found; this sits against the Introduction's contrast with opaque commercial curation.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "is an integrative parameter reflecting the strength of statistical evidence for a variant-trait association", "detail": "Section 3.1 names the kinds of evidence w_SNP reflects but gives no formula, decision table or range, against the Introduction's contrast with opaque commercial curation (SK-12, CH-10).", "action": "Give the rubric in Section 3.1 or a supplement, or state that w_SNP is curator judgement with evidence recorded per variant.", "decision": false, "sources": [{"skill": "manuscript-peer-review", "id": "PR-8"}]}, {"id": "PR-10", "category": "Writing and clarity", "section": "1. Introduction", "summary": "Ease of use is presented as solved although the paper does not evaluate it.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "The Introduction presents ease of use as a problem the platform solves, although the paper does not evaluate it.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Downgraded to a wording point: the paper claims no usability result and concedes in Section 6.3 that user understanding is untested, as the defence found, so no claim rests on an evaluation it lacks; the Introduction's framing is what remains.", "skill": "manuscript-peer-review"}], "stage": "writing", "quote": "it must be easy to use (web interface, no bioinformatics training)", "detail": "The Introduction lists ease of use as a problem the platform solves; Section 6.3 concedes usability is untested, so only the framing remains (SK-13).", "action": "Call ease of use a design aim not evaluated here, or report what the workshops showed.", "decision": false, "sources": [{"skill": "manuscript-peer-review", "id": "PR-10"}]}, {"id": "PR-15", "category": "Methods and reproducibility", "section": "2.1 Annotation Pipeline; 3.1", "summary": "How homozygous-reference module rows are reported from variant-only VCFs is not stated.", "severity": "minor", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-peer-review"], "evidence": [{"path": "report.md", "quote": "Add per-module match counts for the benchmark, and answer Referee 3's remaining question about how homozygous-reference module rows are reported from a variant-only VCF (manuscript-integrity-check).", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "The question about wild-type module rows remains open: the defence notes that in the longevity module the reference genotype has a weight of 0 (Section 3.1), so displayed weights would not change there, but report completeness is not addressed, and the integrity check could not locate the validator's wild-type presence rule.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "Joins are performed by rsID (default) or genomic position.", "detail": "A variant-only VCF has no record at homozygous-reference sites and restoration is described only for just-prs, so report completeness for wild-type module rows is open; the integrity check could not locate the validator's wild-type presence rule (CH-9).", "action": "State how homozygous-reference genotypes are reported for module rows when the input is a variant-only VCF.", "decision": false, "sources": [{"skill": "manuscript-peer-review", "id": "PR-15"}]}, {"id": "PF-1", "category": "Ethics, privacy and scope", "section": "5.1 Annotation Speed; Contribution Statements", "summary": "The benchmark genome is the first author's, but the contribution statement implies Livia Zaharia's", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-policy-fit", "manuscript-reference-check", "manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "A reader who puts these together will conclude that the benchmark genome is Livia Zaharia's.", "skill": "manuscript-policy-fit"}, {"path": "modules.yaml", "quote": "label: \"Anton Kulaga\"", "skill": ""}, {"path": "report.md", "quote": "check that the two statements describe the genomes as the authors intend.", "skill": "manuscript-reference-check"}, {"path": "report.md", "quote": "If her genome was used in any reported benchmark (the gVCF run, for example), name its record; if not, adjust the contribution statement.", "skill": "manuscript-reporting-check"}, {"path": "zenodo-19487816.json", "quote": "Livia Zaharia genome", "skill": "manuscript-reporting-check"}, {"path": "report.md", "quote": "What to do: name the person in Section 5.1 and say what Livia Zaharia's genome was used for.", "skill": "manuscript-integrity-check"}], "stage": "now", "quote": "This is the co-author genome released publicly on Zenodo (record 18370498, CC0)", "detail": "Zenodo record 18370498 is 'Anton Kulaga genome', self-deposited by him under CC0; the only author described as providing a genome is Livia Zaharia, whose genome is a different record (19487816, CC BY 4.0). Readers will attach the wrong name to a public genome.", "action": "State in 5.1 that the input is the first author's own genome deposited on Zenodo (record 18370498); correct the contribution statement and say whether record 19487816 was used for any reported result.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-1"}, {"skill": "manuscript-reference-check", "id": "RC-18"}, {"skill": "manuscript-reporting-check", "id": "RC-19"}, {"skill": "manuscript-integrity-check", "id": "IC-31"}]}, {"id": "PF-6", "category": "Ethics, privacy and scope", "section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome", "summary": "Right-to-read argument overstates GDPR, EHDS and public-genome rights", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "Three parts go further than the law, and a referee from privacy or bioethics will read them as legal claims", "skill": "manuscript-policy-fit"}], "stage": "writing", "quote": "researchers have the right to work with public genomes without a gatekeeper's permission", "detail": "Public genomes carry their owners' terms and GDPR still governs research processing of identifiable genetic data (Art. 9(2)(e) lifts only the special-category ban); the EHDS is adopted law whose access right covers healthcare records from 2029; Art. 15 grants a copy, which a tool does not 'instrument'.", "action": "Replace the opening and closing sentences of 6.3 with the proposed wording that keeps the conviction and states the legal hooks accurately (claim correction, needs approval).", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-6"}]}, {"id": "PF-7", "category": "Ethics, privacy and scope", "section": "1. Introduction, fourth paragraph", "summary": "Introduction misdescribes GDPR and EHDS as frameworks avoiding uploads", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "The GDPR does not seek to avoid uploads.", "skill": "manuscript-policy-fit"}], "stage": "writing", "quote": "regulatory frameworks (such as the GDPR and the European Health Data Space) seek to avoid", "detail": "The GDPR regulates processing of genetic data as a special category; the EHDS largely enables secondary use of health data including genomic data. The sentence cites nothing although Alteri et al. (2024) is in the bibliography.", "action": "Replace with the proposed sentence on GDPR Article 9 and the 23andMe breach (Alteri et al., 2024); optionally note the Article 2(2)(c) personal-activity exemption.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-7"}]}, {"id": "PF-8", "category": "Ethics, privacy and scope", "section": "6.2 Local Processing and Data Privacy", "summary": "The paper does not say what the AI features send off the machine, or to which services", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-policy-fit", "manuscript-story"], "evidence": [{"path": "report.md", "quote": "The code shows three external routes.", "skill": "manuscript-policy-fit"}, {"path": "report_logic.py", "quote": "(\"ChatGPT\", \"https://chatgpt.com/?q=\"),", "skill": ""}, {"path": "report.md", "quote": "Section 6.2 covers AI explanations and MCP clients but not this route.", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "What leaves the machine when the AI features are used (ST-23), for the policy check to settle with you.", "skill": "manuscript-story"}], "stage": "writing", "quote": "Optional AI explanations and MCP clients require a separate assessment", "detail": "Reports carry 'AI explain' buttons that open ChatGPT, Claude, Perplexity or Grok with a prompt containing rsID, gene, genotype, ClinVar interpretation and drug response; the module creator sends prompts and attached documents to Gemini and optionally OpenAI and Anthropic. The paper never describes these.", "action": "Add one sentence per route to 6.2 naming what is sent and when.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-8"}, {"skill": "manuscript-integrity-check", "id": "IC-32"}, {"skill": "manuscript-story", "id": "ST-23"}]}, {"id": "PF-9", "category": "Text versus code", "section": "6.2 Local Processing and Data Privacy", "summary": "Local app and saved reports load an analytics script from the project server", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "The browser still fetches the script from the project's server whenever the app or a saved report is opened.", "skill": "manuscript-policy-fit"}, {"path": "analytics.py", "quote": "DEFAULT_UMAMI_SCRIPT_URL = \"https://lite.just-dna.life/stats/script.js\"", "skill": ""}, {"path": "longevity_report.html.j2", "quote": "opening this report sends nothing anywhere.", "skill": ""}], "stage": "writing", "quote": "Downloading reference data does not require uploading the user's genome.", "detail": "By default the interface and every saved HTML report load an Umami script from lite.just-dna.life (no genome data; events likely recorded only on the demo domain), and UI libraries come from a CDN; the report tells users 'opening this report sends nothing anywhere'. The paper's own claims hold.", "action": "Disable analytics outside the public demo and drop the tag from saved reports; add one sentence to 6.2 listing what a default install contacts.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-9"}]}, {"id": "PF-10", "category": "Writing and clarity", "section": "Abstract, last paragraph", "summary": "Sentence reads as if the AGPL restricted use to research and education", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-peer-review", "manuscript-policy-fit", "manuscript-story"], "evidence": [{"path": "report.md", "quote": "The AGPL does not restrict use to research and education, so the sentence can be read as stating a licence term that does not exist.", "skill": "manuscript-policy-fit"}, {"path": "report.md", "quote": "The phrase \"for research and education\" in the Abstract (ST-26): say whether it limits the licence.", "skill": "manuscript-story"}, {"path": "report.md", "quote": "The Abstract's licence sentence reads as a use restriction.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed: the only licences stated are AGPL v3 for Just-DNA-Lite and CC0 for the benchmark genome, Table 7 has no licence column and the terms of the redistributed data are not given, as the defence found.", "skill": "manuscript-peer-review"}], "stage": "writing", "quote": "Just-DNA-Lite is released under AGPL v3 for research and education", "detail": "The AGPL has no such restriction, so the sentence can be read as stating a licence term that does not exist.", "action": "Write 'is released under the AGPL v3 licence and is intended for research and education'.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-10"}, {"skill": "manuscript-story", "id": "ST-26"}, {"skill": "manuscript-peer-review", "id": "PR-21"}]}, {"id": "PF-11", "category": "Writing and clarity", "section": "Title", "summary": "'Risk' in the title suggests individual disease-risk estimates", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "The title stays your decision.", "skill": "manuscript-policy-fit"}], "stage": "writing", "quote": "a Local-First, Open-Source Platform for Personal Genome Annotation and Polygenic Risk Scoring", "detail": "Many scored traits are not diseases and the PGS Catalog itself uses 'polygenic score'; 'risk' is the most prominent word pointing toward a clinical reading.", "action": "Optional: use 'Polygenic Scoring' in the title and 'polygenic score' for the general case; the title is the authors' decision.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-11"}]}, {"id": "PF-12", "category": "Ethics, privacy and scope", "section": "Abstract; 7. Conclusion", "summary": "Keep intended-use wording; do not add a regulatory status claim", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "None of this is a defect in the manuscript, and a journal will not ask a software paper for a regulatory determination.", "skill": "manuscript-policy-fit"}], "stage": "writing", "quote": "The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports.", "detail": "Under IVDR, intended purpose is read from labels, instructions and promotional statements, and software giving predisposition or treatment-response information can qualify; the RUO exclusion and the commercial-activity test (SecvADN) are open questions for the software, not defects of the paper.", "action": "Keep the current wording, do not import 'not a medical device' or 'Research Use Only'; consider aligning the README; seek regulatory advice only if the company will offer reports from these modules.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-12"}]}, {"id": "PF-J1", "category": "Journal fit", "section": "5.2 PRS Computation", "summary": "Named public genome may conflict with venue identification rules", "severity": "info", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "Citing record 18370498 identifies the first author by name.", "skill": "manuscript-policy-fit"}], "stage": "journal", "quote": "using a personal whole-genome VCF (4,661,444 biallelic variants, GRCh38; Zenodo 18370498)", "detail": "The cited record's title names the first author; bioRxiv's FAQ declines articles with information that could identify an individual, with no self-release exception, and medRxiv and some journals have similar rules. This is a decision for the authors at venue choice.", "action": "When the venue is chosen, read its identification and consent-for-publication rules; naming the author or not is the authors' decision.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-J1"}]}, {"id": "PF-13", "category": "Reporting and availability", "section": "Declarations (none yet)", "summary": "No ethics, consent-for-publication or human-data statement for the benchmark genome", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt", "manuscript-journal-select", "manuscript-peer-review", "manuscript-policy-fit"], "evidence": [{"path": "report.md", "quote": "There is no ethics, consent or human-data statement yet; that is normal for a draft.", "skill": "manuscript-policy-fit"}, {"path": "report.md", "quote": "The sentence \"This is the co-author genome released publicly on Zenodo (record 18370498, CC0)\" needs the ethics and consent statements each journal asks for, even though the genome is public and its owner is a co-author.", "skill": "manuscript-journal-select"}, {"path": "report.md", "quote": "A consent, ethics and data availability statement for the benchmark genome is missing.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed in narrowed form: the source, record number and licence are stated in Section 5.1 and Table 4, as the defence found, but no consent, ethics or data availability statement exists, and these statements wait until the submission files are final.", "skill": "manuscript-peer-review"}, {"path": "report.md", "quote": "A written determination from an ethics committee meets all three.", "skill": "manuscript-journal-adapt"}, {"path": "report.md", "quote": "It is the one route that satisfies all three journals for the benchmark genome.", "skill": "manuscript-journal-adapt"}, {"path": "report.md", "quote": "The first author signing one of the publishers' consent forms himself settles it for all three (JA-C7, and JA-C19 for the Genes form).", "skill": "manuscript-journal-adapt"}], "stage": "journal", "quote": null, "detail": "Most journals ask for a statement on human data. The facts support a short one: one author's self-released CC0 genome, no other individuals, no recruitment, no intervention. Whether a committee statement is needed depends on the venue.", "action": "Use the drafted statement at submission; add a committee statement only if the chosen journal requires one.", "decision": true, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-13"}, {"skill": "manuscript-journal-select", "id": "JS-3"}, {"skill": "manuscript-peer-review", "id": "PR-22"}, {"skill": "manuscript-journal-adapt", "id": "JA-5"}, {"skill": "manuscript-journal-adapt", "id": "JA-6"}]}, {"id": "PF-14", "category": "Reporting and availability", "section": "Code Availability", "summary": "Data licences are missing; blanket dataset licences may not match the source terms", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-policy-fit", "manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "When the statement is finalised, give each dataset's licence (the benchmark genome CC0; each module's own licence; PGS Catalog and 1000 Genomes terms for the score and percentile files), and correct the dataset card so that it does not declare MIT over data released under other terms.", "skill": "manuscript-policy-fit"}, {"path": "report.md", "quote": "Check that one licence for the whole mirror is right, or describe each score's licence as inherited from its source.", "skill": "manuscript-reporting-check"}], "stage": "final", "quote": "Annotation modules and reference datasets are published to the just-dna-seq organization on HuggingFace", "detail": "The annotators dataset card declares MIT while the pharmacogenomics module declares CC-BY-SA-4.0 and the code records a bar on sale for ClinPGx content.", "action": "Give each dataset's licence in the availability statement and correct the dataset card.", "decision": false, "sources": [{"skill": "manuscript-policy-fit", "id": "PF-14"}, {"skill": "manuscript-reporting-check", "id": "RC-25"}]}, {"id": "PE-1", "category": "Writing and clarity", "section": "3.2.1 Standalone PRS Use and MCP Access", "summary": "Subsection 3.2.1 has the same heading level as Section 3.2", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-prose-edit"], "evidence": [{"path": "report.md", "quote": "The subsection's heading has the same level as its parent, so a table of contents or a converted file would show 3.2.1 as a sibling of 3.2.", "skill": "manuscript-prose-edit"}], "stage": "writing", "quote": "### **3.2.1 Standalone PRS Use and MCP Access**", "detail": "The subsection is written as a level-three heading, like its parent, so a table of contents or a converted file shows it beside Section 3.2 instead of under it.", "action": "Make the heading one level lower (PE-C16).", "decision": false, "sources": [{"skill": "manuscript-prose-edit", "id": "PE-1"}]}, {"id": "PE-2", "category": "Writing and clarity", "section": "Front matter; Contribution Statements", "summary": "One author is listed given name first; all others surname first", "severity": "info", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-prose-edit"], "evidence": [{"path": "report.md", "quote": "Ryangguk Kim is the only author listed given name first, both in the author list and in the Contribution Statements. The two places agree, so the order was left alone; change both if surname first is wanted.", "skill": "manuscript-prose-edit"}], "stage": "writing", "quote": "Ryangguk Kim^8^", "detail": "Ryangguk Kim appears given name first in both the author list and the Contribution Statements, while every other author is listed surname first. The two places agree, so it may be intended.", "action": "Confirm the order; change both places if surname first is wanted.", "decision": true, "sources": [{"skill": "manuscript-prose-edit", "id": "PE-2"}]}, {"id": "RC-3", "category": "References", "section": "Bibliography", "summary": "Uncited Forbes article by Doffman not found by any search.", "severity": "major", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "News items are often missing from indexes, so this is not proof that it was invented.", "skill": "manuscript-reference-check"}], "stage": "now", "quote": "Doffman, Z. (2023). 23andMe confirms 6.9 million user records stolen. *Forbes*.", "detail": "Forbes site search, web searches and the Internet Archive index of 143 archived Doffman Forbes pages from October-December 2023 show no such article. News items are often unindexed, so this is not proof of fabrication.", "action": "Delete the entry, or supply its URL.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-3"}]}, {"id": "RC-4", "category": "Claims and evidence", "section": "1. Introduction", "summary": "Opening cost claim of 'billions' is not what the cited or primary source says.", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "That supports \"under a thousand\" and the direct-to-consumer companies, not \"billions\".", "skill": "manuscript-reference-check"}, {"path": "nhgri_sequencing_cost_factsheet.txt", "quote": "should not be confused with the total cost of the HGP.", "skill": "manuscript-reference-check"}], "stage": "now", "quote": "Whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003", "detail": "Whitley et al. 2020 give $95,263,072 for the HGP genome and under $1000 today, citing NHGRI; the NHGRI fact sheet puts the first genome at $0.5-1 billion and says this should not be confused with the ~$2.7 billion total HGP cost. Only partly supported.", "action": "Rewrite as 'from an estimated $0.5-1 billion for the Human Genome Project's reference sequence ... to under $1,000 (NHGRI; Whitley et al., 2020)'.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-4"}]}, {"id": "RC-7", "category": "Claims and evidence", "section": "1. Introduction", "summary": "Sources say FOXO3 came from candidate-gene studies, not GWAS; consistency overstated.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "Candidate-gene studies first associated APOE and FOXO3 with longevity", "skill": "manuscript-reference-check"}, {"path": "broer2015_pmc4296168_excerpt.txt", "quote": "although this gene was not identified in GWAS", "skill": "manuscript-reference-check"}], "stage": "now", "quote": "GWAS studies have identified candidate loci including APOE and FOXO3 as consistently associated with longevity across populations (Broer et al., 2014; Caruso et al., 2022)", "detail": "Broer et al. say FOXO3 'was not identified in GWAS' and their meta-analysis was European-ancestry only; Caruso et al. say both genes came from case-control studies and FOXO3 replicates 'to less extent'. Only partly supported.", "action": "Use: 'Candidate-gene studies first associated APOE and FOXO3 with longevity, and they remain the only two genes replicated in multiple independent studies, including a genome-wide meta-analysis of European-ancestry cohorts (Broer et al., 2015; Caruso et al., 2022).'", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-7"}]}, {"id": "RC-8", "category": "Numbers and statistics", "section": "3.1 Longevity Variants Module", "summary": "LongevityMap counts 3,144 variants in 550 entries, not 3,144 associations.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "The numbers are right but the unit is not, so both sentences are only partly supported.", "skill": "manuscript-reference-check"}], "stage": "now", "quote": "which contains 3,144 variant-trait associations in 884 genes", "detail": "Tacutu et al. report 550 entries, 884 genes and 3144 variants, with only 275 entries significant and negative results included; the Introduction's 'thousands of variant-trait associations' has the same problem. The 876 'existing records' edited also needs its unit stated against 550 entries.", "action": "Write '3,144 variants in 884 genes from 550 study entries, 275 of them reporting a significant association (Tacutu et al., 2018)', and say what a curated 'record' is.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-8"}]}, {"id": "RC-9", "category": "Claims and evidence", "section": "3.2 Polygenic Risk Scores", "summary": "PGS Catalog paper supports aggregation and weighted sum, not 'common' or population-relative.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "They speak of \"trait-associated genetic variants\", not common ones, and say nothing about a population-relative measure.", "skill": "manuscript-reference-check"}], "stage": "now", "quote": "Polygenic risk scores (PRS) aggregate the effects of many common variants into a single weighted sum, providing a population-relative measure for a given trait (Lambert et al., 2021).", "detail": "Lambert et al. 2021 describe trait-associated variants combined by a weighted sum; they do not describe a population-relative measure. Low stakes, partly supported.", "action": "Drop 'common' and put the reference-population comparison in its own uncited clause.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-9"}]}, {"id": "RC-10", "category": "Claims and evidence", "section": "3.1 Longevity Variants Module", "summary": "LongevityMap curation numbers come from the 2024 Generation I paper, uncited and presented as new", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "Because this curation was already published in 2024, the sentence's \"Our contribution here\" presents earlier work as new", "skill": "manuscript-reference-check"}, {"path": "kulaga2024_arxiv_2403.19087.txt", "quote": "In particular, we edited 876", "skill": "manuscript-reference-check"}, {"path": "report.md", "quote": "The repository's copy, `data/modules/just_longevitymap/longevitymap.sqlite`, has 3,476 variant records and 886 gene rows, and neither it nor `data/longevity_map.tsv` (626 rows) contains a study published after 2015.", "skill": "manuscript-integrity-check"}], "stage": "now", "quote": "Our contribution here is not re-annotation or re-validation of these variants, but (1) curation and expansion with post-2017 literature, adding 50 new entries and editing 876 existing records", "detail": "Kulaga et al. 2024 already report editing 876 records and adding 50 entries, from meta-analyses published after 2017. Calling this 'Our contribution here' presents published work as new; the Generation I Monte Carlo percentile method in Section 3.2 is also uncited.", "action": "Cite Kulaga et al. 2024 for the curation and for the Generation I percentile method, say the module carries over that curation, and list separately anything added since.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-10"}, {"skill": "manuscript-integrity-check", "id": "IC-22"}]}, {"id": "RC-11", "category": "References", "section": "1. Introduction", "summary": "Borrowed 20-25% heritability figure has no citation.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "That is their summary of earlier twin studies, which the abstract does not name", "skill": "manuscript-reference-check"}], "stage": "writing", "quote": "traditional twin studies placed the heritability of lifespan at 20–25%", "detail": "Shenhar et al. 2026 state that twin studies show 20 to 25%, but as a summary of unnamed earlier studies.", "action": "Write 'as summarised by Shenhar et al.' or cite a primary twin study.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-11"}]}, {"id": "RC-12", "category": "Numbers and statistics", "section": "3.2 Polygenic Risk Scores", "summary": "Undated, uncited live count; the PGS Catalog now holds 6,991 scores.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "The PGS Catalog's own interface reports 6,991 scores in its release of 17 September 2026", "skill": "manuscript-reference-check"}, {"path": "pgscatalog_rest_info_2026-10-22.txt", "quote": "\"scores\":6991", "skill": "manuscript-reference-check"}], "stage": "writing", "quote": "just-prs provides access to all 5,000+ scoring files in the PGS Catalog.", "detail": "The PGS Catalog REST interface reports 6,991 scores in the 17 September 2026 release. Whether just-prs reaches every score was not checked.", "action": "Give the dated count and cite the PGS Catalog (e.g., Lambert et al. 2024, https://doi.org/10.1038/s41588-024-01937-x).", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-12"}]}, {"id": "RC-13", "category": "References", "section": "6.1 Limitations of Variant Annotation", "summary": "European-ancestry statement about PGS Catalog has no citation.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "lambert2021_pmc11165303_excerpt.txt", "quote": "Currently, most PGSs included in the Catalog were developed in European ancestry individuals", "skill": "manuscript-reference-check"}], "stage": "writing", "quote": "Most PGS Catalog scoring files were derived from predominantly European cohorts", "detail": "Lambert et al. 2021 carry it as of December 2020.", "action": "Cite Lambert et al. 2021 with its date, or a newer PGS Catalog source.", "decision": false, "sources": [{"skill": "manuscript-reference-check", "id": "RC-13"}]}, {"id": "RC-14", "category": "References", "section": "6.1 Limitations of Variant Annotation", "summary": "Winner's-curse statement has no citation.", "severity": "minor", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-reference-check"], "evidence": [{"path": "report.md", "quote": "One cand Variant 1.1.0, GRCh38", "skill": ""}, {"path": "report.md", "quote": "Section 5.1 gives \"6,138,868 variant records (4,729,824 SNPs and 1,414,226 indels)\" (line 162), but SNPs plus indels make 6,144,050, which is 5,182 more than the records (multi-allelic records counted in both classes would explain it).", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "Section 5.1 says \"produced by DeepVariant v1.4.0\" (line 162); the repository's run report on the same Zenodo file says \"DeepVariant 1.1.0\".", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "One clause on how the second count comes from the first would settle it (ST-17).", "skill": "manuscript-story"}], "stage": "now", "quote": "produced by DeepVariant v1.4.0 against GRCh38 at ~162× mean coverage", "detail": "The project's run report on the same file says DeepVariant 1.1.0, 6,079,744 rows read and 4,257,537 after filters; the paper gives 6,138,868 records, 4,661,444 'biallelic variants' in 5.2, and an SNP+indel split summing to 6,144,050; the sequencing platform is not named.", "action": "Check the caller in the VCF header, state which count is which and which filters each benchmark applied, reconcile the SNP/indel split, and name the platform.", "decision": false, "sources": [{"skill": "manuscript-reporting-check", "id": "RC-10"}, {"skill": "manuscript-integrity-check", "id": "IC-18"}, {"skill": "manuscript-integrity-check", "id": "IC-19"}, {"skill": "manuscript-story", "id": "ST-17"}]}, {"id": "RP.RC-11", "category": "Methods and reproducibility", "section": "5.1 Annotation Speed (Table 4) and 5.2", "summary": "The PRS benchmark machine, PLINK2 version and command are not given; Table 4 describes a different machine", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "The just-prs benchmark page of March 2026 gives 32 logical cores and 94 GB for the PRS run.", "skill": "manuscript-reporting-check"}, {"path": "just-prs-docs-benchmarks-at-3fe0845-2026-05-27.md", "quote": "| CPU | 32 logical cores |", "skill": "manuscript-reporting-check"}, {"path": "report.md", "quote": "The just-prs benchmark page gives all of them: 32 logical cores and 94 GB RAM (not the Table 4 machine), Python 3.13.5, PLINK2 v2.0 (20260110), `--score no-mean-imputation cols=scoresums` on an autosome-only pgen, and scores PGS000006 to PGS000106 with five warm-up IDs excluded.", "skill": "manuscript-integrity-check"}], "stage": "now", "quote": "| CPU | Intel Xeon E5-2667 v4 @ 3.20 GHz (8C/16T) |", "detail": "Table 4 is titled as the benchmark hardware, but the draft-date just-prs page gives 32 logical cores and 94 GB for the PRS run, not the 8C/16T, 128 GB machine.", "action": "Add the PRS machine, thread settings and load conditions, or retitle Table 4 for Section 5.1 and add a column for 5.2.", "decision": false, "sources": [{"skill": "manuscript-reporting-check", "id": "RC-11"}, {"skill": "manuscript-integrity-check", "id": "IC-23"}]}, {"id": "RP.RC-12", "category": "Numbers and statistics", "section": "5.1 Annotation Speed (Tables 2 and 3)", "summary": "Warm, normal and cold runs are undefined; Table 3 rows and the S2 ± are not labelled", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-reporting-check", "manuscript-story"], "evidence": [{"path": "report.md", "quote": "so define each run type by what was cleared before it.", "skill": "manuscript-reporting-check"}, {"path": "report.md", "quote": "What to do: label the single run and the range, and write \"± SEM\".", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "Writing \"mean ± SEM\" there, as Table 2 does, removes the doubt.", "skill": "manuscript-reporting-check"}, {"path": "report.md", "quote": "The Abstract reports \"warm-run annotation\" and Tables 2 and 3 label the s
