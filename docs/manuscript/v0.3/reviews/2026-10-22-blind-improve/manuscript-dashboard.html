op the speedup for this row or label it as a different input and a single run.", "decision": false, "sources": [{"skill": "manuscript-reporting-check", "id": "RC-17"}]}, {"id": "RP.RC-20", "category": "Text versus code", "section": "5.2 PRS Computation", "summary": "Repository README states r = 0.9999 across 100 PGS IDs; paper says 96.", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "Align the README with whichever run the paper reports (finding 4).", "skill": "manuscript-reporting-check"}, {"path": "README.md", "quote": "with Pearson r = 0.9999 concordance against PLINK2 across 100 PGS IDs on a 4.66M-variant WGS", "skill": ""}], "stage": "writing", "quote": "DuckDB ↔ PLINK2 | 96 | 0.999859 | 21.4", "detail": "The just-dna-lite README in the snapshot gives a different count of scores for the PLINK2 correlation than Table 6.", "action": "Align the README with whichever run the paper reports.", "decision": false, "sources": [{"skill": "manuscript-reporting-check", "id": "RC-20"}]}, {"id": "RP.RC-22", "category": "Journal fit", "section": "Abstract; Code Availability", "summary": "Software-paper requirements and availability-statement form await the journal choice.", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "No reporting guideline binds this paper, and no checklist is required until a journal is chosen.", "skill": "manuscript-reporting-check"}], "stage": "journal", "quote": null, "detail": "No reporting guideline binds this paper; venues that publish software papers often require the software location and licence in the Abstract, an archived release, install instructions and test data, and their own availability-statement wording.", "action": "After choosing the journal, check its software rules and rerun the availability check with that venue.", "decision": false, "sources": [{"skill": "manuscript-reporting-check", "id": "RC-22"}]}, {"id": "RP.RC-27", "category": "Reporting and availability", "section": "Code Availability (Table 7)", "summary": "just-dna-format link redirects to just-dna-compiler repository.", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "https://github.com/dna-seq/just-dna-format now redirects to https://github.com/dna-seq/just-dna-compiler.", "skill": "manuscript-reporting-check"}, {"path": "availability.md", "quote": "public repository (now dna-seq/just-dna-compiler)", "skill": "manuscript-reporting-check"}], "stage": "final", "quote": "| [just-dna-format](https://github.com/dna-seq/just-dna-format) | Annotation module schema, manifest/integrity contract, and reference compiler | Gen II |", "detail": "https://github.com/dna-seq/just-dna-format now redirects to https://github.com/dna-seq/just-dna-compiler, while Section 2.2 names the two as separate libraries.", "action": "Update Table 7's link and description.", "decision": false, "sources": [{"skill": "manuscript-reporting-check", "id": "RC-27"}]}, {"id": "ST-2", "category": "Story and structure", "section": "1. Introduction, paragraph 1", "summary": "The Introduction opens on sequencing costs; the reader's problem comes third", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "Proposal ST-C1 puts the problem first; moving privacy into the opening is part of option A in section 11, because it reorders the themes (ST-2).", "skill": "manuscript-story"}], "stage": "writing", "quote": "Whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003", "detail": "The first sentence is field background a reader does not need for the next one; the problem a reader has is the third sentence and the privacy stake behind the title waits until paragraph 4.", "action": "Open with the reader's problem and follow with the cost background (ST-C1).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-2"}]}, {"id": "ST-3", "category": "Story and structure", "section": "Abstract, paragraph 1", "summary": "The Abstract moves from what is needed straight to 'We present'", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "The obstacle is stated in the Introduction (\"Existing solutions occupy two extremes.\") and missing from the Abstract.", "skill": "manuscript-story"}], "stage": "writing", "quote": "Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data.", "detail": "The obstacle that makes the platform necessary is stated in the Introduction and missing from the Abstract, so its first sentences read as need then solution with no 'but'.", "action": "Add one obstacle sentence drawn from Introduction paragraph 2 (ST-C2).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-3"}]}, {"id": "ST-6", "category": "Story and structure", "section": "1. Introduction paragraph 5 to 2.2", "summary": "All three readers lost attention where the text turns to build tools and packages", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "All three readers stopped within the same stretch, from the end of the Introduction to Section 2.2, where the paper turns from what the tool does for a genome to build tools, package names and the packaging contract (ST-6).", "skill": "manuscript-story"}], "stage": "writing", "quote": "Just-DNA-Lite is structured as a uv workspace containing two Python packages", "detail": "The ageing biologist stopped at the Introduction's list of libraries, the skimmer at the uv workspace paragraph and the potential user at the just-dna-format contract; each came back only at something concrete. This is reader feedback from simulated readers.", "action": "Move build and package detail after what the tool does (ST-C4, ST-C5, ST-C8).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-6"}]}, {"id": "ST-8", "category": "Writing and clarity", "section": "Abstract to 6.4", "summary": "Readers stopped at undefined terms and code names", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt", "manuscript-story"], "evidence": [{"path": "report.md", "quote": "Readers stopped at these terms (ST-8).", "skill": "manuscript-story"}, {"path": "report.md", "quote": "Nine passages use an abbreviation before it is defined, among them GWAS, MCP and SNP in the main text and VCF and AI in the Abstract.", "skill": "manuscript-journal-adapt"}], "stage": "writing", "quote": "The `just-dna-format` library defines the authored specification and the manifest, integrity, and versioning contract for compiled artifacts.", "detail": "The readers listed terms they could not follow, from the Abstract's 'shared module contract' to 'quality tiers', the score scale and T2T; the report gathers them in one table with where each occurs.", "action": "Define each term at first use or keep it out of the Abstract (report section 5).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-8"}, {"skill": "manuscript-journal-adapt", "id": "JA-13"}]}, {"id": "ST-10", "category": "Story and structure", "section": "5.1 and 5.2", "summary": "Both results sections open with setup instead of the finding", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "the findings come later, in the tables and the paragraphs after them (ST-10).", "skill": "manuscript-story"}], "stage": "writing", "quote": "We benchmarked Just-DNA-Lite against the Generation I OakVar-based system on the same hardware.", "detail": "5.1 and 5.2 begin with what was benchmarked; the numbers a reader keeps come in the tables and later paragraphs.", "action": "Open each section with its finding and the number to keep (ST-C12, ST-C15).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-10"}]}, {"id": "ST-16", "category": "Story and structure", "section": "5.2 PRS Computation", "summary": "Readers kept the 50 to 54% match rate but could not interpret it", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "Two readers kept the match rate without being able to interpret it (ST-16).", "skill": "manuscript-story"}], "stage": "now", "quote": "Reported variant-match rates in this benchmark were approximately 50 to 54%.", "detail": "Two readers remembered the match rate and two asked why only half the score variants matched on a high-coverage genome and what restoration would give; the paper says only that it reflects the benchmark configuration.", "action": "Give the reason beside the number, or the rate with reference-homozygote restoration on.", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-16"}]}, {"id": "ST-19", "category": "Story and structure", "section": "5.2 PRS Computation, last paragraph", "summary": "A paragraph on module reliability closes the PRS benchmark section", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "(ST-C16 moves it to 6.1 unchanged, ST-19)", "skill": "manuscript-story"}], "stage": "writing", "quote": "Annotation reliability depends on both the source evidence and its representation in the module.", "detail": "The paragraph is a scope statement about annotation modules; at the end of the scoring benchmark the potential user found it out of place.", "action": "Move it unchanged to 6.1 (ST-C16).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-19"}]}, {"id": "ST-20", "category": "Story and structure", "section": "Abstract to Conclusion", "summary": "The interface list, the disclaimer and the speed comparison are repeated", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "The list of interfaces (web, command line, Python, MCP) appears in seven places: the Abstract, the Introduction's last paragraph, the first paragraph of Section 2, Section 3.2, twice in 3.2.1, and Table 7.", "skill": "manuscript-story"}], "stage": "writing", "quote": "The web application, Python library, command line, standalone PRS interface, and MCP client share the scoring implementation.", "detail": "The interface list appears seven times, the no-diagnosis disclaimer six and the OakVar comparison five; several sentences answer a referee rather than tell a reader what was found.", "action": "Say each once where readers look (ST-C11 for the interface list); sort the referee-directed sentences with the authors.", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-20"}]}, {"id": "ST-21", "category": "Story and structure", "section": "7. Conclusion", "summary": "The paper's last sentence is a disclaimer", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "but the paper's last word is a disclaimer (ST-21).", "skill": "manuscript-story"}], "stage": "writing", "quote": "The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports.", "detail": "The Conclusion, like the Abstract, ends on a caveat; the paper never closes on what a reader can do with it.", "action": "Add a closing sentence on what readers can rerun or add, keeping both caveats (ST-C18).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-21"}]}, {"id": "ST-22", "category": "Story and structure", "section": "Title, end of the Introduction, Conclusion", "summary": "The lead theme shifts between the title and the closing passages", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "Which theme leads is your choice, and section 11 offers three ways to settle it (ST-22).", "skill": "manuscript-story"}], "stage": "writing", "quote": "This paper presents the standalone annotation engine, the reusable just-prs scoring library, the web interfaces, and MCP interfaces for calling these tools programmatically from AI assistants.", "detail": "The title leads with local-first and open source; the end of the Introduction and the Conclusion lead with a component list and give the MCP interface its own sentence. No reader carried the MCP interface, the registry or inspectable reports into their takeaway.", "action": "Confirm the story entry and choose among the direction options in the report.", "decision": true, "sources": [{"skill": "manuscript-story", "id": "ST-22"}]}, {"id": "ST-24", "category": "Writing and clarity", "section": "2. Platform Architecture", "summary": "The installation facts a user needs are missing", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-story"], "evidence": [{"path": "report.md", "quote": "The installation facts a user needs (ST-24): what a configured checkout is, which operating systems work, and the disk space and download time of the reference data.", "skill": "manuscript-story"}], "stage": "writing", "quote": "The platform requires Python 3.13+; from a configured checkout, `uv run serve` starts the application.", "detail": "Two readers looked for what a configured checkout is, supported operating systems, disk space and download time for reference data, and batch use.", "action": "Add these facts in Code Availability, where the installation paragraph would move (ST-C5).", "decision": false, "sources": [{"skill": "manuscript-story", "id": "ST-24"}]}], "changes": [{"id": "DS-C20", "kind": "Proposed edit", "section": "1. Introduction, paragraph 1", "summary": "State the sequencing-annotation gap plainly", "status": "proposed", "finding_ids": ["DS-12"], "before": "Yet the gap between sequencing accessibility and variant annotation remains wide.", "after": "Yet variant annotation has not become as accessible as sequencing.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "This is a proposal because the story stage has proposed reordering this paragraph (story proposal ST-C1).", "skill": "manuscript-deslop"}]}, {"id": "DS-C21", "kind": "Proposed edit", "section": "3.1 Longevity Variants Module (example), paragraph 2", "summary": "Delete the closing sentence that restates the section's opening", "status": "proposed", "finding_ids": ["DS-11"], "before": "This categorization demonstrates how the module format supports structured presentation of variant annotations without requiring code.", "after": null, "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "This is a proposal because it removes a sentence.", "skill": "manuscript-deslop"}]}, {"id": "DS-C22", "kind": "Proposed edit", "section": "5.1 Annotation Speed, paragraph 1", "summary": "Replace the two em dashes with commas; wording otherwise unchanged", "status": "proposed", "finding_ids": ["DS-1"], "before": "This is the co-author genome released publicly on Zenodo (record 18370498, CC0) — the same genome used for the PRS benchmark in Section 5.2 — so the benchmark is fully reproducible end-to-end; the benchmark scripts are provided in the repository, and the pipeline can equally be run on any standard whole-genome VCF.", "after": "This is the co-author genome released publicly on Zenodo (record 18370498, CC0), the same genome used for the PRS benchmark in Section 5.2, so the benchmark is fully reproducible end-to-end; the benchmark scripts are provided in the repository, and the pipeline can equally be run on any standard whole-genome VCF.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "This is a proposal because the prose-edit stage has proposed rewriting this sentence (prose-edit proposal PE-C20); if you accept that one, this one is not needed.", "skill": "manuscript-deslop"}]}, {"id": "DS-C23", "kind": "Proposed edit", "section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome, paragraph 1", "summary": "Replace 'you' and 'your' with 'users' and 'their'", "status": "proposed", "finding_ids": ["DS-13"], "before": "A tool that runs locally and shows you everything in your own genome is, in this light, an instrument of an existing right.", "after": "A tool that runs locally and shows users everything in their own genome is, in this light, an instrument of an existing right.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "This is a proposal because the prose-edit stage has proposed rewriting this paragraph's legal argument (prose-edit proposal PE-C29).", "skill": "manuscript-deslop"}]}, {"id": "DS-C24", "kind": "Proposed edit", "section": "6.5 Future Directions", "summary": "Drop the unsupported 'compelling' evaluation", "status": "proposed", "finding_ids": ["DS-14"], "before": "Multi-species support (companion-animal genomics) is a compelling direction.", "after": "Multi-species support (companion-animal genomics) is another possible direction.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "This is a proposal because it lowers the emphasis you gave the idea.", "skill": "manuscript-deslop"}]}, {"id": "JA-C1", "kind": "Proposed addition", "section": "Front matter", "summary": "Add eight keywords after the Abstract", "status": "proposed", "finding_ids": ["JA-1"], "before": null, "after": "**Keywords:** personal genomics; variant annotation; polygenic risk score; PGS Catalog; annotation modules; local-first software; open-source software; Model Context Protocol", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C1. Keywords (front matter)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C2", "kind": "Proposed edit", "section": "Front matter, author line", "summary": "Give names as first name then family name and free the asterisk for the corresponding author", "status": "proposed", "finding_ids": ["JS-7"], "before": "**Authors:** Kulaga Anton^1,2,4^, Usanov Nikolay^3,4^, Borysova Olga^4^, Karmazin Alexey^4^, Koval Maria^4^, Fedorova Alina^4^, Pushkareva Malvina^4^, Evfratov Sergey^4^, Ryangguk Kim^8^, Zaharia Livia^3^, Fuellen Georg^1,\\*^, Tacutu Robi^2,9,\\*^", "after": "**Authors:** Anton Kulaga^1,2,4^, Nikolay Usanov^3,4^, Olga Borysova^4^, Alexey Karmazin^4^, Maria Koval^4^, Alina Fedorova^4^, Malvina Pushkareva^4^, Sergey Evfratov^4^, Ryangguk Kim^8^, Livia Zaharia^3^, Georg Fuellen^1,‡^, Robi Tacutu^2,9,‡^ [AUTHORS: add \\* after the corresponding author and † after each author who contributed equally]", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C2 and JA-C3. Author names, equal contribution and correspondence (front matter)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C3", "kind": "Proposed edit", "section": "Front matter, below the affiliations", "summary": "Name the equal contributors and the corresponding author with an email address", "status": "proposed", "finding_ids": ["JS-7"], "before": "The contribution of these authors is considered to be equal. \\* Co-supervising authors.", "after": "† These authors contributed equally to this work. [AUTHORS: which authors?]\n‡ Co-supervising authors.\n\\* Correspondence: [AUTHORS: name and email address of the corresponding author]", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C2 and JA-C3. Author names, equal contribution and correspondence (front matter)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C4", "kind": "Proposed edit", "section": "Front matter, affiliations", "summary": "Complete every affiliation with city and country, and assign or delete affiliations 5 to 7", "status": "proposed", "finding_ids": ["IC-33"], "before": "1. Institute for Biostatistics and Informatics in Medicine and Ageing Research, Rostock University Medical Center, Rostock, Germany\n2. Institute of Biochemistry of the Romanian Academy\n3. HEALES (Healthy Life Extension Society)\n4. SecvADN SRL\n5. CellFabrik SRL\n6. MitoSpace\n7. M. Glushkov Institute of Cybernetics of National Academy of Sciences of Ukraine\n8. Oak Bioinformatics, LLC\n9. Romanian Bioinformatics Cluster (CRB), Târgu Mureș, Romania", "after": "1. Institute for Biostatistics and Informatics in Medicine and Ageing Research, Rostock University Medical Center, [AUTHORS: postal code] Rostock, Germany\n2. Institute of Biochemistry of the Romanian Academy, [AUTHORS: postal code and city], Romania\n3. HEALES (Healthy Life Extension Society), [AUTHORS: postal code, city and country]\n4. SecvADN SRL, [AUTHORS: postal code, city and country]\n5. CellFabrik SRL, [AUTHORS: postal code, city and country; assign to an author or delete]\n6. MitoSpace, [AUTHORS: postal code, city and country; assign to an author or delete]\n7. M. Glushkov Institute of Cybernetics of National Academy of Sciences of Ukraine, [AUTHORS: postal code and city], Ukraine [AUTHORS: assign to an author or delete]\n8. Oak Bioinformatics, LLC, [AUTHORS: city, state, postal code and country]\n9. Romanian Bioinformatics Cluster (CRB), [AUTHORS: postal code] Târgu Mureș, Romania", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C4. Affiliation addresses (front matter)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C5", "kind": "Proposed addition", "section": "Back matter, new section after Code Availability", "summary": "Add a data availability statement naming the genome, the module datasets and their sources", "status": "proposed", "finding_ids": ["IC-37"], "before": null, "after": "## **Data Availability Statement**\n\nPublicly available datasets were analyzed in this study. The whole-genome variant file used in both benchmarks is available on Zenodo at https://doi.org/10.5281/zenodo.18370498 under a CC0 waiver (Kulaga, 2026). The annotation modules and reference data that the platform uses are available on Hugging Face from the just-dna-seq organization: annotators (https://huggingface.co/datasets/just-dna-seq/annotators), ensembl_variations (https://huggingface.co/datasets/just-dna-seq/ensembl_variations), clinvar (https://huggingface.co/datasets/just-dna-seq/clinvar), pgs-catalog (https://huggingface.co/datasets/just-dna-seq/pgs-catalog) and prs-percentiles (https://huggingface.co/datasets/just-dna-seq/prs-percentiles) [AUTHORS: the revision of each dataset used for the benchmarks, and its licence]. They were derived from public resources: the PGS Catalog (https://www.pgscatalog.org) [AUTHORS: release], the 1000 Genomes Project phase 3, Ensembl Variation [AUTHORS: release] and ClinVar [AUTHORS: release]. The per-run annotation timings and the per-score PRS results behind Tables 2, 3, 5 and 6 are available at [AUTHORS: repository and DOI, once deposited]. The source code is available from https://github.com/dna-seq (Table 7) [AUTHORS: and the version described here is archived at the Zenodo DOI of the release].", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C5. Data availability statement (new section after Code Availability)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C6", "kind": "Proposed addition", "section": "Back matter, new section", "summary": "Add an ethics statement describing the benchmark genome, with a committee or no-committee ending", "status": "proposed", "finding_ids": ["PF-13"], "before": null, "after": "## **Ethics Statement**\n\nThe benchmarks in Section 5 used one human genome: the whole-genome variant file of author A.K., which he deposited himself on Zenodo in January 2026 under a CC0 waiver, with a statement releasing it for research use (https://doi.org/10.5281/zenodo.18370498). [AUTHORS: confirm that no other person's genome was used for any reported number or figure; if Livia Zaharia's genome (Zenodo record 19487816) was, name it here as well.] No participants were recruited and no intervention was performed. [AUTHORS: keep one of the next two sentences.] The Ethics Committee of [AUTHORS: name] determined on [AUTHORS: date] that this study did not require ethics approval (reference [AUTHORS: number]). Ethics approval was not sought because the only human data are a genome that its owner, an author of this study, released publicly for research use.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C6. Ethics statement (new back-matter section)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C7", "kind": "Proposed addition", "section": "Back matter, new section", "summary": "Add a consent-for-publication statement for the identifiable genome", "status": "proposed", "finding_ids": ["PF-13"], "before": null, "after": "## **Consent for Publication**\n\nWritten informed consent for publication of his genome data was obtained from A.K., whose genome was analyzed. [AUTHORS: true once A.K. has signed a consent-to-publish form; MDPI, Frontiers and BMC each offer one.]", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C7. Consent for publication (new back-matter section)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C8", "kind": "Proposed addition", "section": "Sectio ty and requirements**\n\n- Project name: Just-DNA-Lite\n- Project home page: https://github.com/dna-seq/just-dna-lite\n- Operating systems: Linux, macOS and Windows\n- Programming language: Python 3.13\n- Other requirements: uv for installation from source, or Podman or Docker for the container image [AUTHORS: add the Windows and macOS installers if the release you cite provides them]\n- License: GNU Affero General Public License v3.0 (AGPL-3.0)\n- Any restrictions to use by non-academics: none beyond the terms of the AGPL-3.0", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C13. Availability and requirements (Code Availability)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C14a", "kind": "Proposed edit", "section": "Abstract", "summary": "Spell out VCF in the Abstract", "status": "proposed", "finding_ids": ["ST-8"], "before": "For one public whole-genome VCF, warm-run annotation", "after": "For one public whole-genome variant call format (VCF) file, warm-run annotation", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C14. Abbreviations at first use (nine passages)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C14i", "kind": "Proposed edit", "section": "Abstract", "summary": "Spell out AI in the Abstract", "status": "proposed", "finding_ids": ["ST-8"], "before": "Optional external AI services introduce a separate data-sharing boundary.", "after": "Optional external artificial intelligence (AI) services introduce a separate data-sharing boundary.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C14. Abbreviations at first use (nine passages)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C14b", "kind": "Proposed edit", "section": "1. Introduction", "summary": "Spell out VCF at first use in the main text", "status": "proposed", "finding_ids": ["ST-8"], "before": "Researchers and individuals receive raw variant files (VCFs ecture", "summary": "Spell out CLI at first use", "status": "proposed", "finding_ids": ["ST-8"], "before": "annotation logic, and CLI tools)", "after": "annotation logic, and command-line interface (CLI) tools)", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C14. Abbreviations at first use (nine passages)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C14g", "kind": "Proposed edit", "section": "3.1 Longevity Variants Module (example)", "summary": "Spell out SNP at first use", "status": "proposed", "finding_ids": ["ST-8"], "before": "The SNP weight (*w*_SNP)", "after": "The single-nucleotide polymorphism (SNP) weight (*w*_SNP)", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C14. Abbreviations at first use (nine passages)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C14h", "kind": "Proposed edit", "section": "6.4 Limitations", "summary": "Spell out WGS and WES at first use", "status": "proposed", "finding_ids": ["ST-8"], "before": "The platform supports WGS and WES VCFs", "after": "The platform supports whole-genome sequencing (WGS) and whole-exome sequencing (WES) VCFs", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C14. Abbreviations at first use (nine passages)", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C15", "kind": "Proposed edit", "section": "Section headings, 2 to 7", "summary": "Group Sections 2 to 4 under Materials and Methods and renumber Results, Discussion and Conclusions (Genes; waits for the journal choice)", "status": "proposed", "finding_ids": ["JA-14"], "before": "## **2. Platform Architecture**", "after": "## **2. Materials and Methods**\n\n### **2.1 Platform Architecture**", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C15. Section names and numbering", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C16", "kind": "Proposed edit", "section": "Abstract", "summary": "Rearrange the Abstract's own sentences under the four Genes headings (Genes; waits for the journal choice)", "status": "proposed", "finding_ids": ["JS-5"], "before": "Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data.\n\nWe present Just-DNA-Lite, an open-source platform that combines local variant annotation and polygenic risk score (PRS) computation in a web interface. Annotation modules contain variant-trait tables and metadata, allowing researchers to extend the catalogue without writing executable plugins. A shared module contract, automatic source discovery, and a versioned registry connect published annotation content to local analysis and downloadable reports. The just-prs library provides scoring through web, command-line, Python, and Model Context Protocol interfaces.\n\nFor one public whole-genome VCF, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware. In a separate benchmark of 100 polygenic scores on the same individual's genome, DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively. Correlation with PLINK2 across the 96 scores completed by all engines was Pearson r = 0.999859. These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals.\n\nCore annotation and scoring run locally, with reference datasets downloaded and cached on the user's machine. Optional external AI services introduce a separate data-sharing boundary. Just-DNA-Lite is released under AGPL v3 for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.", "after": "**Background/Objectives:** Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data. We present Just-DNA-Lite, an open-source platform that combines local variant annotation and polygenic risk score (PRS) computation in a web interface.\n\n**Methods:** Annotation modules contain variant-trait tables and metadata, allowing researchers to extend the catalogue without writing executable plugins. A shared module contract, automatic source discovery, and a versioned registry connect published annotation content to local analysis and downloadable reports. The just-prs library provides scoring through web, command-line, Python, and Model Context Protocol interfaces. Core annotation and scoring run locally, with reference datasets downloaded and cached on the user's machine. Optional external artificial intelligence (AI) services introduce a separate data-sharing boundary.\n\n**Results:** For one public whole-genome variant call format (VCF) file, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware. In a separate benchmark of 100 polygenic scores on the same individual's genome, DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively. Correlation with PLINK2 across the 96 scores completed by all engines was Pearson r = 0.999859.\n\n**Conclusions:** These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals. Just-DNA-Lite is released under AGPL v3 for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.", "anchor": null, "why": "", "comment": "", "evidence": [{"path": "report.md", "quote": "JA-C16. Structured abstract", "skill": "manuscript-journal-adapt"}]}, {"id": "JA-C17", "kind
