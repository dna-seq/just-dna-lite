<p>###<ins class="proposed" data-c="44" title="PE-C16">#</ins> <strong>3.2.1 Standalone PRS Use and MCP Access</strong></p>
<p>just-prs <del class="applied" data-c="45" title="deslop.C10">serves</del><ins class="applied" data-c="45" title="deslop.C10">is</ins> both<del class="applied" data-c="45" title="deslop.C10"> as</del> a component of Just-DNA-Lite and<del class="applied" data-c="45" title="deslop.C10"> as</del> an independent tool. Users who only want polygenic scores can use its Python API, command-line interface, dedicated web UI, or <code>just-prs-mcp</code> server without running the annotation-module workflow. These entry points reuse the library's scoring, catalogue, and reference-panel logic.</p>
<p>The platform also provides an MCP interface<ins class="proposed" data-c="46" title="PE-C17">,</ins> for calling Just-DNA-Lite's broader genome-analysis workflow programmatically. This interface serves users working with the full platform, while <code>just-prs-mcp</code> provides independent access to PRS operations. Both let AI assistants call the underlying software through typed tools rather than write their own analysis routines.</p>
<p>The PRS tools support catalogue search, model-metadata inspection, genome-build and ancestry detection, input normalization, scoring, reference-population comparison, and result-quality assessment. Trait reports bring multiple models together with their identifiers, variant coverage, and population context. This gives users a report they can inspect alongside the assistant's explanation.</p>
<p>The tools return PGS IDs, variant-match rates, model quality tiers, reference populations, percentiles, and agreement or disagreement among models for a trait. These fields make the computational context available to the assistant, although their presence does not ensure that an assistant will explain them correctly. The server runs locally, but a remotely hosted assistant may receive tool outputs containing genomic results. Local scoring and private conversational processing therefore require separate consideration (Section 6.2).</p>
<p><del class="proposed" data-c="47" title="ST-C11">The</del><ins class="proposed" data-c="47" title="ST-C11">All of these entry points, and the Just-DNA-Lite</ins> web application,<del class="proposed" data-c="47" title="ST-C11"> Python library, command line, standalone PRS interface, and MCP client</del> share the scoring implementation<del class="proposed" data-c="47" title="ST-C11">.</del><ins class="proposed" data-c="47" title="ST-C11">;</ins> <del class="proposed" data-c="47" title="ST-C11">Equivalent</del><ins class="proposed" data-c="47" title="ST-C11">equivalent</ins> inputs, engine selection, reference data, and settings are required for equivalent results<del class="proposed" data-c="47" title="ST-C11">;</del><ins class="proposed" data-c="47" title="ST-C11">, and</ins> the engine benchmark in Section 5.2 does not independently test every interface or the accuracy of assistant-generated explanations.</p>
<h3><strong>3.3 Additional Trait Annotation Modules</strong></h3>
<p>The platform includes several additional modules that annotate variants against published GWAS and meta-analysis databases: <del class="applied" data-c="48" title="deslop.C11"><strong></del>cardiovascular-associated variants<del class="applied" data-c="48" title="deslop.C11"></strong></del> (SNPs selected on meta-study p-values and cross-population replication), <del class="applied" data-c="48" title="deslop.C11"><strong></del>lipid metabolism<del class="applied" data-c="48" title="deslop.C11"></strong></del> (same evidence-based inclusion criteria), and <del class="applied" data-c="48" title="deslop.C11"><strong></del>VO2 max and athletic performance<del class="applied" data-c="48" title="deslop.C11"></strong></del> (exercise genomics literature). All modules work by joining the user's VCF against curated variant-trait databases, adding annotation columns (weight, state, gene, conclusion) to matching variants. They do not calculate individual risk, generate diagnoses, or make clinical recommendations.</p>
<h3><strong>3.4 Growing the Module Ecosystem</strong></h3>
<p>The default set is extensible through the same module contract used by the application and registry. Researchers can prepare variant tables and metadata, compile them into portable artifacts, and distribute versions through configured repositories or <code>just-dna-registry</code>. Users can then select the resulting modules without modifying the annotation engine. This separates content updates from application releases, while leaving evidence review and scientific curation with module contributors. AI-assisted drafting provides another route to the same artifacts (Section 4).</p>
<h2><strong>4. AI-Assisted Module Creation (platform feature)</strong></h2>
<p>Building annotation modules by hand is labour-intensive: it requires reading the primary literature, identifying relevant variants, looking up rsIDs and genomic positions, assigning effect weights based on study quality and replication, and formatting the output. Just-DNA-Lite integrates an AI-assisted module-creation capability directly in the web interface, so that the platform can grow its own annotation content: a user can create a new module from within the app, without <ins class="proposed" data-c="49" title="PE-C18">installing other software. Drafting relies on </ins>external <del class="proposed" data-c="49" title="PE-C18">tooling</del><ins class="proposed" data-c="49" title="PE-C18">services: it needs a Gemini API key (OpenAI and Anthropic keys are optional) and queries the hosted BioContext knowledge base, so the prompt and any attached documents leave the user's machine, although the module creator does not read the genome</ins>. The user provides a free-text prompt in a chat interface and optionally attaches source documents; the system researches the variants against biomedical databases, drafts the module specification, and returns it for review.</p>
<p><del class="applied" data-c="50" title="deslop.C12">Whatever produces</del><ins class="applied" data-c="50" title="deslop.C12">However</ins> the draft<ins class="applied" data-c="50" title="deslop.C12"> is produced</ins>, <del class="applied" data-c="50" title="deslop.C12">what</del><ins class="applied" data-c="50" title="deslop.C12">the</ins> <del class="applied" data-c="50" title="deslop.C12">it</del><ins class="applied" data-c="50" title="deslop.C12">output</ins> <del class="applied" data-c="50" title="deslop.C12">emits</del><ins class="applied" data-c="50" title="deslop.C12">consists</ins> <del class="applied" data-c="50" title="deslop.C12">is</del><ins class="applied" data-c="50" title="deslop.C12">of</ins> the platform's standard, deterministic module artifacts (<code>module_spec.yaml</code>, <code>variants.csv</code>, <code>studies.csv</code>, <code>MODULE.md</code>, and a thumbnail),<ins class="applied" data-c="50" title="deslop.C12"> which are</ins> loaded into an editing slot in the UI where the user can review every file, make manual edits, iterate through follow-up messages, and then register the module with one click. The <ins class="applied" data-c="50" title="deslop.C12">platform depends on the </ins>artifact contract<del class="applied" data-c="50" title="deslop.C12">,</del> <del class="applied" data-c="50" title="deslop.C12">not</del><ins class="applied" data-c="50" title="deslop.C12">rather than on</ins> the drafting method,<del class="applied" data-c="50" title="deslop.C12"> is what the platform depends on —</del> which is why the same slot accepts a module written entirely by hand.</p>
<p><del class="applied" data-c="51" title="deslop.C13">Importantly, generated</del><ins class="applied" data-c="51" title="deslop.C13">Generated</ins> modules enter the platform through exactly the same path as hand-authored ones: they are deterministic specification files that are checked by the module validator (schema compliance, genotype sorting, weight/state consistency, wild-type presence) and compiled to Parquet before they can be registered. Provenance is made explicit<del class="applied" data-c="51" title="deslop.C13"> —</del><ins class="applied" data-c="51" title="deslop.C13">:</ins> each module's metadata carries a <code>curator</code> field <del class="applied" data-c="51" title="deslop.C13">distinguishing</del><ins class="applied" data-c="51" title="deslop.C13">that distinguishes</ins> expert-curated from AI-generated content<del class="applied" data-c="51" title="deslop.C13"> —</del><ins class="applied" data-c="51" title="deslop.C13">,</ins> so that AI-generated modules are surfaced to users as automated first drafts that benefit from expert review rather than as validated findings (see Section 6.1).</p>
<p>The companion <del class="applied" data-c="52" title="deslop.C14">manuscript</del><ins class="applied" data-c="52" title="deslop.C14">paper</ins>, <em>Creating and Sharing Genomic Annotation Modules with AI: The Just-DNA Ecosystem</em>, describes the authoring workflow and its evaluation. Here, AI-assisted creation is an integration feature; the runtime benchmarks do not evaluate draft accuracy or compare authoring models and agent arrangements. Schema validation establishes structural compliance, not the correctness of the extracted associations.</p>
<p><strong>Figure 4.</strong> The in-app AI Module Creator: the user attaches a research paper and describes the desired module; the generated module then appears in the editing slot with all files for review and one-click registration.</p>

<p>The approximately 172-fold speedup is the ratio of the <del class="proposed" data-c="60" title="PE-C22">reported</del><ins class="proposed" data-c="60" title="PE-C22">mean</ins> <del class="proposed" data-c="60" title="PE-C22">mean</del><ins class="proposed" data-c="60" title="PE-C22">of the three</ins> Generation I <del class="proposed" data-c="60" title="PE-C22">runtime</del><ins class="proposed" data-c="60" title="PE-C22">runtimes, recorded in 2023 (Supplementary S2),</ins> to the mean warm-run Just-DNA-Lite runtime<ins class="proposed" data-c="60" title="PE-C22">; against the cold-start mean the ratio is about 33-fold (Table 2)</ins>. It applies to these configurations and this input, rather than to OakVar generally. The benchmark used HDD storage and a workstation with 128 GB RAM; it does not directly establish performance on a laptop or the gains from SSD storage. <del class="proposed" data-c="61" title="PE-C23">Reported</del> <del class="proposed" data-c="61" title="PE-C23">peak</del><ins class="proposed" data-c="61" title="PE-C23">Resident</ins> memory<ins class="proposed" data-c="61" title="PE-C23"> measured at the start and end of each pipeline step</ins> remained below 750 MB for the runs in Table 3<ins class="proposed" data-c="61" title="PE-C23">; memory allocated and released within a step is not captured by this measurement</ins>. Streaming joins and column-pruned reads are architectural differences, but this comparison does not isolate their individual contributions to runtime.</p>

<p>DuckDB and Polars agreed to within 1.1 × 10⁻¹³ on this input. Scores closely agreed with the external PLINK2 comparator (Pearson r = 0.999859; maximum absolute score difference 21.4). The workflows differ in variant identification: just-prs resolves scoring variants by genomic position with allele-orientation handling, whereas the PLINK2 benchmark used exact chr:pos:ref:alt identifiers. This allows just-prs to match variants that the benchmark's exact-identifier route misses and explains why score differences can remain despite the same weighted-sum calculation. The comparison concerns this PLINK2 configuration, not a general limitation of the tool. Correlation here measures agreement across scores for one genome; it does not measure rankings across individuals. Supplementary S3 distinguishes per-call Python heap measurements from PLINK2 process memory.</p>
<p>Reported variant-match rates in this benchmark were approximately 50 to 54%. These values describe the benchmark configuration, rather than the maximum coverage supported by just-prs. Reference-homozygote restoration can recover eligible absent loci for many scores, and the array workflow supports LD-proxy estimation (Section 3.2); their coverage gains are not quantified by this engine comparison. Missingness and allele matching also affect comparison with reference distributions. The reported speedups are ratios of engine-level median runtimes, with 100 completed scores for DuckDB and Polars and 96 for PLINK2.</p>
<p>Annotation reliability depends on both the source evidence and its representation in the module. Published associations do not by themselves validate extraction, allele orientation, genotype matching, or report wording. The present benchmarks measure runtime and score agreement; they do not constitute a systematic accuracy evaluation of the annotation modules.</p>
<h2><strong>6. Discussion</strong></h2>
<h3><strong>6.1 Limitations of Variant Annotation</strong></h3>
<p>Variant annotation tools surface statistical associations from published literature, and several inherent limitations apply. Heritability is a population-level statistic, not individual determinism, and estimates change with environment, study design, and cohort. A polygenic risk score is a linear weighted sum that reflects where an individual falls in a reference population's distribution; real biology is not linear, and gene-gene and gene-environment interactions, feedback loops, developmental windows, and compensatory mechanisms are not captured. Most PGS Catalog scoring files were derived from predominantly European cohorts, so associations may not transfer to other ancestries (Section 6.4). Most variants surfaced are statistical associations from GWAS<del class="applied" data-c="63" title="deslop.C15">,</del> <del class="applied" data-c="63" title="deslop.C15">not</del><ins class="applied" data-c="63" title="deslop.C15">without an</ins> established causal <del class="applied" data-c="63" title="deslop.C15">mechanisms</del><ins class="applied" data-c="63" title="deslop.C15">mechanism</ins>; many GWAS hits are tagging SNPs, and effect sizes typically shrink in replication.</p>
<p>AI-generated modules carry additional uncertainty: they are automated drafts produced by language models reading published papers, and they will contain mistakes; users should treat them as lower confidence than expert-curated modules and review the underlying evidence. Just-DNA-Lite is a research tool, not a clinical pipeline. Raw VCFs contain false positives, and automated annotations have inherent error rates. The platform joins the user's variants against published databases and computes polygenic risk scores, adding contextual information from those sources; it does not interpret results in a clinical context.</p>
<h3><strong>6.2 Local Processing and Data Privacy</strong></h3>
<p>Core annotation and PRS computation use local genome files, cached reference datasets, and local result storage. Downloading reference data does not require uploading the user's genome. This architecture reduces the need to disclose genomic data to a hosted analysis service, but local execution is not a guarantee against disclosure through other parts of a workflow.</p>
<p>Optional AI explanations and MCP clients require a separate assessment: when an assistant uses an external model provider, prompts and tool outputs may transmit sensitive results even if the raw VCF remains local. Privacy therefore depends on the deployment, the selected services, and the information shared with them. The platform's local architecture alone does not establish regulatory compliance.</p>
<h3><strong>6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome</strong></h3>
<p>Just-DNA-Lite is built on a simple conviction: people <del class="proposed" data-c="64" title="PE-C29">have</del><ins class="proposed" data-c="64" title="PE-C29">should</ins> <del class="proposed" data-c="64" title="PE-C29">the</del><ins class="proposed" data-c="64" title="PE-C29">be</ins> <del class="proposed" data-c="64" title="PE-C29">right</del><ins class="proposed" data-c="64" title="PE-C29">able</ins> to read and explore their own genomic data, and researchers <del class="proposed" data-c="64" title="PE-C29">have</del><ins class="proposed" data-c="64" title="PE-C29">should</ins> <del class="proposed" data-c="64" title="PE-C29">the</del><ins class="proposed" data-c="64" title="PE-C29">be</ins> <del class="proposed" data-c="64" title="PE-C29">right</del><ins class="proposed" data-c="64" title="PE-C29">able</ins> to work with <del class="proposed" data-c="64" title="PE-C29">public </del>genomes <del class="proposed" data-c="64" title="PE-C29">without</del><ins class="proposed" data-c="64" title="PE-C29">that</ins> <del class="proposed" data-c="64" title="PE-C29">a</del><ins class="proposed" data-c="64" title="PE-C29">their</ins> <del class="proposed" data-c="64" title="PE-C29">gatekeeper's</del><ins class="proposed" data-c="64" title="PE-C29">owners</ins> <del class="proposed" data-c="64" title="PE-C29">permission</del><ins class="proposed" data-c="64" title="PE-C29">have deliberately made public, under the terms those owners chose. The law already recognises part of this</ins>. The GDPR's right of access (Article 15) <del class="proposed" data-c="64" title="PE-C29">already </del>entitles individuals to<del class="proposed" data-c="64" title="PE-C29"> obtain</del> a copy of <del class="proposed" data-c="64" title="PE-C29">their</del><ins class="proposed" data-c="64" title="PE-C29">the</ins> personal data<ins class="proposed" data-c="64" title="PE-C29"> a controller holds about them, which can include sequencing data held by a provider</ins>, and the<del class="proposed" data-c="64" title="PE-C29"> emerging</del> European Health Data Space <del class="proposed" data-c="64" title="PE-C29">is</del><ins class="proposed" data-c="64" title="PE-C29">Regulation</ins> <del class="proposed" data-c="64" title="PE-C29">designed</del><ins class="proposed" data-c="64" title="PE-C29">(EU)</ins> <del class="proposed" data-c="64" title="PE-C29">to</del><ins class="proposed" data-c="64" title="PE-C29">2025/327</ins> <del class="proposed" data-c="64" title="PE-C29">give</del><ins class="proposed" data-c="64" title="PE-C29">adds</ins> <del class="proposed" data-c="64" title="PE-C29">people</del><ins class="proposed" data-c="64" title="PE-C29">rights of</ins> access to <del class="proposed" data-c="64" title="PE-C29">and control over their own</del><ins class="proposed" data-c="64" title="PE-C29">electronic</ins> health <del class="proposed" data-c="64" title="PE-C29">information</del><ins class="proposed" data-c="64" title="PE-C29">records from 2029</ins>. A tool that runs locally <del class="proposed" data-c="64" title="PE-C29">and</del><ins class="proposed" data-c="64" title="PE-C29">lets</ins> <del class="proposed" data-c="64" title="PE-C29">shows</del><ins class="proposed" data-c="64" title="PE-C29">people</ins> <del class="proposed" data-c="64" title="PE-C29">you</del><ins class="proposed" data-c="64" title="PE-C29">use</ins> <del class="proposed" data-c="64" title="PE-C29">everything</del><ins class="proposed" data-c="64" title="PE-C29">the</ins> <del class="proposed" data-c="64" title="PE-C29">in</del><ins class="proposed" data-c="64" title="PE-C29">data</ins> <del class="proposed" data-c="64" title="PE-C29">your</del><ins class="proposed" data-c="64" title="PE-C29">they</ins> <del class="proposed" data-c="64" title="PE-C29">own genome is,</del><ins class="proposed" data-c="64" title="PE-C29">obtain</ins> in this <del class="proposed" data-c="64" title="PE-C29">light,</del><ins class="proposed" data-c="64" title="PE-C29">way</ins> <del class="proposed" data-c="64" title="PE-C29">an</del><ins class="proposed" data-c="64" title="PE-C29">without</ins> <del class="proposed" data-c="64" title="PE-C29">instrument</del><ins class="proposed" data-c="64" title="PE-C29">handing</ins> <del class="proposed" data-c="64" title="PE-C29">of</del><ins class="proposed" data-c="64" title="PE-C29">it</ins> <del class="proposed" data-c="64" title="PE-C29">an</del><ins class="proposed" data-c="64" title="PE-C29">to</ins> <del class="proposed" data-c="64" title="PE-C29">existing</del><ins class="proposed" data-c="64" title="PE-C29">another</ins> <del class="proposed" data-c="64" title="PE-C29">right</del><ins class="proposed" data-c="64" title="PE-C29">service</ins>.</p>
<p>Genomic findings can be misinterpreted or provide false reassurance, particularly when analytical errors and ancestry differences are overlooked (Tandy-Connor et al., 2018; Manrai et al., 2016). The interface presents model provenance, variant-match rates, ancestry context, and differences among scores to make these limitations inspectable. Displaying this information is a design choice; whether it improves user understanding requires a usability study. The project also maintains tutorials and has run hands-on workshops for non-specialists.</p>
<h3><strong>6.4 Limitations</strong></h3>
<p><strong>Population stratification.</strong> The 1000 Genomes-based percentile distributions provide population-specific reference points (AFR, AMR, EAS, EUR, SAS), but most modules and PGS scoring files derive from predominantly European cohorts; transferability to non-European populations is a known limitation of the source data, not specific to this platform. <strong>Ancestry selection.</strong> <del class="proposed" data-c="65" title="PE-C26">Automatic</del><ins class="proposed" data-c="65" title="PE-C26">The</ins> <del class="proposed" data-c="65" title="PE-C26">ancestry</del><ins class="proposed" data-c="65" title="PE-C26">web</ins> <del class="proposed" data-c="65" title="PE-C26">inference</del><ins class="proposed" data-c="65" title="PE-C26">interface</ins> <del class="proposed" data-c="65" title="PE-C26">from</del><ins class="proposed" data-c="65" title="PE-C26">infers</ins> the<ins class="proposed" data-c="65" title="PE-C26"> closest 1000 Genomes superpopulation when a</ins> VCF is <del class="proposed" data-c="65" title="PE-C26">not</del><ins class="proposed" data-c="65" title="PE-C26">loaded,</ins> <del class="proposed" data-c="65" title="PE-C26">yet</del><ins class="proposed" data-c="65" title="PE-C26">by</ins> <del class="proposed" data-c="65" title="PE-C26">implemented</del><ins class="proposed" data-c="65" title="PE-C26">projecting the genome onto reference principal components and classifying it among its 20 nearest reference neighbours, and returns an unknown call when fewer than 20% of the model's sites are present</ins>;<ins class="proposed" data-c="65" title="PE-C26"> the inferred superpopulation sets the default percentile panel, which</ins> users <del class="proposed" data-c="65" title="PE-C26">select</del><ins class="proposed" data-c="65" title="PE-C26">can</ins> <del class="proposed" data-c="65" title="PE-C26">the closest reference superpopulation</del><ins class="proposed" data-c="65" title="PE-C26">override</ins>. <strong>Input format.</strong> <del class="proposed" data-c="66" title="PE-C27">The</del><ins class="proposed" data-c="66" title="PE-C27">Just-DNA-Lite</ins> <del class="proposed" data-c="66" title="PE-C27">platform</del><ins class="proposed" data-c="66" title="PE-C27">currently</ins> <del class="proposed" data-c="66" title="PE-C27">supports</del><ins class="proposed" data-c="66" title="PE-C27">accepts GRCh38</ins> WGS and WES VCFs<del class="proposed" data-c="66" title="PE-C27">;</del><ins class="proposed" data-c="66" title="PE-C27">.</ins> <del class="proposed" data-c="66" title="PE-C27">GRCh38</del><ins class="proposed" data-c="66" title="PE-C27">The</ins> <del class="proposed" data-c="66" title="PE-C27">is</del><ins class="proposed" data-c="66" title="PE-C27">standalone</ins> <del class="proposed" data-c="66" title="PE-C27">the</del><ins class="proposed" data-c="66" title="PE-C27">just-prs</ins> <del class="proposed" data-c="66" title="PE-C27">primary</del><ins class="proposed" data-c="66" title="PE-C27">library</ins> <del class="proposed" data-c="66" title="PE-C27">build,</del><ins class="proposed" data-c="66" title="PE-C27">can</ins> <del class="proposed" data-c="66" title="PE-C27">with</del><ins class="proposed" data-c="66" title="PE-C27">lift</ins> GRCh37/hg19 <del class="proposed" data-c="66" title="PE-C27">handled</del><ins class="proposed" data-c="66" title="PE-C27">coordinates</ins> <del class="proposed" data-c="66" title="PE-C27">via</del><ins class="proposed" data-c="66" title="PE-C27">to GRCh38 when installed with its optional</ins> liftover<del class="proposed" data-c="66" title="PE-C27">;</del><ins class="proposed" data-c="66" title="PE-C27"> extra, and reads</ins> consumer microarray <del class="proposed" data-c="66" title="PE-C27">data is supported</del><ins class="proposed" data-c="66" title="PE-C27">files</ins> experimentally<ins class="proposed" data-c="66" title="PE-C27">,</ins> <del class="proposed" data-c="66" title="PE-C27">(</del>with far lower coverage<del class="proposed" data-c="66" title="PE-C27">,</del><ins class="proposed" data-c="66" title="PE-C27">;</ins> <del class="proposed" data-c="66" title="PE-C27">which</del><ins class="proposed" data-c="66" title="PE-C27">neither route is yet available in</ins> the <del class="proposed" data-c="66" title="PE-C27">platform</del><ins class="proposed" data-c="66" title="PE-C27">Just-DNA-Lite</ins> <del class="proposed" data-c="66" title="PE-C27">surfaces to users);</del><ins class="proposed" data-c="66" title="PE-C27">upload.</ins> T2T references are not yet supported. <strong>Module quality variation.</strong> Expert-curated modules inherit the limitations of their source databases; AI-generated modules have additional variability and require user review.</p>
<h3><strong>6.5 Future Directions</strong></h3>
<p>Several extensions are underway or planned: <ins class="proposed" data-c="67" title="PE-C28">bringing the </ins>GRCh37/hg19 liftover <del class="proposed" data-c="67" title="PE-C28">(added),</del><ins class="proposed" data-c="67" title="PE-C28">and</ins> experimental consumer-microarray support<ins class="proposed" data-c="67" title="PE-C28"> of the just-prs library into the Just-DNA-Lite upload</ins>, and eventual T2T reference support. Multi-species support (companion-animal genomics) is <del class="proposed" data-c="68" title="DS-C24">a</del><ins class="proposed" data-c="68" title="DS-C24">another</ins> <del class="proposed" data-c="68" title="DS-C24">compelling</del><ins class="proposed" data-c="68" title="DS-C24">possible</ins> direction. We are also considering methylation and transcriptomic ageing clocks, among the analyses users most frequently request. Within the ROGEN consortium, population-calibrated polygenic risk scores are planned for a Romanian genomic cohort of approximately 5,000 individuals; that cohort has not yet been sequenced, and none of the work reported here uses cohort data. Beyond technical extensions, the larger experiment is social: we encourage the community to build and share modules, and by design do not vet what others publish. This openness has an unavoidable consequence<del class="applied" data-c="69" title="deslop.C16"> —</del><ins class="applied" data-c="69" title="deslop.C16">:</ins> community- and AI-generated modules will contain mistakes<ins class="applied" data-c="69" title="deslop.C16">.</ins> <del class="applied" data-c="69" title="deslop.C16">—</del><ins class="applied" data-c="69" title="deslop.C16">Instead</ins> <del class="applied" data-c="69" title="deslop.C16">which</del><ins class="applied" data-c="69" title="deslop.C16">of gatekeeping,</ins> the platform mitigates <del class="applied" data-c="69" title="deslop.C16">not</del><ins class="applied" data-c="69" title="deslop.C16">this</ins> <del class="applied" data-c="69" title="deslop.C16">by gatekeeping but</del><ins class="applied" data-c="69" title="deslop.C16">consequence</ins> by making provenance visible (the <code>curator</code> field, the explicit expert-versus-AI distinction) so that trust can be calibrated. How best to curate and validate a large, decentralized ecosystem of genomic annotations is not yet known; Just-DNA-Lite is offered both as a usable platform and as a testbed for that question.</p>
<h2><strong>7. Conclusion</strong></h2>
<p>Just-DNA-Lite integrates local variant annotation, polygenic scoring, and inspectable reports with a portable annotation-module contract and versioned content discovery. Typed MCP tools make the PRS engine available to AI assistants. On one public genome, the reported benchmarks show faster annotation than the earlier Just-DNA-Seq configuration and close numerical agreement between scoring engines. Evaluation across individuals, reference populations, and matched-variant sets remains necessary to establish the broader reliability of these workflows. The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports.<ins class="proposed" data-c="70" title="ST-C18"> The code, the benchmark scripts and the public benchmark genome are openly available, so readers can rerun these measurements and add annotation modules of their own.</ins></p>

ity Variants Module (example), paragraph 2", "summary": "Paragraph ends on a mini-conclusion restating the section's opening", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-deslop"], "evidence": [{"path": "report.md", "quote": "The last sentence of Section 3.1, paragraph 2 restates the section's opening sentence as a conclusion.", "skill": "manuscript-deslop"}], "stage": "writing", "quote": "This categorization demonstrates how the module format supports structured presentation of variant annotations without requiring code.", "detail": "The closing sentence restates the section's first sentence as a conclusion and uses 'demonstrates' for one example.", "action": "Delete the sentence, or say where the categories are stored so it reports a fact (proposed).", "decision": false, "sources": [{"skill": "manuscript-deslop", "id": "DS-11"}]}, {"id": "DS-12", "category": "Writing and clarity", "section": "1. Introduction, paragraph 1", "summary": "Stock 'the gap remains wide' figure states the gap without content", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-deslop"], "evidence": [{"path": "report.md", "quote": "The phrase \"the gap [...] remains wide\" in Introduction paragraph 1 is a stock figure that states the gap without saying what it is.", "skill": "manuscript-deslop"}], "stage": "writing", "quote": "Yet the gap between sequencing accessibility and variant annotation remains wide.", "detail": "The sentence names a gap without saying what it is; the plain claim is that annotation has not become as accessible as sequencing.", "action": "Say the claim plainly (proposed, because the paragraph has an open story proposal).", "decision": false, "sources": [{"skill": "manuscript-deslop", "id": "DS-12"}]}, {"id": "DS-13", "category": "Writing and clarity", "section": "6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome, paragraph 1", "summary": "The paper addresses the reader as 'you'", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-deslop"], "evidence": [{"path": "report.md", "quote": "Section 6.3 addresses the reader directly (\"shows you everything in your own genome\").", "skill": "manuscript-deslop"}], "stage": "writing", "quote": "shows you everything in your own genome is, in this light", "detail": "A research article reports rather than addressing its reader; this is the only 'you' in the running text.", "action": "Write 'users' and 'their' (proposed, because the paragraph has an open prose-edit proposal).", "decision": false, "sources": [{"skill": "manuscript-deslop", "id": "DS-13"}]}, {"id": "DS-14", "category": "Writing and clarity", "section": "6.5 Future Directions", "summary": "Evaluation 'compelling' given with no reason", "severity": "info", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-deslop"], "evidence": [{"path": "report.md", "quote": "Section 6.5 calls multi-species support \"a compelling direction\" without saying what makes it compelling.", "skill": "manuscript-deslop"}], "stage": "writing", "quote": "Multi-species support (companion-animal genomics) is a compelling direction.", "detail": "The sentence's only content beyond the topic is that it is compelling; no reason is given.", "action": "Drop the evaluation or give the concrete reason (proposed, because it changes emphasis).", "decision": false, "sources": [{"skill": "manuscript-deslop", "id": "DS-14"}]}, {"id": "DS-16", "category": "Writing and clarity", "section": "Abstract; 3, paragraph 1; 3.3; 6.1; 7. Conclusion", "summary": "No-diagnosis disclaimer repeated in five places", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-deslop"], "evidence": [{"path": "report.md", "quote": "The statement that the platform does not diagnose or establish clinical validity appears in five places: the Abstract, the opening of Section 3, Section he environment of each arm are described nowhere (Section 5.1, Tables 2 to 4, Supplementary S2 summary), as the defence found.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware", "detail": "Warm runs, timed stages, modules, Ensembl setting and the OakVar version and annotators are never defined; S2 dates the OakVar runs to 2023 while Table 4 lists Linux 6.8.0 (released March 2024); the project's own run report shows a full 12-module run of 133 s (about 50x); the gVCF row divides a different input by the VCF-based OakVar mean.", "action": "Define warm and cold runs and the timed stages in Methods, give OakVar version, annotators, dates and OS for each arm, list the 11 warm-run times, and state the scope beside 172x in the Abstract.", "decision": true, "sources": [{"skill": "manuscript-integrity-check", "id": "IC-1"}, {"skill": "manuscript-reporting-check", "id": "RC-2"}, {"skill": "manuscript-peer-review", "id": "PR-1"}]}, {"id": "IC-2", "category": "Methods and reproducibility", "section": "5.1 Annotation Speed; 2.4 Performance Characteristics", "summary": "Peak memory is not a sampled peak, and the laptop and personal-computer claims rest on it and on a workstation benchmark", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-peer-review", "manuscript-reporting-check", "manuscript-story"], "evidence": [{"path": "report.md", "quote": "Memory that a join allocates and releases inside the step is never seen, so the true peak can be well above 748 MB; DuckDB's default memory limit in `annotation/configs.py` (lines 30–33) is 75% of system RAM with a floor of 8 GB.", "skill": "manuscript-integrity-check"}, {"path": "runtime.py", "quote": "peak_memory_mb = max(start_mem, end_mem) / (1024 * 1024)", "skill": ""}, {"path": "report.md", "quote": "Memory used and released within a st rt.md", "quote": "Table 5's means, however, divide different sets of scores: DuckDB's 0.394 s covers 100 scores including the four largest, PLINK2's 0.703 s covers 96.", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "Third, the medians are taken over different sets of scores (100 against 96), although every observation is paired by score.", "skill": "manuscript-reporting-check"}, {"path": "just-prs-docs-benchmarks-at-3fe0845-2026-05-27.md", "quote": "PLINK2 has a near-constant ~600 ms floor per PGS regardless of scoring file size", "skill": "manuscript-reporting-check"}, {"path": "just-prs-docs-benchmarks-at-3fe0845-2026-05-27.md", "quote": "| PGS000039 | 3,225,583 | 4.12 | 3.84 | 1.79 s |", "skill": "manuscript-reporting-check"}, {"path": "report.md", "quote": "What a per-score PRS timing includes is not stated, so the 12.3-fold and 5.7-fold medians may measure how PLINK2 was started rather than how fast it scores.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed: the paper says only that Table 5 gives seconds per PGS ID and that the speedups are ratios of medians; the PLINK2 version, command, threads, input format, the timed interval and the machine for Section 5.2 are given nowhere, and the defence found no answer.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively", "detail": "Table 5 means cover 100 vs 96 scores; on the 96 common scores DuckDB took 13.9 s and Polars 19.8 s vs PLINK2 67.5 s; the just-prs benchmark page shows PLINK2 faster on the three >1M-variant files it completed, and PLINK2 was run once per score, re-reading the genotype file each call. Sources read: https://github.com/dna-seq/just-prs/blob/v0.10.0/docs/benchmarks.md (“For the three files where PLINK2 did succeed, PLINK2 was faster for very large”).", "action": "Add one sentence giving totals on the 96 common scores, that PLINK2 was faster on the largest completed files, and that it was invoked per score.", "decision": true, "sources": [{"skill": "manuscript-integrity-check", "id": "IC-3"}, {"skill": "manuscript-reporting-check", "id": "RC-5"}, {"skill": "manuscript-peer-review", "id": "PR-3"}]}, {"id": "IC-4", "category": "Claims and evidence", "section": "5.2 PRS Computation, Table 6", "summary": "Agreement claim rests on correlation across heterogeneous scores; 21.4 unscaled", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-peer-review", "manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "The 96 points are 96 different scoring models applied to one genome, and their raw sums span orders of magnitude, so the correlation is dominated by that spread and stays near 1 even when individual scores differ markedly.", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "The explanation that position matching recovers variants is asserted rather than shown, since the paper gives no matched-variant counts per engine.", "skill": "manuscript-reporting-check"}, {"path": "just-prs-docs-benchmarks-at-3fe0845-2026-05-27.md", "quote": "The pre-converted pgen covers autosomes only (chr 1–22)", "skill": "manuscript-reporting-check"}, {"path": "report.md", "quote": "Agreement with PLINK2 is shown only as a correlation across 96 scores of very different size, which can be near 1 while individual scores disagree.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed in narrowed form: Section 5.2 already confines the correlation to agreement across scores for one genome and concedes that the two routes match different variants, as the defence found, but per-score magnitudes are missing.", "skill": "manuscript-peer-review"}], "stage": "now", "quote": "Scores closely agreed with the external PLINK2 comparator (Pearson r = 0.999859; maximum absolute score difference 21.4).", "detail": "Correlation across 96 different scoring models for one genome is dominated by the spread of raw sums; the maximum difference has no scale; the PLINK2 input was autosomes only while just-prs engines scored chrX, unmentioned in the paper. Sources read: https://github.com/dna-seq/just-prs/blob/v0.10.0/docs/benchmarks.md (“The pre-converted pgen covers autosomes only (chr 1–22)”).", "action": "Report per-score relative differences (median, maximum, count above a tolerance), name the 21.4 score and its value, state the autosome-only PLINK2 input, round r.", "decision": true, "sources": [{"skill": "manuscript-integrity-check", "id": "IC-4"}, {"skill": "manuscript-reporting-check", "id": "RC-6"}, {"skill": "manuscript-peer-review", "id": "PR-4"}]}, {"id": "IC-5", "category": "Claims and evidence", "section": "1. Introduction", "summary": "Absence claims are contradicted by OpenCRAVAT, OakVar and the authors' own Just-DNA-Seq", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-deslop", "manuscript-integrity-check", "manuscript-peer-review", "manuscript-reference-check", "manuscript-story"], "evidence": [{"path": "report.md", "quote": "The paper reports no search that could support an absence claim.", "skill": "manuscript-integrity-check"}, {"path": "report.md", "quote": "As written, the sentence is not supported.", "skill": "manuscript-reference-check"}, {"path": "pmcid_PMC7113103.txt", "quote": "It is open source and free of charge to users, with both command-line and graphical user interface (GUI) functionality.", "skill": "manuscript-reference-check"}, {"path": "report.md", "quote": "What was missing was a way to add such content without writing a plugin, which the manuscript says Generation II changes", "skill": "manuscript-reference-check"}, {"path": "kulaga2024_arxiv_2403.19087.txt", "quote": "To work with Just-DNA-Seq, a person can", "skill": "manuscript-reference-check"}, {"path": "report.md", "quote": "A referee who knows OpenCRAVAT will read the \"no open-source platform\" sentence as unsupported (ST-4, ST-5).", "skill": "manuscript-story"}, {"path": "report.md", "quote": "Two Introduction sentences say that no such tool exists, and earlier tools contradict both.", "skill": "manuscript-peer-review"}, {"path": "findings.adjudicated.json", "quote": "Confirmed in narrowed form: Section 1, paragraph 5 states how Just-DNA-Lite differs from Generation I, as the defence found, but paragraph 2 keeps the absolute claim.", "skill": "manuscript-peer-review"}, {"path": "report.md", "quote": "The Introduction's claim that \"There is no open-source platform\" with these features is a priority claim that the paper supports with no described search.", "skill": "manuscript-deslop"}], "stage": "now", "quote": "There is no open-source platform that combines comprehensive variant annotation with ease of use, transparency, and extensibility.", "detail": "Two 'no existing tool' sentences have no reported search; OpenCRAVAT (co-authored by this paper's co-author Ryangguk Kim), OakVar, impute.me and the authors' own Just-DNA-Seq are open-source tools in the same space.", "action": "Replace with a cited comparison stating how Just-DNA-Lite differs, or report a dated search.", "decision": true, "sources": [{"skill": "manuscript-integrity-check", "id": "IC-5"}, {"skill": "manuscript-reference-check", "id": "RC-5"}, {"skill": "manuscript-reference-check", "id": "RC-6"}, {"skill": "manuscript-story", "id": "ST-5"}, {"skill": "manuscript-peer-review", "id": "PR-12"}, {"skill": "manuscript-deslop", "id": "DS-15"}]}, {"id": "IC-6", "category": "Text versus code", "section": "3.2 Polygenic Risk Scores", "summary": "The PRS view shows an individual absolute lifetime risk the paper never describes", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-integrity-check", "manuscript-policy-fit"], "evidence": [{"path": "report.md", t", "section": "5. Benchmarking and Validation; 6. Discussion", "summary": "BioData Mining reserves results and discussion for the authors", "severity": "info", "assessment": "candidate", "resolution": "open", "skills": ["manuscript-journal-adapt"], "evidence": [{"path": "report.md", "quote": "BioData Mining's rule, through the Springer Nature AI policy, does not allow AI to write the results or discussion independently.", "skill": "manuscript-journal-adapt"}], "stage": "journal", "quote": null, "detail": "Under the Springer Nature AI policy AI may not write the results or discussion independently; whether this applies depends on how the authors used AI, which only they know.", "action": "Weigh it before BioData Mining, the third choice; Genes and Frontiers need only the declaration.", "decision": true, "sources": [{"skill": "manuscript-journal-adapt", "id": "JA-8"}]}, {"id": "JA-9", "category": "Submission package", "section": "Competing Interests", "summary": "Competing interests do not account for every author", "severity": "major", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt"], "evidence": [{"path": "report.md", "quote": "The draft covers Ryangguk Kim and the five co-founders of SecvADN SRL and says nothing about the other six authors.", "skill": "manuscript-journal-adapt"}], "stage": "final", "quote": "Ryangguk Kim is a co-founder of OakVar Inc.", "detail": "Frontiers requires every author to be accounted for when there are commercial affiliations; three further authors list SecvADN SRL and the statement says nothing about six authors.", "action": "Use the JA-C10 wording and fill in any further relationships.", "decision": false, "sources": [{"skill": "manuscript-journal-adapt", "id": "JA-9"}]}, {"id": "JA-10", "category": "Submission package", "section": "Contribution Statements", "summary": "Contributions are not in CRediT terms; most authors lack a writing role", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt"], "evidence": [{"path": "report.md", "quote": "Each role is mapped from your own description: \"co-founded the project\" as Conceptualization, \"team management\" as Project Administration, \"article writing\" as Writing – Original Draft Preparation, \"fundraising\" as Funding Acquisition, \"beta-testing\" as Validation, \"co-supervision\" as Supervision, and the curation work as Data Curation.", "skill": "manuscript-journal-adapt"}], "stage": "final", "quote": "co-supervision, valuable suggestions and comments", "detail": "Genes asks for CRediT roles with initials, Frontiers has the roles chosen at submission and requires each author to have written or critically reviewed the manuscript, and BMC asks for initials.", "action": "Use the JA-C11 mapping after checking each role.", "decision": false, "sources": [{"skill": "manuscript-journal-adapt", "id": "JA-10"}]}, {"id": "JA-11", "category": "Journal fit", "section": "Code Availability; Bibliography", "summary": "Datasets, including the benchmark genome's Zenodo record, are not cited or described as data", "severity": "minor", "assessment": "confirmed", "resolution": "open", "skills": ["manuscript-journal-adapt", "manuscript-reporting-check"], "evidence": [{"path": "report.md", "quote": "The genome and the five Hugging Face datasets are not cited as references.", "skill": "manuscript-journal-adapt"}, {"path": "report.md", "quote": "The record (https://zenodo.org/records/18370498) has a one-sentence description and one file.", "skill": "manuscript-reporting-check"}, {"path": "zenodo-18370498.json", "quote": "I, Anton Kulaga, share my genome and other personal health data to this repository to be freely used by others for research.", "skill": "manuscript-reporting-check"}], "stage": "final", "quote": "Annotation modules and reference datasets are published to the just-dna-seq organization on Hugging Face", "detail": "Genes enforces data citation before publication,
