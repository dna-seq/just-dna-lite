<h1><strong>Just-DNA-Lite: a Local-First, Open-Source Platform for Personal Genome Annotation and Polygenic Risk Scoring</strong></h1>
<blockquote>
<p><strong>Draft v0.3 (Paper 1 of 2).</strong> This is the platform paper: the local-first platform and the compute engines it runs — the annotation pipeline, the just-prs computation library <strong>and its <code>just-prs-mcp</code> access layer</strong>, the no-code module format, the web UI, <code>just-dna-format</code>, and the module registry. The boundary with the companion paper is <em>consuming</em> versus <em>authoring</em>: this paper covers how a compiled module or a published score is discovered, computed against a genome, and reported, including from an AI assistant that calls these operations as typed tools. The companion paper covers the other direction — an assistant <em>producing</em> new annotation content: the authoring plugin, the enrichment and compilation toolchain, and how modules are published and versioned. It is <em>Creating and Sharing Genomic Annotation Modules with AI: The Just-DNA Ecosystem</em> (in review at EASRP 2026; <code>paper2-just-module-creator.md</code>). See <code>docs/manuscript/v0.3/manuscript-strategy-v0.3.md</code>.</p>
</blockquote>

<h2><strong>Abstract</strong></h2>
<p>Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data.</p>
<p>We present Just-DNA-Lite, an open-source platform that combines local variant annotation and polygenic risk score (PRS) computation in a web interface. Annotation modules contain variant-trait tables and metadata, allowing researchers to extend the catalogue without writing executable plugins. A shared module contract, automatic source discovery, and a versioned registry connect published annotation content to local analysis and downloadable reports. The just-prs library provides scoring through web, command-line, Python, and Model Context Protocol interfaces.</p>
<p>For one public whole-genome VCF, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the earlier OakVar-based Just-DNA-Seq configuration on the same hardware. In a separate benchmark of 100 polygenic scores on the same individual's genome, DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively. Correlation with PLINK2 across the 96 scores completed by all engines was Pearson r = 0.999859. These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals.</p>
<p>Core annotation and scoring run locally, with reference datasets downloaded and cached on the user's machine. Optional external AI services introduce a separate data-sharing boundary. Just-DNA-Lite is released under AGPL v3 for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.</p>
<h2><strong>1. Introduction</strong></h2>
<p>Whole genome sequencing costs have fallen from billions of dollars to under a thousand since the completion of the Human Genome Project in 2003, and several companies now offer direct-to-consumer sequencing services (Whitley et al., 2020). Yet the gap between sequencing accessibility and variant annotation remains wide. Researchers and individuals receive raw variant files (VCFs) containing millions of variants but lack accessible tools to annotate them against published databases without specialized bioinformatics expertise.</p>
<p>Existing solutions occupy two extremes. Commercial platforms such as DNA Complete (formerly Nebula Genomics) and Dante Labs provide curated reports, but the curation is opaque: users cannot verify which polymorphisms contributed to a score, whether the methodology is appropriate for their ancestry, or how findings were weighted. At the other end, research-grade tools like PLINK, ANNOVAR, and VEP are powerful but demand command-line proficiency and significant setup effort. There is no open-source platform that combines comprehensive variant annotation with ease of use, transparency, and extensibility.</p>
<p>The genetics of longevity illustrates the need for extensible annotation tools. The field is rapidly evolving: traditional twin studies placed the heritability of lifespan at 20–25%, but a recent study in <em>Science</em> by Shenhar et al. (2025) estimates the intrinsic heritability at approximately 50% after correcting for extrinsic mortality confounders. GWAS studies have identified candidate loci including APOE and FOXO3 as consistently associated with longevity across populations (Broer et al., 2014; Caruso et al., 2022), and the catalogue of longevity-associated variants continues to grow. Databases such as LongevityMap within the Human Ageing Genomic Resources (HAGR) (Tacutu et al., 2017) have compiled thousands of variant-trait associations, but no existing tool makes it straightforward to annotate a personal VCF against these databases transparently and extensibly. This exemplifies a broader pattern: variant-trait associations are published faster than any single curation team can integrate them, motivating a platform where new annotation modules can be created rapidly.</p>
<p>A platform for personal genome annotation must therefore solve three problems simultaneously: it must be easy to use (web interface, no bioinformatics training), transparent in its methods (open-source, auditable scoring), and extensible (researchers should be able to add new annotation modules as the literature evolves, without writing code). Furthermore, privacy is a first-order concern: genomic data is among the most sensitive personal information, and uploading it to third-party servers introduces risks that many individuals and regulatory frameworks (such as the GDPR and the European Health Data Space) seek to avoid.</p>
<p>We developed Just-DNA-Lite as a ground-up rewrite of Just-DNA-Seq, whose first generation ran on OakVar (Kulaga et al., 2024). Just-DNA-Lite removes the OakVar dependency entirely and replaces it with our own standalone annotation engine, built with Dagster for workflow orchestration, polars-bio for VCF reading, Polars for columnar processing, and DuckDB for out-of-core joins. It also replaces Python annotation plugins with declarative data modules discoverable from configured sources (Section 2.2). In the reported same-hardware comparison, mean annotation runtime fell from 6,705 seconds for Generation I to 38.9 seconds for warm runs of Just-DNA-Lite (Section 5.1). Supplementary File S1 describes Generation I.</p>
<p>This paper presents the standalone annotation engine, the reusable just-prs scoring library, the web interfaces, and MCP interfaces for calling these tools programmatically from AI assistants. Together, these components let users discover annotation content, apply it to a genome, compute published polygenic scores, and inspect reports. The contribution is computational; the reported associations come from existing databases and literature. AI-assisted module authoring is introduced in Section 4 and treated in detail in the companion paper. Section 6 discusses the intended research and educational use and its limitations.</p>
<h2><strong>2. Platform Architecture</strong></h2>
<p>The architecture separates local computation, annotation content, and user interfaces. The annotation pipeline reads modules as data artifacts, allowing the catalogue to change independently of the application code. Columnar storage and streaming operations limit memory use. A graphical web application provides the main interface, while typed MCP tools expose the PRS engine to AI assistants (Section 3.2.1). Local execution avoids requiring genome uploads for core analysis; optional external services have a separate privacy boundary (Section 6.2).</p>
<p>Just-DNA-Lite is structured as a uv workspace containing two Python packages: just-dna-pipelines (Dagster assets, VCF processing, annotation logic, and CLI tools) and webui (a Reflex-based web interface). The platform requires Python 3.13+; from a configured checkout, <code>uv run serve</code> starts the application. Core annotation and scoring execute on the host machine.</p>
<h3><strong>2.1 Annotation Pipeline</strong></h3>
<p>The core annotation pipeline is built on Dagster with Software-Defined Assets, providing automatic data lineage tracking and resource monitoring (CPU usage, peak memory, and duration for every pipeline step). A typical annotation workflow proceeds as follows:</p>
<ol>
<li><strong>VCF ingestion.</strong> The user provides a VCF or VCF.gz file through the web interface. This is the annotated variant file users typically already have — supplied by a sequencing provider, downloaded from a public genome repository, or produced by their own bioinformatic pipeline; Just-DNA-Lite starts from this VCF and does not itself perform sequencing, alignment, or variant calling. The file is read using polars-bio, a Polars-native VCF reader.</li>
<li><strong>Normalization.</strong> The raw VCF undergoes quality filtering (configurable via <code>modules.yaml</code>): only variants passing specified FILTER values (by default, PASS and &quot;.&quot;) are retained, with optional minimum depth (DP ≥ 10) and quality (QUAL ≥ 20) thresholds. Chromosome prefixes (&quot;chr&quot;) are stripped for consistency with annotation databases. The normalized data is written as a Parquet file, which serves as the shared input for all downstream annotation.</li>
<li><strong>Module annotation.</strong> For each selected annotation module, the pipeline performs a streaming join between the normalized VCF Parquet and the module's precomputed weights Parquet. Joins are performed by rsID (default) or genomic position. Polars streaming joins keep peak memory low; for datasets too large to fit in memory, DuckDB handles out-of-core joins with configurable memory limits.</li>
<li><strong>Ensembl annotation (optional).</strong> When enabled, the pipeline joins the normalized VCF against the Ensembl Variation database (cached locally as chromosome-level Parquet files downloaded from HuggingFace via fsspec), providing clinical significance labels, consequence types, and cross-references for each variant.</li>
<li><strong>Report generation.</strong> Annotated results are written as Parquet files and rendered as downloadable PDF/HTML reports. All outputs are available for downstream analysis in Python, R, or any tool that reads Apache Arrow.</li>
</ol>
<p>The annotation data for reference databases and modules is prepared upstream by the prepare-annotations pipeline (github.com/dna-seq/prepare-annotations), which converts source databases into columnar Parquet format optimized for fast lookups.</p>
<h3><strong>2.2 Modular Plugin System</strong></h3>
<p>Annotation modules are data, not executable plugins. The annotation engine reads published Parquet tables directly. A typical weighted-association module contains <code>weights.parquet</code>, with accompanying <code>annotations.parquet</code> and <code>studies.parquet</code> when available; other module families can use different primary tables. Existing Parquet modules can be discovered and used without supplying YAML/CSV authoring files or recompiling them.</p>
<p>The <code>just-dna-format</code> library defines the authored specification and the manifest, integrity, and versioning contract for compiled artifacts. When a published module supplies a manifest, discovery uses its declared artifact files. For older Parquet modules without a manifest, the loader discovers the available tables directly.</p>
<p>For researchers creating new modules, a separate authoring route accepts <code>module_spec.yaml</code> and CSV tables such as <code>variants.csv</code> and <code>studies.csv</code>. The <code>just-dna-compiler</code> library validates and compiles these specifications into Parquet artifacts and a manifest during custom-module registration. Documentation and thumbnails may accompany the module. This route lets authors prepare annotation content without writing Python; it does not make CSV the runtime format or a requirement for using existing Parquet modules.</p>
<p>Module discovery uses sources configured in <code>modules.yaml</code>, with repository defaults and a local working copy for runtime changes. Sources may include HuggingFace datasets, GitHub repositories, HTTP/HTTPS servers, cloud storage, or local paths accessible through fsspec. The loader detects single modules and collections, and configuration can override display metadata without changing an artifact. The <code>just-dna-registry</code> service provides a catalogue for browsing and retrieving versioned modules. Artifact manifests provide identity and integrity information; integrity verification establishes that downloaded content matches the recorded artifact, not that its scientific claims are correct.</p>
<h3><strong>2.3 Web Interface and Self-Exploration</strong></h3>
<p>The web interface is built with Reflex, a Python framework that compiles to React; the entire UI is written in Python, with no JavaScript required. The interface provides file management (upload VCFs, select modules, launch annotation), module selection (browse modules, toggle Ensembl annotation), a results preview (sortable, filterable data grid in the browser), report download (PDF/HTML per module), and self-exploration: even without selecting a specific module, users can browse their full variant table with sorting, filtering, and search, cross-referenced against Ensembl for clinical significance labels, consequence types, and known phenotype associations when Ensembl annotation is enabled. All data can be exported as Parquet for downstream analysis in Python, R, DuckDB, or any Arrow-compatible tool.</p>
<p><strong>Figure 1.</strong> The Just-DNA-Lite web interface showing the annotation results view with module selection, variant data grid, and report download options.</p>
<h3><strong>2.4 Performance Characteristics</strong></h3>
<p>Consistent with the &quot;runs on a laptop&quot; principle, Just-DNA-Lite prioritizes memory efficiency over raw throughput: peak RAM stays low enough for a personal computer, and warm-run annotation of a whole genome completes in tens of seconds. Detailed speed and memory benchmarks — including the comparison against the Generation I OakVar-based system — are presented in Section 5.1.</p>
<h2><strong>3. Annotation Modules and Polygenic Scoring</strong></h2>
<p>Just-DNA-Lite ships with a set of expert-curated annotation modules developed by geneticist Olga Borysova, illustrating the platform's module system across several trait domains. These modules represent the default set; the platform is designed so that users, researchers within the ROGEN consortium, and the broader community can easily add their own modules, either by hand or with AI assistance (Section 4). The modules annotate user variants against published variant-trait association databases; they do not perform clinical interpretation or generate diagnoses.</p>
<p>These default modules originate in the first generation of the platform, the OakVar-based Just-DNA-Seq (Kulaga et al., 2024). That system was built around longevity and longevity-associated traits, which is why the default set centres on that domain; for the second generation we ported most modules largely unchanged, to serve as worked examples of the no-code module format rather than as a definitive trait catalogue.</p>

<h3><strong>3.1 Longevity Variants Module (example)</strong></h3>
<p>The Longevity Variants module illustrates how existing variant-trait association databases can be wrapped into the platform's no-code module format. It builds upon the LongevityMap database (Tacutu et al., 2017), which contains 3,144 variant-trait associations in 884 genes. Our contribution here is not re-annotation or re-validation of these variants, but (1) curation and expansion with post-2017 literature, adding 50 new entries and editing 876 existing records; (2) assignment of weighted scores based on study quality, replication across populations, and statistical significance; and (3) pathway-based categorization for structured browsing.</p>
<p>The module's weighting scheme assigns two independent weight components whose product yields the displayed score. The SNP weight (<em>w</em>_SNP) is an integrative parameter reflecting the strength of statistical evidence for a variant-trait association (number of independent significant studies, reported p-values, number of replicating populations). The genotype weight (<em>w</em>_genotype) captures the direction and magnitude of the reported association for a specific genotype: 0 for the reference genotype, ±0.5 or ±1.0 for heterozygous or homozygous carriers of the positively or negatively associated allele. The displayed score is <em>W</em>_display = <em>w</em>_SNP × <em>w</em>_genotype. For structured browsing, variants are grouped into 12 functional pathway categories (lipid transfer, insulin/IGF-1 signalling, antioxidant defence, mitochondrial function, sirtuins, mTOR, tumour suppressors, renin-angiotensin system, heat-shock proteins, inflammation, genome maintenance, and other pathways). This categorization demonstrates how the module format supports structured presentation of variant annotations without requiring code.</p>
<p><strong>Figure 2.</strong> Just-DNA-Lite UI: the Longevity Variants report, showing pathway categorization, the per-variant SNP table, and colour-coded weights.</p>
<h3><strong>3.2 Polygenic Risk Scores</strong></h3>
<p>Polygenic risk scores (PRS) aggregate the effects of many common variants into a single weighted sum, providing a population-relative measure for a given trait (Lambert et al., 2021). We developed the just-prs library (github.com/dna-seq/just-prs) as the PRS computation engine for Just-DNA-Lite. Although it powers PRS inside the platform, just-prs is a self-contained, separable component: it can equally be used on its own as a Python library, a command-line tool, an MCP server and agent skill (Section 3.2.1), or as a lightweight standalone PRS web application. just-prs provides access to all 5,000+ scoring files in the PGS Catalog.</p>
<p>Unlike the Generation I approach, which used Monte Carlo sampling to estimate percentile distributions, just-prs uses precomputed percentile distributions derived from the 1000 Genomes Project phase 3 dataset, against five superpopulations (AFR, AMR, EAS, EUR, SAS). Users select the reference population closest to their ancestry, and the percentile reflects their position within that distribution.</p>
<p>just-prs provides two scoring engines: <strong>DuckDB</strong> (SQL-based, out-of-core scoring) and <strong>Polars</strong> (LazyFrame joins). PLINK2 is used only as an external benchmark comparator to assess agreement with an established tool; it is not provided as a just-prs scoring engine. Section 5.2 reports runtime and numerical agreement. In the web interface, users browse the PGS Catalog in a searchable grid, select scores, and click &quot;Compute&quot;; results show the score sum, matched-variant count, and percentile within the selected superpopulation.</p>
<p>For variant-only whole-genome VCFs, just-prs offers optional reference-homozygote restoration. A reference-allele dataset resolves otherwise unscorable absent loci, allowing them to contribute as homozygous reference when the user selects this mode. This can increase scoring-file coverage for many scores, under the assumption that the absent loci were callable and homozygous reference. Restoration is off by default; it is not applied to gVCF inputs, and array restoration is restricted to eligible chip positions with matching reference data.</p>
<p>The consumer-array workflow accepts formats such as 23andMe and AncestryDNA and uses precomputed linkage disequilibrium (LD) proxy tables to estimate untyped scoring variants from typed proxies where suitable tables are available. LD-based estimation and reference-homozygote restoration address different sources of missingness: the former uses correlations between loci, while the latter assigns reference genotypes to eligible absent loci. Coverage and the assumptions used to recover missing information remain part of the result's interpretation.</p>
<p><strong>Figure 3. PRS results in Just-DNA-Lite (just-prs trait view).</strong> For a selected trait, all associated PGS Catalog models are computed and shown together as a consensus distribution with the user's percentile against a 1000 Genomes reference population, alongside per-model variant match rates and quality tiers. Showing the models together — including where they disagree — is deliberate (see Section 6.3).</p>

<h3><strong>3.2.1 Standalone PRS Use and MCP Access</strong></h3>
<p>just-prs serves both as a component of Just-DNA-Lite and as an independent tool. Users who only want polygenic scores can use its Python API, command-line interface, dedicated web UI, or <code>just-prs-mcp</code> server without running the annotation-module workflow. These entry points reuse the library's scoring, catalogue, and reference-panel logic.</p>
<p>The platform also provides an MCP interface for calling Just-DNA-Lite's broader genome-analysis workflow programmatically. This interface serves users working with the full platform, while <code>just-prs-mcp</code> provides independent access to PRS operations. Both let AI assistants call the underlying software through typed tools rather than write their own analysis routines.</p>
<p>The PRS tools support catalogue search, model-metadata inspection, genome-build and ancestry detection, input normalization, scoring, reference-population comparison, and result-quality assessment. Trait reports bring multiple models together with their identifiers, variant coverage, and population context. This gives users a report they can inspect alongside the assistant's explanation.</p>
<p>The tools return PGS IDs, variant-match rates, model quality tiers, reference populations, percentiles, and agreement or disagreement among models for a trait. These fields make the computational context available to the assistant, although their presence does not ensure that an assistant will explain them correctly. The server runs locally, but a remotely hosted assistant may receive tool outputs containing genomic results. Local scoring and private conversational processing therefore require separate consideration (Section 6.2).</p>
<p>The web application, Python library, command line, standalone PRS interface, and MCP client share the scoring implementation. Equivalent inputs, engine selection, reference data, and settings are required for equivalent results; the engine benchmark in Section 5.2 does not independently test every interface or the accuracy of assistant-generated explanations.</p>
<h3><strong>3.3 Additional Trait Annotation Modules</strong></h3>
<p>The platform includes several additional modules that annotate variants against published GWAS and meta-analysis databases: <strong>cardiovascular-associated variants</strong> (SNPs selected on meta-study p-values and cross-population replication), <strong>lipid metabolism</strong> (same evidence-based inclusion criteria), and <strong>VO2 max and athletic performance</strong> (exercise genomics literature). All modules work by joining the user's VCF against curated variant-trait databases, adding annotation columns (weight, state, gene, conclusion) to matching variants. They do not calculate individual risk, generate diagnoses, or make clinical recommendations.</p>
<h3><strong>3.4 Growing the Module Ecosystem</strong></h3>
<p>The default set is extensible through the same module contract used by the application and registry. Researchers can prepare variant tables and metadata, compile them into portable artifacts, and distribute versions through configured repositories or <code>just-dna-registry</code>. Users can then select the resulting modules without modifying the annotation engine. This separates content updates from application releases, while leaving evidence review and scientific curation with module contributors. AI-assisted drafting provides another route to the same artifacts (Section 4).</p>
<h2><strong>4. AI-Assisted Module Creation (platform feature)</strong></h2>
<p>Building annotation modules by hand is labour-intensive: it requires reading the primary literature, identifying relevant variants, looking up rsIDs and genomic positions, assigning effect weights based on study quality and replication, and formatting the output. Just-DNA-Lite integrates an AI-assisted module-creation capability directly in the web interface, so that the platform can grow its own annotation content: a user can create a new module from within the app, without external tooling. The user provides a free-text prompt in a chat interface and optionally attaches source documents; the system researches the variants against biomedical databases, drafts the module specification, and returns it for review.</p>
<p>Whatever produces the draft, what it emits is the platform's standard, deterministic module artifacts (<code>module_spec.yaml</code>, <code>variants.csv</code>, <code>studies.csv</code>, <code>MODULE.md</code>, and a thumbnail), loaded into an editing slot in the UI where the user can review every file, make manual edits, iterate through follow-up messages, and then register the module with one click. The artifact contract, not the drafting method, is what the platform depends on — which is why the same slot accepts a module written entirely by hand.</p>
<p>Importantly, generated modules enter the platform through exactly the same path as hand-authored ones: they are deterministic specification files that are checked by the module validator (schema compliance, genotype sorting, weight/state consistency, wild-type presence) and compiled to Parquet before they can be registered. Provenance is made explicit — each module's metadata carries a <code>curator</code> field distinguishing expert-curated from AI-generated content — so that AI-generated modules are surfaced to users as automated first drafts that benefit from expert review rather than as validated findings (see Section 6.1).</p>
<p>The companion manuscript, <em>Creating and Sharing Genomic Annotation Modules with AI: The Just-DNA Ecosystem</em>, describes the authoring workflow and its evaluation. Here, AI-assisted creation is an integration feature; the runtime benchmarks do not evaluate draft accuracy or compare authoring models and agent arrangements. Schema validation establishes structural compliance, not the correctness of the extracted associations.</p>

<h2><strong>5. Benchmarking and Validation</strong></h2>
<h3><strong>5.1 Annotation Speed</strong></h3>
<p>We benchmarked Just-DNA-Lite against the Generation I OakVar-based system on the same hardware. The input was a single whole-genome VCF containing 6,138,868 variant records (4,729,824 SNPs and 1,414,226 indels), produced by DeepVariant v1.4.0 against GRCh38 at ~162× mean coverage. This is the co-author genome released publicly on Zenodo (record 18370498, CC0) — the same genome used for the PRS benchmark in Section 5.2 — so the benchmark is fully reproducible end-to-end; the benchmark scripts are provided in the repository, and the pipeline can equally be run on any standard whole-genome VCF.</p>

<p>Reported variant-match rates in this benchmark were approximately 50 to 54%. These values describe the benchmark configuration, rather than the maximum coverage supported by just-prs. Reference-homozygote restoration can recover eligible absent loci for many scores, and the array workflow supports LD-proxy estimation (Section 3.2); their coverage gains are not quantified by this engine comparison. Missingness and allele matching also affect comparison with reference distributions. The reported speedups are ratios of engine-level median runtimes, with 100 completed scores for DuckDB and Polars and 96 for PLINK2.</p>
<p>Annotation reliability depends on both the source evidence and its representation in the module. Published associations do not by themselves validate extraction, allele orientation, genotype matching, or report wording. The present benchmarks measure runtime and score agreement; they do not constitute a systematic accuracy evaluation of the annotation modules.</p>
<h2><strong>6. Discussion</strong></h2>
<h3><strong>6.1 Limitations of Variant Annotation</strong></h3>
<p>Variant annotation tools surface statistical associations from published literature, and several inherent limitations apply. Heritability is a population-level statistic, not individual determinism, and estimates change with environment, study design, and cohort. A polygenic risk score is a linear weighted sum that reflects where an individual falls in a reference population's distribution; real biology is not linear, and gene-gene and gene-environment interactions, feedback loops, developmental windows, and compensatory mechanisms are not captured. Most PGS Catalog scoring files were derived from predominantly European cohorts, so associations may not transfer to other ancestries (Section 6.4). Most variants surfaced are statistical associations from GWAS, not established causal mechanisms; many GWAS hits are tagging SNPs, and effect sizes typically shrink in replication.</p>
<p>AI-generated modules carry additional uncertainty: they are automated drafts produced by language models reading published papers, and they will contain mistakes; users should treat them as lower confidence than expert-curated modules and review the underlying evidence. Just-DNA-Lite is a research tool, not a clinical pipeline. Raw VCFs contain false positives, and automated annotations have inherent error rates. The platform joins the user's variants against published databases and computes polygenic risk scores, adding contextual information from those sources; it does not interpret results in a clinical context.</p>
<h3><strong>6.2 Local Processing and Data Privacy</strong></h3>
<p>Core annotation and PRS computation use local genome files, cached reference datasets, and local result storage. Downloading reference data does not require uploading the user's genome. This architecture reduces the need to disclose genomic data to a hosted analysis service, but local execution is not a guarantee against disclosure through other parts of a workflow.</p>
<p>Optional AI explanations and MCP clients require a separate assessment: when an assistant uses an external model provider, prompts and tool outputs may transmit sensitive results even if the raw VCF remains local. Privacy therefore depends on the deployment, the selected services, and the information shared with them. The platform's local architecture alone does not establish regulatory compliance.</p>
<h3><strong>6.3 Platform Philosophy: Transparency and the Right to Read Your Own Genome</strong></h3>
<p>Just-DNA-Lite is built on a simple conviction: people have the right to read and explore their own genomic data, and researchers have the right to work with public genomes without a gatekeeper's permission. The GDPR's right of access (Article 15) already entitles individuals to obtain a copy of their personal data, and the emerging European Health Data Space is designed to give people access to and control over their own health information. A tool that runs locally and shows you everything in your own genome is, in this light, an instrument of an existing right.</p>
<p>Genomic findings can be misinterpreted or provide false reassurance, particularly when analytical errors and ancestry differences are overlooked (Tandy-Connor et al., 2018; Manrai et al., 2016). The interface presents model provenance, variant-match rates, ancestry context, and differences among scores to make these limitations inspectable. Displaying this information is a design choice; whether it improves user understanding requires a usability study. The project also maintains tutorials and has run hands-on workshops for non-specialists.</p>
<h3><strong>6.4 Limitations</strong></h3>
<p><strong>Population stratification.</strong> The 1000 Genomes-based percentile distributions provide population-specific reference points (AFR, AMR, EAS, EUR, SAS), but most modules and PGS scoring files derive from predominantly European cohorts; transferability to non-European populations is a known limitation of the source data, not specific to this platform. <strong>Ancestry selection.</strong> Automatic ancestry inference from the VCF is not yet implemented; users select the closest reference superpopulation. <strong>Input format.</strong> The platform supports WGS and WES VCFs; GRCh38 is the primary build, with GRCh37/hg19 handled via liftover; consumer microarray data is supported experimentally (with far lower coverage, which the platform surfaces to users); T2T references are not yet supported. <strong>Module quality variation.</strong> Expert-curated modules inherit the limitations of their source databases; AI-generated modules have additional variability and require user review.</p>
<h3><strong>6.5 Future Directions</strong></h3>
<p>Several extensions are underway or planned: GRCh37/hg19 liftover (added), experimental consumer-microarray support, and eventual T2T reference support. Multi-species support (companion-animal genomics) is a compelling direction. We are also considering methylation and transcriptomic ageing clocks, among the analyses users most frequently request. Within the ROGEN consortium, population-calibrated polygenic risk scores are planned for a Romanian genomic cohort of approximately 5,000 individuals; that cohort has not yet been sequenced, and none of the work reported here uses cohort data. Beyond technical extensions, the larger experiment is social: we encourage the community to build and share modules, and by design do not vet what others publish. This openness has an unavoidable consequence — community- and AI-generated modules will contain mistakes — which the platform mitigates not by gatekeeping but by making provenance visible (the <code>curator</code> field, the explicit expert-versus-AI distinction) so that trust can be calibrated. How best to curate and validate a large, decentralized ecosystem of genomic annotations is not yet known; Just-DNA-Lite is offered both as a usable platform and as a testbed for that question.</p>
<h2><strong>7. Conclusion</strong></h2>
<p>Just-DNA-Lite integrates local variant annotation, polygenic scoring, and inspectable reports with a portable annotation-module contract and versioned content discovery. Typed MCP tools make the PRS engine available to AI assistants. On one public genome, the reported benchmarks show faster annotation than the earlier Just-DNA-Seq configuration and close numerical agreement between scoring engines. Evaluation across individuals, reference populations, and matched-variant sets remains necessary to establish the broader reliability of these workflows. The platform provides infrastructure for research and education, without establishing clinical validity for the findings it reports.</p>

<h2><strong>Abstract</strong></h2>
<p>Personal genome analysis requires tools that make published variant associations accessible while allowing users to inspect the methods and retain control of their data.<ins class="proposed" data-c="2" title="ST-C2"> Commercial reports typically do not let users verify which variants contributed to a score, and research-grade annotation tools demand command-line proficiency.</ins></p>
<p>We present Just-DNA-Lite, an open-source platform that combines local variant annotation and polygenic risk score (PRS) computation in a web interface. Annotation modules contain variant-trait tables and metadata, allowing researchers to extend the catalogue without writing executable plugins. A shared module contract, automatic source discovery, and a versioned registry connect published annotation content to local analysis and downloadable reports. The just-prs library provides scoring through web, command-line, Python, and Model Context Protocol interfaces.</p>
<p>For one public whole-genome <ins class="proposed" data-c="3" title="JA-C14a">variant call format (</ins>VCF<ins class="proposed" data-c="3" title="JA-C14a">) file</ins>, warm-run annotation averaged 38.9 seconds across 11 runs, approximately 172 times faster than the <ins class="proposed" data-c="4" title="PE-C1">mean of three 2023 runs of the </ins>earlier OakVar-based Just-DNA-Seq configuration on the same hardware<ins class="proposed" data-c="4" title="PE-C1">; first runs (cold starts) averaged 203.3 seconds, about 33 times faster</ins>. In a separate benchmark of 100 polygenic scores on the same individual's genome, DuckDB and Polars had median per-score runtimes 12.3 and 5.7 times faster than PLINK2, respectively. Correlation with PLINK2 across the 96 scores completed by all engines was Pearson r = 0.999859. These measurements assess computational performance and numerical agreement for one genome; they do not establish predictive accuracy or agreement in rankings across individuals.</p>
<p>Core annotation and scoring run locally, with reference datasets downloaded and cached on the user's machine. Optional external <ins class="proposed" data-c="5" title="JA-C14i">artificial intelligence (</ins>AI<ins class="proposed" data-c="5" title="JA-C14i">)</ins> services introduce a separate data-sharing boundary. Just-DNA-Lite is released under <ins class="proposed" data-c="6" title="PE-C2">the </ins>AGPL v3<ins class="proposed" data-c="6" title="PE-C2"> licence and is intended</ins> for research and education; it does not provide diagnoses or establish clinical validity for the associations it reports.</p>
<p><ins class="proposed" data-c="7" title="JA-C1"><strong>Keywords:</strong> personal genomics; variant annotation; polygenic risk score; PGS Catalog; annotation modules; local-first software; open-source software; Model Context Protocol</ins></p>
<h2><strong>1. Introduction</strong></h2>
<p><del class="proposed" data-c="8" title="PE-C3">Whole</del><ins class="proposed" data-c="8" title="PE-C3">The cost of sequencing a human</ins> genome <del class="proposed" data-c="8" title="PE-C3">sequencing costs have</del><ins class="proposed" data-c="8" title="PE-C3">has</ins> fallen from <del class="proposed" data-c="8" title="PE-C3">billions</del><ins class="proposed" data-c="8" title="PE-C3">an</ins> <del class="proposed" data-c="8" title="PE-C3">of</del><ins class="proposed" data-c="8" title="PE-C3">estimated</ins> <del class="proposed" data-c="8" title="PE-C3">dollars</del><ins class="proposed" data-c="8" title="PE-C3">$0.5–1</ins> <del class="proposed" data-c="8" title="PE-C3">to</del><ins class="proposed" data-c="8" title="PE-C3">billion</ins> <del class="proposed" data-c="8" title="PE-C3">under a thousand since the completion of</del><ins class="proposed" data-c="8" title="PE-C3">for</ins> the Human Genome Project<ins class="proposed" data-c="8" title="PE-C3">'s reference sequence, completed</ins> in 2003<ins class="proposed" data-c="8" title="PE-C3">, to under $1,000 (National Human Genome Research Institute; Whitley et al., 2020)</ins>, and several companies now offer direct-to-consumer sequencing services<del class="proposed" data-c="8" title="PE-C3"> (Whitley et al., 2020)</del>. Yet <del class="proposed" data-c="9" title="DS-C20">the gap between sequencing accessibility and </del>variant annotation <del class="proposed" data-c="9" title="DS-C20">remains</del><ins class="proposed" data-c="9" title="DS-C20">has</ins> <del class="proposed" data-c="9" title="DS-C20">wide</del><ins class="proposed" data-c="9" title="DS-C20">not become as accessible as sequencing</ins>. Researchers and individuals receive raw variant <del class="proposed" data-c="10" title="JA-C14b">files</del><ins class="proposed" data-c="10" title="JA-C14b">call format</ins> (<del class="proposed" data-c="10" title="JA-C14b">VCFs</del><ins class="proposed" data-c="10" title="JA-C14b">VCF</ins>)<ins class="proposed" data-c="10" title="JA-C14b"> files</ins> containing millions of variants but lack accessible tools to annotate them against published databases without specialized bioinformatics expertise.</p>
<p>Existing solutions occupy two extremes. Commercial platforms such as DNA Complete (formerly Nebula Genomics) and Dante Labs provide curated reports, but the curation is opaque: users cannot verify which polymorphisms contributed to a score, whether the methodology is appropriate for their ancestry, or how findings were weighted. At the other end, research-grade tools like PLINK<ins class="proposed" data-c="11" title="ST-C20"> (Chang et al., 2015)</ins>, ANNOVAR<ins class="proposed" data-c="11" title="ST-C20"> (Wang et al., 2010)</ins>, and VEP<ins class="proposed" data-c="11" title="ST-C20"> (McLaren et al., 2016)</ins> are powerful but demand command-line proficiency and significant setup effort. <del class="proposed" data-c="12" title="ST-C3">There</del><ins class="proposed" data-c="12" title="ST-C3">The</ins> <del class="proposed" data-c="12" title="ST-C3">is no</del><ins class="proposed" data-c="12" title="ST-C3">closest</ins> open-source <del class="proposed" data-c="12" title="ST-C3">platform</del><ins class="proposed" data-c="12" title="ST-C3">platforms</ins> <del class="proposed" data-c="12" title="ST-C3">that</del><ins class="proposed" data-c="12" title="ST-C3">sit</ins> <del class="proposed" data-c="12" title="ST-C3">combines</del><ins class="proposed" data-c="12" title="ST-C3">between</ins> <del class="proposed" data-c="12" title="ST-C3">comprehensive</del><ins class="proposed" data-c="12" title="ST-C3">these</ins> <del class="proposed" data-c="12" title="ST-C3">variant</del><ins class="proposed" data-c="12" title="ST-C3">extremes.</ins> <del class="proposed" data-c="12" title="ST-C3">annotation</del><ins class="proposed" data-c="12" title="ST-C3">OpenCRAVAT (Pagel et al., 2020) offers an open, modular resource catalogue</ins> with <del class="proposed" data-c="12" title="ST-C3">ease</del><ins class="proposed" data-c="12" title="ST-C3">command-line</ins> <del class="proposed" data-c="12" title="ST-C3">of</del><ins class="proposed" data-c="12" title="ST-C3">and</ins> <del class="proposed" data-c="12" title="ST-C3">use,</del><ins class="proposed" data-c="12" title="ST-C3">graphical</ins> <del class="proposed" data-c="12" title="ST-C3">transparency</del><ins class="proposed" data-c="12" title="ST-C3">interfaces</ins>, and <del class="proposed" data-c="12" title="ST-C3">extensibility</del><ins class="proposed" data-c="12" title="ST-C3">our first generation ran on its fork OakVar, whose annotators are Python plugins. For polygenic scores, the PGS Catalog Calculator, pgsc_calc (Lambert et al., 2024), is a portable pipeline that includes genetic ancestry estimation, and Impute.me (Folkersen et al., 2020) computes scores for consumer genotype data that users upload to its website</ins>.</p>
<p>The genetics of longevity illustrates the need for extensible annotation tools. The field is rapidly evolving: traditional twin studies placed the heritability of lifespan at 20–25%, but a recent study in <em>Science</em> by Shenhar et al. (2025) estimates the intrinsic heritability at approximately 50% after correcting for extrinsic mortality confounders. <del class="proposed" data-c="13" title="PE-C5">GWAS</del><ins class="proposed" data-c="13" title="PE-C5">Candidate-gene</ins> studies <del class="proposed" data-c="13" title="PE-C5">have</del><ins class="proposed" data-c="13" title="PE-C5">first</ins> <del class="proposed" data-c="13" title="PE-C5">identified candidate loci including</del><ins class="proposed" data-c="13" title="PE-C5">associated</ins> APOE and FOXO3 <del class="proposed" data-c="13" title="PE-C5">as consistently associated </del>with longevity<del class="proposed" data-c="13" title="PE-C5"> across populations</del> (Broer et al., 2014; Caruso et al., 2022)<ins class="proposed" data-c="13" title="PE-C5">. In a genome-wide meta-analysis of European-ancestry cohorts, only the APOE locus replicated consistently</ins>, and <del class="proposed" data-c="13" title="PE-C5">the</del><ins class="proposed" data-c="13" title="PE-C5">FOXO3 reached significance only when published data were included (Broer et al., 2014). The</ins> catalogue of longevity-associated variants continues to grow. Databases such as LongevityMap within the Human Ageing Genomic Resources (HAGR) (Tacutu et al., 2017) have compiled thousands of <del class="proposed" data-c="14" title="PE-C6">variant</del><ins class="proposed" data-c="14" title="PE-C6">variants tested for association with longevity. Our earlier OakVar</ins>-<del class="proposed" data-c="14" title="PE-C6">trait</del><ins class="proposed" data-c="14" title="PE-C6">based</ins> <del class="proposed" data-c="14" title="PE-C6">associations</del><ins class="proposed" data-c="14" title="PE-C6">platform, Just-DNA-Seq (Kulaga et al., 2024), annotated personal VCFs against a curated LongevityMap</ins>, but <del class="proposed" data-c="14" title="PE-C6">no</del><ins class="proposed" data-c="14" title="PE-C6">each</ins> <del class="proposed" data-c="14" title="PE-C6">existing</del><ins class="proposed" data-c="14" title="PE-C6">new</ins> <del class="proposed" data-c="14" title="PE-C6">tool</del><ins class="proposed" data-c="14" title="PE-C6">annotation</ins> <del class="proposed" data-c="14" title="PE-C6">makes</del><ins class="proposed" data-c="14" title="PE-C6">source</ins> <del class="proposed" data-c="14" title="PE-C6">it straightforward to annotate</del><ins class="proposed" data-c="14" title="PE-C6">required</ins> a <del class="proposed" data-c="14" title="PE-C6">personal</del><ins class="proposed" data-c="14" title="PE-C6">Python</ins> <del class="proposed" data-c="14" title="PE-C6">VCF against these databases transparently and extensibly</del><ins class="proposed" data-c="14" title="PE-C6">plugin</ins>. <del class="applied" data-c="15" title="deslop.C1">This</del><ins class="applied" data-c="15" title="deslop.C1">The</ins> <del class="applied" data-c="15" title="deslop.C1">exemplifies</del><ins class="applied" data-c="15" title="deslop.C1">genetics of longevity is one example of</ins> a broader pattern: variant-trait associations are published faster than any single curation team can integrate them, motivating a platform <del class="applied" data-c="15" title="deslop.C1">where</del><ins class="applied" data-c="15" title="deslop.C1">on which</ins> new annotation modules can be created rapidly.</p>
<p>A platform for personal genome annotation must therefore solve three problems simultaneously: it must be easy to use (web interface, no bioinformatics training), transparent in its methods (open-source, auditable scoring), and extensible (researchers should be able to add new annotation modules as the literature evolves, without writing code). Furthermore, privacy is a first-order concern: genomic data is among the most sensitive personal information, <ins class="proposed" data-c="16" title="PE-C30">which the EU General Data Protection Regulation treats as a special category (Article 9), </ins>and uploading it to third-party servers introduces risks that many individuals<del class="proposed" data-c="16" title="PE-C30"> and regulatory frameworks (such as the GDPR and the European Health Data Space)</del> seek to avoid.</p>
<p>We developed Just-DNA-Lite as a ground-up rewrite of Just-DNA-Seq, whose first generation ran on OakVar (Kulaga et al., 2024). Just-DNA-Lite removes the OakVar dependency entirely and replaces it with our own standalone annotation engine<del class="proposed" data-c="17" title="ST-C4">,</del> <del class="proposed" data-c="17" title="ST-C4">built</del><ins class="proposed" data-c="17" title="ST-C4">(Section</ins> <del class="proposed" data-c="17" title="ST-C4">with Dagster for workflow orchestration, polars-bio for VCF reading, Polars for columnar processing, and DuckDB for out-of-core joins</del><ins class="proposed" data-c="17" title="ST-C4">2.1)</ins>. It also replaces Python annotation plugins with declarative data modules discoverable from configured sources (Section 2.2). In the reported same-hardware comparison, mean annotation runtime fell from 6,705 seconds for Generation I to 38.9 seconds for warm runs of Just-DNA-Lite (Section 5.1). Supplementary File S1 describes Generation I.</p>
<p>This paper presents the standalone annotation engine, the reusable just-prs scoring library, the web interfaces, and <ins class="proposed" data-c="18" title="JA-C14e">Model Context Protocol (</ins>MCP<ins class="proposed" data-c="18" title="JA-C14e">)</ins> interfaces for calling these tools programmatically from <ins class="proposed" data-c="18" title="JA-C14e">artificial intelligence (</ins>AI<ins class="proposed" data-c="18" title="JA-C14e">)</ins> assistants. Together, these components let users discover annotation content, apply it to a genome, compute published polygenic scores, and inspect reports. The contribution is computational; the reported associations come from existing databases and literature. AI-assisted module authoring is introduced in Section 4 and treated in detail in the companion paper. Section 6 discusses the intended research and educational use and its limitations.</p>
<h2><strong>2. Platform Architecture</strong></h2>
<p>The architecture separates local computation, annotation content, and user interfaces. The annotation pipeline reads modules as data artifacts, allowing the catalogue to change independently of the application code. Columnar storage and streaming operations limit memory use. A graphical web application provides the main interface, while typed MCP tools expose the PRS engine to AI assistants (Section 3.2.1). <del class="applied" data-c="19" title="deslop.C2">Local</del><ins class="applied" data-c="19" title="deslop.C2">Core</ins> <del class="applied" data-c="19" title="deslop.C2">execution</del><ins class="applied" data-c="19" title="deslop.C2">analysis</ins> <del class="applied" data-c="19" title="deslop.C2">avoids</del><ins class="applied" data-c="19" title="deslop.C2">runs</ins> <del class="applied" data-c="19" title="deslop.C2">requiring</del><ins class="applied" data-c="19" title="deslop.C2">locally and does not require uploading the</ins> genome<del class="applied" data-c="19" title="deslop.C2"> uploads for core analysis</del>; optional external services have a separate privacy boundary (Section 6.2).</p>
<p>Just-DNA-Lite is structured as a uv workspace containing two Python packages: just-dna-pipelines (Dagster assets, VCF processing, annotation logic, and <ins class="proposed" data-c="20" title="JA-C14f">command-line interface (</ins>CLI<ins class="proposed" data-c="20" title="JA-C14f">)</ins> tools) and webui (a Reflex-based web interface). The platform requires Python 3.13+; from a configured checkout, <code>uv run serve</code> starts the application. Core annotation and scoring execute on the host machine.</p>
<h3><strong>2.1 Annotation Pipeline</strong></h3>
<p>The core annotation pipeline is built on Dagster with Software-Defined Assets, providing automatic data lineage tracking and resource monitoring (CPU usage, peak memory, and duration for every pipeline step). A typical annotation workflow proceeds as follows:</p>
<ol>
<li><strong>VCF ingestion.</strong> The user provides a VCF or VCF.gz file through the web interface. This is the <del class="proposed" data-c="21" title="ST-C6">annotated </del>variant file users typically already have<ins class="applied" data-c="22" title="deslop.C3">,</ins> <del class="applied" data-c="22" title="deslop.C3">—</del><ins class="applied" data-c="22" title="deslop.C3">whether</ins> supplied by a sequencing provider, downloaded from a public genome repository, or produced by their own bioinformatic pipeline; Just-DNA-Lite starts from this VCF and does not itself perform sequencing, alignment, or variant calling. The file is read using polars-bio, a Polars-native VCF reader.</li>
<li><strong>Normalization.</strong> The raw VCF undergoes quality filtering (configurable via <code>modules.yaml</code>): only variants passing specified FILTER values (by default, PASS and &quot;.&quot;) are retained, with optional minimum depth (DP ≥ 10) and quality (QUAL ≥ 20) thresholds. Chromosome prefixes (&quot;chr&quot;) are stripped for consistency with annotation databases. The normalized data is written as a Parquet file, which <del class="applied" data-c="23" title="deslop.C4">serves as</del><ins class="applied" data-c="23" title="deslop.C4">is</ins> the shared input for all downstream annotation.</li>
<li><strong>Module annotation.</strong> For each selected annotation module, the pipeline performs a streaming join between the normalized VCF Parquet and the module's precomputed weights Parquet. Joins are performed by <del class="proposed" data-c="24" title="prose-edit.C1, PE-C7">rsID</del><ins class="proposed" data-c="24" title="prose-edit.C1, PE-C7">genomic position and genotype</ins> (default)<ins class="proposed" data-c="24" title="prose-edit.C1, PE-C7">,</ins> or <del class="proposed" data-c="24" title="prose-edit.C1, PE-C7">genomic</del><ins class="proposed" data-c="24" title="prose-edit.C1, PE-C7">by</ins> <del class="proposed" data-c="24" title="prose-edit.C1, PE-C7">position</del><ins class="proposed" data-c="24" title="prose-edit.C1, PE-C7">rsID for modules without coordinates</ins>. Polars streaming joins keep peak memory low<del class="proposed" data-c="24" title="prose-edit.C1, PE-C7">; for datasets too large to fit in memory, DuckDB handles out-of-core joins with configurable memory limits</del>.</li>
<li><strong>Ensembl annotation (optional).</strong> When enabled, the pipeline joins the normalized VCF against the Ensembl Variation database (cached locally as chromosome-level Parquet files downloaded from <del class="proposed" data-c="24" title="prose-edit.C1, PE-C7">HuggingFace</del><ins class="proposed" data-c="24" title="prose-edit.C1, PE-C7">Hugging Face</ins> via fsspec), providing clinical significance labels, consequence types, and cross-references for each variant<ins class="proposed" data-c="24" title="prose-edit.C1, PE-C7">. DuckDB performs this join out of core, with configurable memory limits, for datasets too large to fit in memory</ins>.</li>
<li><strong>Report generation.</strong> Annotated results are written as Parquet files and rendered as downloadable PDF/HTML reports. All outputs are available for downstream analysis in Python, R, or any tool that reads Apache Arrow.</li>
</ol>
<p>The annotation data for reference databases and modules is prepared upstream by the prepare-annotations pipeline (github.com/dna-seq/prepare-annotations), which converts source databases into columnar Parquet format optimized for fast lookups.</p>
<h3><strong>2.2 <del class="proposed" data-c="25" title="ST-C7">Modular</del><ins class="proposed" data-c="25" title="ST-C7">Annotation</ins> <del class="proposed" data-c="25" title="ST-C7">Plugin</del><ins class="proposed" data-c="25" title="ST-C7">Modules</ins> <del class="proposed" data-c="25" title="ST-C7">System</del><ins class="proposed" data-c="25" title="ST-C7">as Data</ins></strong></h3>
<p>Annotation modules are data, not executable plugins. The annotation engine reads published Parquet tables directly. A typical weighted-association module contains <code>weights.parquet</code>, with accompanying <code>annotations.parquet</code> and <code>studies.parquet</code> when available; other module families can use different primary tables. Existing Parquet modules can be discovered and used without supplying YAML/CSV authoring files or recompiling them.</p>
<p><del class="proposed" data-c="26" title="ST-C8">The</del><ins class="proposed" data-c="26" title="ST-C8">A compiled module can carry a manifest that records its identity and integrity, so a download can be checked against the recorded artifact; the</ins> <code>just-dna-format</code> library defines <ins class="proposed" data-c="26" title="ST-C8">this manifest, its versioning contract and </ins>the authored specification<del class="proposed" data-c="26" title="ST-C8"> and the manifest, integrity, and versioning contract for compiled artifacts</del>. When a published module supplies a manifest, discovery uses its declared artifact files. For older Parquet modules without a manifest, the loader discovers the available tables directly.</p>
<p>For researchers creating new modules, a separate authoring route accepts <code>module_spec.yaml</code> and CSV tables such as <code>variants.csv</code> and <code>studies.csv</code>. The <code>just-dna-compiler</code> library validates and compiles these specifications into Parquet artifacts and a manifest during custom-module registration. Documentation and thumbnails may accompany the module. This route lets authors prepare annotation content without writing Python; it does not make CSV the runtime format or a requirement for using existing Parquet modules.</p>
<p>Module discovery uses sources configured in <code>modules.yaml</code>, with repository defaults and a local working copy for runtime changes. Sources may include <del class="applied" data-c="27" title="prose-edit.C2">HuggingFace</del><ins class="applied" data-c="27" title="prose-edit.C2">Hugging Face</ins> datasets, GitHub repositories, HTTP/HTTPS servers, cloud storage, or local paths accessible through fsspec. The loader detects single modules and collections, and configuration can override display metadata without changing an artifact. The <code>just-dna-registry</code> service provides a catalogue for browsing and retrieving versioned modules. Artifact manifests provide identity and integrity information; integrity verification establishes that downloaded content matches the recorded artifact, not that its scientific claims are correct.</p>
<h3><strong>2.3 Web Interface and Self-Exploration</strong></h3>
<p>The web interface is built with Reflex, a Python framework that compiles to React; the entire UI is written in Python, with no JavaScript required. The interface provides file management (upload VCFs, select modules, launch annotation), module selection (browse modules, toggle Ensembl annotation), a results preview (sortable, filterable data grid in the browser), report download (PDF/HTML per module), and self-exploration<del class="applied" data-c="28" title="deslop.C5">:</del><ins class="applied" data-c="28" title="deslop.C5">.</ins> <del class="applied" data-c="28" title="deslop.C5">even</del><ins class="applied" data-c="28" title="deslop.C5">Even</ins> without selecting a specific module, users can browse their full variant table with sorting, filtering, and search<ins class="applied" data-c="28" title="deslop.C5">; when Ensembl annotation is enabled</ins>,<ins class="applied" data-c="28" title="deslop.C5"> the table is</ins> cross-referenced against Ensembl for clinical significance labels, consequence types, and known phenotype associations<del class="applied" data-c="28" title="deslop.C5"> when Ensembl annotation is enabled</del>. All data can be exported as Parquet for downstream analysis in Python, R, DuckDB, or any Arrow-compatible tool.</p>

<h3><strong>2.4 Performance Characteristics</strong></h3>
<p><del class="proposed" data-c="29" title="PE-C8">Consistent</del><ins class="proposed" data-c="29" title="PE-C8">Just-DNA-Lite</ins> <del class="proposed" data-c="29" title="PE-C8">with</del><ins class="proposed" data-c="29" title="PE-C8">aims</ins> <del class="proposed" data-c="29" title="PE-C8">the</del><ins class="proposed" data-c="29" title="PE-C8">to</ins> <del class="proposed" data-c="29" title="PE-C8">&quot;runs</del><ins class="proposed" data-c="29" title="PE-C8">run</ins> on a <del class="proposed" data-c="29" title="PE-C8">laptop&quot;</del><ins class="proposed" data-c="29" title="PE-C8">personal</ins> <del class="proposed" data-c="29" title="PE-C8">principle,</del><ins class="proposed" data-c="29" title="PE-C8">computer</ins> <del class="proposed" data-c="29" title="PE-C8">Just-DNA-Lite</del><ins class="proposed" data-c="29" title="PE-C8">and therefore</ins> prioritizes memory efficiency over raw throughput<del class="proposed" data-c="29" title="PE-C8">:</del><ins class="proposed" data-c="29" title="PE-C8">;</ins> <del class="proposed" data-c="29" title="PE-C8">peak</del><ins class="proposed" data-c="29" title="PE-C8">on</ins> <del class="proposed" data-c="29" title="PE-C8">RAM</del><ins class="proposed" data-c="29" title="PE-C8">the</ins> <del class="proposed" data-c="29" title="PE-C8">stays</del><ins class="proposed" data-c="29" title="PE-C8">benchmark</ins> <del class="proposed" data-c="29" title="PE-C8">low enough for a personal computer</del><ins class="proposed" data-c="29" title="PE-C8">workstation</ins>,<del class="proposed" data-c="29" title="PE-C8"> and</del> warm-run annotation of a whole genome <del class="proposed" data-c="29" title="PE-C8">completes</del><ins class="proposed" data-c="29" title="PE-C8">completed</ins> in tens of seconds. <del class="applied" data-c="30" title="deslop.C6">Detailed</del><ins class="applied" data-c="30" title="deslop.C6">Section 5.1 presents the detailed</ins> speed and memory benchmarks<del class="applied" data-c="30" title="deslop.C6"> —</del><ins class="applied" data-c="30" title="deslop.C6">,</ins> including the comparison against the Generation I OakVar-based system<del class="applied" data-c="30" title="deslop.C6"> — are presented in Section 5.1</del>.</p>
<h2><strong>3. Annotation Modules and Polygenic Scoring</strong></h2>
<p>Just-DNA-Lite ships with a set of expert-curated annotation modules developed by geneticist Olga Borysova, illustrating the platform's module system across several trait domains. These modules <del class="applied" data-c="31" title="deslop.C7">represent</del><ins class="applied" data-c="31" title="deslop.C7">are</ins> the default set; the platform is designed so that users, researchers within the ROGEN consortium, and the broader community can easily add their own modules, either by hand or with AI assistance (Section 4). The modules annotate user variants against published variant-trait association databases; they do not perform clinical interpretation or generate diagnoses.</p>
<p>These default modules originate in the first generation of the platform, the OakVar-based Just-DNA-Seq (Kulaga et al., 2024). That system was built around longevity and longevity-associated traits, which is why the default set centres on that domain; for the second generation we ported most modules largely unchanged, to serve as worked examples of the no-code module format rather than as a definitive trait catalogue.</p>

<h3><strong>3.1 Longevity <del class="proposed" data-c="32" title="ST-C10">Variants</del><ins class="proposed" data-c="32" title="ST-C10">Map</ins> Module (example)</strong></h3>
<p>The Longevity <del class="proposed" data-c="32" title="ST-C10">Variants</del><ins class="proposed" data-c="32" title="ST-C10">Map</ins> module<ins class="proposed" data-c="32" title="ST-C10"> (Table 1), whose report is titled Longevity Variants,</ins> illustrates how existing variant-trait association databases can be wrapped into the platform's no-code module format. It builds upon the LongevityMap database (Tacutu et al., 2017), which <del class="proposed" data-c="33" title="PE-C9">contains</del><ins class="proposed" data-c="33" title="PE-C9">in Build 3 (June 2017) lists</ins> 3,144 <del class="proposed" data-c="33" title="PE-C9">variant-trait associations</del><ins class="proposed" data-c="33" title="PE-C9">variants</ins> in 884 genes<ins class="proposed" data-c="33" title="PE-C9"> from 550 study entries, 275 of them reporting a significant association</ins>. Our contribution here is not re-annotation or re-validation of these variants, but (1) <ins class="proposed" data-c="34" title="PE-C10">the </ins>curation and expansion <ins class="proposed" data-c="34" title="PE-C10">published </ins>with <del class="proposed" data-c="34" title="PE-C10">post-2017</del><ins class="proposed" data-c="34" title="PE-C10">Generation</ins> <del class="proposed" data-c="34" title="PE-C10">literature</del><ins class="proposed" data-c="34" title="PE-C10">I (Kulaga et al.</ins>, <del class="proposed" data-c="34" title="PE-C10">adding</del><ins class="proposed" data-c="34" title="PE-C10">2024), which drew on meta-analyses published after 2017, added</ins> 50 new entries and <del class="proposed" data-c="34" title="PE-C10">editing</del><ins class="proposed" data-c="34" title="PE-C10">edited</ins> 876 existing records; (2) assignment of weighted scores based on study quality, replication across populations, and statistical significance; and (3) pathway-based categorization for structured browsing.</p>
<p>The module's weighting scheme assigns two independent weight components whose product yields the displayed score. The <ins class="proposed" data-c="35" title="JA-C14g">single-nucleotide polymorphism (</ins>SNP<ins class="proposed" data-c="35" title="JA-C14g">)</ins> weight (<em>w</em>_SNP) is an integrative parameter reflecting the strength of statistical evidence for a variant-trait association (number of independent significant studies, reported p-values, number of replicating populations). The genotype weight (<em>w</em>_genotype) captures the direction and magnitude of the reported association for a specific genotype: 0 for the reference genotype, ±0.5 or ±1.0 for heterozygous or homozygous carriers of the positively or negatively associated allele. The displayed score is <em>W</em>_display = <em>w</em>_SNP × <em>w</em>_genotype. For structured browsing, variants are grouped into 12 functional pathway categories (lipid transfer, insulin/IGF-1 signalling, antioxidant defence, mitochondrial function, sirtuins, mTOR, tumour suppressors, renin-angiotensin system, heat-shock proteins, inflammation, genome maintenance, and other pathways). <del class="proposed" data-c="36" title="DS-C21">This categorization demonstrates how the module format supports structured presentation of variant annotations without requiring code.</del></p>
<p><strong>Figure 2.</strong> Just-DNA-Lite UI: the Longevity Variants report, showing pathway categorization, the per-variant SNP table, and colour-coded weights.</p>
<h3><strong>3.2 Polygenic Risk Scores</strong></h3>
<p>Polygenic risk scores (PRS) aggregate the effects of many <del class="proposed" data-c="37" title="PE-C11">common</del><ins class="proposed" data-c="37" title="PE-C11">genetic</ins> variants into a single weighted sum<del class="proposed" data-c="37" title="PE-C11">, providing a population-relative measure for a given trait</del> (Lambert et al., 2021)<ins class="proposed" data-c="37" title="PE-C11">; comparing that sum with a reference population's distribution places an individual within it</ins>. We developed the just-prs library (github.com/dna-seq/just-prs) as the PRS computation engine for Just-DNA-Lite. Although it powers PRS inside the platform, just-prs is a self-contained, separable component: it can equally be used on its own as a Python library, a command-line tool, an MCP server and agent skill (Section 3.2.1), or as a lightweight standalone PRS web application. just-prs provides access to all 5,000+ scoring files in the PGS Catalog.</p>
<p>Unlike the Generation I approach, which used Monte Carlo sampling to estimate percentile distributions, just-prs uses precomputed percentile distributions derived from the 1000 Genomes Project phase 3 dataset, against five superpopulations (AFR, AMR, EAS, EUR, SAS). <del class="proposed" data-c="38" title="PE-C12">Users</del><ins class="proposed" data-c="38" title="PE-C12">The</ins> <del class="proposed" data-c="38" title="PE-C12">select</del><ins class="proposed" data-c="38" title="PE-C12">web interface infers the closest superpopulation when a VCF is loaded and preselects it as</ins> the reference population<del class="proposed" data-c="38" title="PE-C12"> closest to their ancestry</del>, <del class="proposed" data-c="38" title="PE-C12">and</del><ins class="proposed" data-c="38" title="PE-C12">which users can change;</ins> the percentile reflects their position within that distribution<ins class="proposed" data-c="38" title="PE-C12"> (Section 6.4)</ins>.</p>
<p>just-prs provides two scoring engines: <del class="applied" data-c="39" title="deslop.C8"><strong></del>DuckDB<del class="applied" data-c="39" title="deslop.C8"></strong></del> (SQL-based, out-of-core scoring) and <del class="applied" data-c="39" title="deslop.C8"><strong></del>Polars<del class="applied" data-c="39" title="deslop.C8"></strong></del> (LazyFrame joins). PLINK2 is <del class="proposed" data-c="40" title="PE-C13">used</del><ins class="proposed" data-c="40" title="PE-C13">not</ins> <del class="proposed" data-c="40" title="PE-C13">only</del><ins class="proposed" data-c="40" title="PE-C13">a just-prs scoring engine; it served</ins> as <del class="proposed" data-c="40" title="PE-C13">an</del><ins class="proposed" data-c="40" title="PE-C13">the</ins> external benchmark comparator to assess agreement with an established tool<del class="proposed" data-c="40" title="PE-C13">;</del><ins class="proposed" data-c="40" title="PE-C13">,</ins> <del class="proposed" data-c="40" title="PE-C13">it is not provided as a</del><ins class="proposed" data-c="40" title="PE-C13">and</ins> just-prs <del class="proposed" data-c="40" title="PE-C13">scoring</del><ins class="proposed" data-c="40" title="PE-C13">also</ins> <del class="proposed" data-c="40" title="PE-C13">engine</del><ins class="proposed" data-c="40" title="PE-C13">uses a PLINK2 binary for linkage-disequilibrium pruning when it builds its reference models</ins>. Section 5.2 reports runtime and numerical agreement. In the web interface, users browse the PGS Catalog in a searchable grid, select scores, and click &quot;Compute&quot;; results show the score sum, matched-variant count, and percentile within the selected superpopulation.</p>
<p>For variant-only whole-genome VCFs, just-prs offers optional reference-homozygote restoration. A reference-allele dataset resolves otherwise unscorable absent loci, allowing them to contribute as homozygous reference when the user selects this mode. This can increase scoring-file coverage for many scores, under the assumption that the absent loci were callable and homozygous reference. Restoration is off by default<ins class="proposed" data-c="41" title="PE-C14"> in the just-prs library but on by default for whole-genome samples in the Just-DNA-Lite web interface</ins>; it is not applied to gVCF inputs, and array restoration is restricted to eligible chip positions with matching reference data.</p>
<p>The consumer-array workflow <ins class="proposed" data-c="42" title="PE-C15">of the standalone just-prs library, which the Just-DNA-Lite upload does not yet offer, </ins>accepts formats such as 23andMe and AncestryDNA and uses precomputed linkage disequilibrium (LD) proxy tables to estimate untyped scoring variants from typed proxies where suitable tables are available. LD-based estimation and reference-homozygote restoration address different sources of missingness: the former uses correlations between loci, while the latter assigns reference genotypes to eligible absent loci. Coverage and the assumptions used to recover missing information remain part of the result's interpretation.</p>
<p><strong>Figure 3. PRS results in Just-DNA-Lite (just-prs trait view).</strong> For a selected trait, all associated PGS Catalog models are computed and shown together as a consensus distribution with the user's percentile against a 1000 Genomes reference population, alongside per-model variant match rates and quality tiers. Showing the models together<del class="applied" data-c="43" title="deslop.C9"> —</del><ins class="applied" data-c="43" title="deslop.C9">,</ins> including where they disagree<del class="applied" data-c="43" title="deslop.C9"> —</del><ins class="applied" data-c="43" title="deslop.C9">,</ins> is deliberate (see Section 6.3).</p>
