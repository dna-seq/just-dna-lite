[project]
name = "just-dna-lite"
version = "0.3.20"
description = "Just DNA Lite version to analyze your omics faster"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
  "typer>=0.27.1",
  "just-dna-pipelines",
  "webui",
  "pyyaml>=6.0.3",
  "dagster-dg-cli>=1.13.17",
  "just-prs>=0.9.0",
  # The catalog client, pinned to the server's own version — `GET /api/v1/version` on
  # module-marketplace.just-dna.life reports registry 0.14.0, and 0.14.0 is on PyPI. Anything older
  # than 0.11.0 is unusable against that server: `just-dna-marketplace` was this package's old name,
  # and 0.8.1 (its last release under it) raises a pydantic ValidationError in its compatibility
  # guard before any request is sent, because 0.11.0 renamed `marketplace` to `registry` in the
  # version payload. Never point a dependency at a directory outside this repo — bump to a published
  # version instead.
  # 0.17.0 is the format-0.6 cut. `version.contract_compatible` treats a 0.x minor as breaking, so
  # this floor and the `just-dna-format` one move together: a 0.5-format client is refused by a
  # 0.6-format server and vice versa. The client *surface* did not move in 0.17.
  # 0.18.1/0.18.2 are the marketplace client rebuilt on the 0.6.3/0.6.4 tier. It keeps `just-dna-format>=0.6.1`, so
  # the *format* floor does not move with it this time — only the enricher does, and only for the
  # registry's `server` extra, which we do not install. Every client symbol we use is unchanged
  # (`RegistryClient`, `RegistryError`, `VersionMismatchError`, `generate_install_id`,
  # `validate_install_id`, `client_cli.app`, `version.contract_compatible`) — checked, not assumed.
  # Prod answers `registry 0.18.2 / format 0.6.1 / compiler 0.6.1`, so client and server agree and
  # there is no contract-mismatch window. Verify before assuming either way:
  #   curl -s $REGISTRY_URL/api/v1/version
  "just-dna-registry>=0.18.2",
  # grpcio-health-checking 1.82.0 ships _pb2 gencode built against protobuf 7.35.0,
  # but dagster still caps protobuf<7 — the resolved protobuf 6.x runtime is then older than
  # the gencode and dagster fails to import (VersionError in health_pb2). Dagster 1.13.13
  # added the same <1.82 cap; keep it at the workspace root so uv cannot float grpcio
  # independently. 1.81.1 is the last release built against protobuf 6.x gencode.
  "grpcio-health-checking<1.82",
  "grpcio<1.82",
]

[tool.uv.sources]
just-dna-pipelines = { workspace = true }
webui = { workspace = true }
# No `path =` / `editable =` sources outside this repo, ever. They make `uv sync` fail on every
# machine that lacks the sibling checkout ("Distribution not found at: file:///..."), including CI
# and containers. Workspace members only; everything else comes from PyPI with a version pin.

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
start = "just_dna_lite.cli:_start_all_cli"
ui = "webui.run:main"
serve = "webui.run:serve"
dagster-ui = "just_dna_lite.cli:_start_dagster_cli"
pipelines = "just_dna_lite.cli:app"
annotate = "just_dna_lite.cli:annotate_main"
kill-ports = "webui.run:kill_ports"

[tool.uv.workspace]
members = ["just-dna-pipelines", "webui"]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:eliottree.*",
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]
