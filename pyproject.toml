[project]
name = "just-dna-lite"
version = "0.3.26"
description = "Just DNA Lite version to analyze your omics faster"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
  "typer>=0.27.1",
  "just-dna-pipelines",
  "webui",
  "pyyaml>=6.0.3",
  "pydantic>=2.13.4",
  "dagster-dg-cli>=1.13.28",
  "just-prs>=0.11.0",
  # The catalog client. `version.contract_compatible` compares the installed `just-dna-format`
  # on client and server and treats a 0.x minor as breaking, so this floor moves with the format
  # floor in just-dna-pipelines/pyproject.toml, never alone. 0.28 is the format-0.8 cut; 0.30.0
  # (2026-11-11) floors format 0.8.4. Client changes since 0.27 are additive (`publish(recover_within=)`,
  # `list_modules(clin_sig=)`, `rename_namespace`, `lane_rows`); every symbol we import is unchanged.
  # Never point a dependency at a directory outside this repo. Verify what is deployed:
  #   curl -s $REGISTRY_URL/api/v1/version
  "just-dna-registry>=0.30.0",
]

[tool.uv.sources]
just-dna-pipelines = { workspace = true }
webui = { workspace = true }
# No `path =` / `editable =` sources outside this repo, ever. They make `uv sync` fail on every
# machine that lacks the sibling checkout ("Distribution not found at: file:///..."), including CI
# and containers. Workspace members only; everything else comes from PyPI with a version pin.

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pypandoc-binary>=1.17",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tecto>=0.17.0",
]

[project.scripts]
start = "just_dna_lite.cli:_start_all_cli"
ui = "webui.run:main"
serve = "webui.run:serve"
dagster-ui = "just_dna_lite.cli:_start_dagster_cli"
pipelines = "just_dna_lite.cli:app"
annotate = "just_dna_lite.cli:annotate_main"
kill-ports = "webui.run:kill_ports"
manuscript = "just_dna_lite.manuscript.cli:app"

[tool.uv.workspace]
members = ["just-dna-pipelines", "webui"]

[tool.uv]
reinstall-package = ["just-dna-lite", "just-dna-pipelines", "webui"]
# TEMPORARY, the workspace's only override. just-dna-enricher 0.8.4 floors `tenacity>=9.2.1`
# (upstream RM371: 9.2.1 is the first release with `multiplier`), and every google-genai release
# through 3.2.0 caps `tenacity<9.2.0`, so the trio cannot resolve beside agno's Gemini model.
# google-genai uses only `stop_after_attempt`, `retry_if_exception`, `wait_exponential_jitter`,
# `before_sleep_log` and `(Async)Retrying`, all unchanged in 9.2.1. Filed upstream as
# just-dna-compiler S149 -> RM436 (a shim on main, due in 0.8.5); remove this block once the
# enricher accepts a tenacity google-genai allows, or google-genai lifts its cap.
override-dependencies = ["tenacity>=9.2.1"]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:eliottree.*",
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]
